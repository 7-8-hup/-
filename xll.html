<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>聊天助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#fff;color:#1a1a1a;font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;background:#fff;display:flex;flex-direction:column;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #ebebf0;flex-shrink:0;gap:8px;}
header h1{font-size:15px;font-weight:600;letter-spacing:-0.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding:0 4px;}
.icon-btn{width:36px;height:36px;border:none;background:transparent;border-radius:50%;font-size:18px;cursor:pointer;
  color:#666;display:inline-flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.icon-btn:hover{background:#f5f5f7;}
main{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.empty{margin:auto;color:#999;text-align:center;font-size:14px;line-height:1.8;}
.bubble{max-width:80%;padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.45;word-break:break-word;
  animation:pop .2s ease;position:relative;transition:transform .15s,filter .15s;user-select:text;}
@keyframes pop{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.bubble.pressing{transform:scale(0.97);filter:brightness(0.95);}
.bubble.ta{align-self:flex-start;background:#f5f5f7;color:#1a1a1a;border-bottom-left-radius:6px;}
.bubble.me{align-self:flex-end;background:#7c5cff;color:#fff;border-bottom-right-radius:6px;}
.suggestions{flex-shrink:0;padding:0 18px 12px;display:none;flex-direction:column;gap:8px;}
.suggestions.show{display:flex;}
.s-title{font-size:12px;color:#999;font-weight:500;padding:4px 0;display:flex;align-items:center;justify-content:space-between;}
.spinner{width:12px;height:12px;border:2px solid #ebebf0;border-top-color:#7c5cff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.s-card{background:#f5f5f7;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.45;cursor:pointer;
  transition:background .15s,transform .1s;display:flex;align-items:flex-start;gap:10px;}
.s-card:hover{background:#efeff4;}
.s-card:active{background:#e8e8ee;transform:scale(0.995);}
.s-card.copied{background:#ecfdf5;}
.s-card .s-text{flex:1;min-width:0;}
.s-card .s-badge{font-size:11px;color:#999;background:#fff;padding:2px 8px;border-radius:8px;flex-shrink:0;font-weight:500;}
.s-card.copied .s-badge{color:#059669;background:#d1fae5;}

/* ============ 情境栏 ============ */
.status-bar{display:flex;align-items:center;gap:8px;padding:9px 16px;background:#fffbeb;
  border-top:1px solid #fef3c7;font-size:12px;color:#92400e;cursor:pointer;flex-shrink:0;
  transition:background .15s;min-height:36px;}
.status-bar:hover{background:#fef3c7;}
.status-bar.empty .status-text{color:#b45309;opacity:0.75;}
.status-bar .status-icon{font-size:14px;flex-shrink:0;line-height:1;}
.status-bar .status-content{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4;}
.status-bar .status-text{color:#92400e;font-weight:500;}
.status-bar .status-text.placeholder{font-weight:400;}
.status-bar .status-edit{border:none;background:transparent;color:#b45309;font-size:13px;cursor:pointer;
  padding:2px 6px;border-radius:6px;flex-shrink:0;line-height:1;}
.status-bar .status-edit:hover{background:#fde68a;}
.status-bar .status-input{flex:1;min-width:0;border:none;background:transparent;font-size:13px;
  font-family:inherit;color:#78350f;outline:none;font-weight:500;padding:0;}
.status-bar .status-input::placeholder{color:#b45309;opacity:0.6;font-weight:400;}

.composer{flex-shrink:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ebebf0;
  display:flex;align-items:center;gap:8px;background:#fff;}
.composer input{flex:1;min-width:0;height:40px;padding:0 14px;border:none;background:#f5f5f7;border-radius:20px;
  font-size:15px;outline:none;color:#1a1a1a;font-family:inherit;}
.composer input:focus{background:#efeff4;}
.composer input::placeholder{color:#999;}
.send-btn{width:36px;height:36px;border-radius:50%;border:none;background:#7c5cff;color:#fff;font-size:18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s;flex-shrink:0;}
.send-btn:hover{background:#6a4ae6;}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}
.send-btn:active:not(:disabled){transform:scale(0.95);}
.img-preview{padding:0 16px 8px;display:none;align-items:center;gap:8px;flex-shrink:0;}
.img-preview.show{display:flex;}
.img-preview img{width:56px;height:56px;object-fit:cover;border-radius:10px;}
.img-preview button{border:none;background:transparent;color:#999;font-size:16px;cursor:pointer;padding:4px;}

/* ============ 长按菜单 ============ */
.action-sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:500;opacity:0;pointer-events:none;
  transition:opacity .2s;}
.action-sheet-mask.show{opacity:1;pointer-events:auto;}
.action-sheet{position:fixed;bottom:0;left:0;right:0;z-index:501;
  transform:translateY(100%);transition:transform .25s cubic-bezier(0.4,0,0.2,1);
  padding:0 12px calc(12px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;box-sizing:border-box;}
.action-sheet.show{transform:translateY(0);}
.action-sheet-inner{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 -4px 24px rgba(0,0,0,0.1);}
.action-sheet .preview{padding:14px 18px;font-size:12px;color:#666;border-bottom:1px solid #ebebf0;
  max-height:100px;overflow:hidden;line-height:1.5;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.action-sheet .preview .pv-who{font-weight:600;color:#7c5cff;font-size:11px;margin-right:4px;}
.action-sheet .btn-item{display:block;width:100%;padding:15px;border:none;background:transparent;
  font-size:16px;font-family:inherit;color:#1a1a1a;cursor:pointer;text-align:center;
  border-bottom:1px solid #ebebf0;font-weight:500;transition:background .15s;}
.action-sheet .btn-item:last-child{border-bottom:none;}
.action-sheet .btn-item:hover{background:#f5f5f7;}
.action-sheet .btn-item:active{background:#ebebf0;}
.action-sheet .btn-item.danger{color:#dc2626;}
.action-sheet .btn-item.cancel{color:#666;font-weight:400;}

/* 对话抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s;}
.drawer-mask.show{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:340px;background:#fff;z-index:201;
  transform:translateX(-100%);transition:transform .28s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,0.08);}
.drawer.show{transform:translateX(0);}
.drawer-header{padding:16px 16px 12px;border-bottom:1px solid #ebebf0;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:8px;}
.drawer-header h2{font-size:16px;font-weight:600;}
.new-chat-btn{padding:8px 14px;border:none;border-radius:10px;background:#7c5cff;color:#fff;
  font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;
  transition:background .15s;}
.new-chat-btn:hover{background:#6a4ae6;}
.new-chat-btn:active{transform:scale(0.96);}
.session-list{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch;}
.session-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;
  cursor:pointer;transition:background .15s;position:relative;margin-bottom:2px;}
.session-item:hover{background:#f5f5f7;}
.session-item.active{background:#f0ecff;}
.session-item.active .session-title{color:#5b3dd6;font-weight:600;}
.session-item .s-body{flex:1;min-width:0;}
.session-item .session-title{font-size:14px;font-weight:500;color:#1a1a1a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.session-item .session-meta{font-size:11px;color:#999;margin-top:3px;
  display:flex;align-items:center;gap:6px;}
.session-item .session-meta .pin{color:#d97706;}
.session-item .session-del{width:26px;height:26px;border:none;background:transparent;color:#c0c0c8;
  font-size:15px;cursor:pointer;border-radius:50%;flex-shrink:0;transition:all .15s;
  display:inline-flex;align-items:center;justify-content:center;opacity:0;}
.session-item:hover .session-del{opacity:1;}
.session-item.active .session-del{opacity:0.6;}
.session-item .session-del:hover{background:#fee2e2;color:#dc2626;opacity:1 !important;}
.session-empty{color:#999;font-size:13px;text-align:center;padding:30px 0;}

/* 设置面板 */
.settings-panel{position:fixed;inset:0;background:#fff;z-index:100;transform:translateX(100%);
  transition:transform .25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;overflow:hidden;}
.settings-panel.show{transform:translateX(0);}
.sp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  border-bottom:1px solid #ebebf0;flex-shrink:0;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;}
.sp-header h2{font-size:16px;font-weight:600;}
.sp-body{flex:1;overflow-y:auto;padding:18px 18px 40px;-webkit-overflow-scrolling:touch;
  max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;}
.section-title{font-size:13px;font-weight:600;color:#666;margin-bottom:10px;}
.section-title .sub{font-weight:400;color:#999;font-size:11px;margin-left:4px;}
.api-row{background:#fafafc;border:1.5px solid #ebebf0;border-radius:12px;padding:10px 12px;margin-bottom:10px;
  transition:border-color .15s,background .15s;}
.api-row.has-key{background:#fff;border-color:#d8d8e3;}
.api-row.is-default{background:#faf8ff;border-color:#7c5cff;}
.api-row-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.api-row-header .api-icon{font-size:18px;line-height:1;flex-shrink:0;}
.api-row-header .api-name{font-size:14px;font-weight:600;color:#1a1a1a;flex:1;min-width:0;}
.api-row-header .api-tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;line-height:1.6;flex-shrink:0;}
.api-row-header .api-tag.vision{background:#e0f2fe;color:#0369a1;}
.api-row-header .api-tag.no-vision{background:#f3f4f6;color:#9ca3af;}
.api-row-header .default-btn{font-size:11px;padding:3px 9px;border-radius:8px;border:1px solid #ebebf0;
  background:#fff;color:#999;cursor:pointer;font-family:inherit;font-weight:500;flex-shrink:0;transition:all .15s;}
.api-row-header .default-btn:hover{border-color:#7c5cff;color:#7c5cff;}
.api-row-header .default-btn.active{background:#7c5cff;color:#fff;border-color:#7c5cff;}
.api-row input{width:100%;height:38px;padding:0 12px;border:1px solid #ebebf0;background:#fff;border-radius:10px;
  font-size:13px;outline:none;color:#1a1a1a;font-family:ui-monospace,monospace;transition:border-color .15s;}
.api-row input:focus{border-color:#7c5cff;}
.api-row input::placeholder{color:#bbb;font-family:inherit;}
.field{margin-bottom:24px;}
.field > label{display:block;font-size:13px;font-weight:600;color:#666;margin-bottom:10px;}
.field input[type=text]{width:100%;height:44px;padding:0 14px;border:1px solid #ebebf0;
  background:#fff;border-radius:12px;font-size:15px;outline:none;color:#1a1a1a;font-family:inherit;transition:border-color .15s;}
.field input[type=text]:focus{border-color:#7c5cff;}
.hint{font-size:12px;color:#999;line-height:1.6;margin-top:8px;}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(8px);background:rgba(30,30,35,0.95);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:999;max-width:80%;text-align:center;font-weight:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.img-modal img{max-width:92vw;max-height:90vh;border-radius:12px;object-fit:contain;}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="drawerBtn" aria-label="对话列表">☰</button>
    <h1 id="headerTitle">聊天助手</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️</button>
  </header>
  <main id="messages">
    <div class="empty">输入对方的话<br>获取 3 条回复建议<br><span style="font-size:12px;color:#bbb;margin-top:8px;display:inline-block;">长按消息可删除</span></div>
  </main>
  <section class="suggestions" id="suggestions">
    <div class="s-title">
      <span id="sTitleText">回复建议</span>
      <span id="sTitleSpinner" style="display:none" class="spinner"></span>
    </div>
    <div id="sList"></div>
  </section>

  <!-- ★ 情境栏 -->
  <div class="status-bar empty" id="statusBar"></div>

  <div class="img-preview" id="imgPreview">
    <img id="previewImg" alt="">
    <button id="removeImg" aria-label="移除">✕</button>
  </div>
  <div class="composer">
    <button class="icon-btn" id="imageBtn" aria-label="图片">📷</button>
    <input type="text" id="input" placeholder="对方说了什么..." autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="发送">↑</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<!-- 长按操作面板 -->
<div class="action-sheet-mask" id="sheetMask"></div>
<div class="action-sheet" id="sheet">
  <div class="action-sheet-inner">
    <div class="preview" id="sheetPreview"></div>
    <button class="btn-item danger" id="sheetDelete">🗑️ 删除这条消息</button>
    <button class="btn-item cancel" id="sheetCancel">取消</button>
  </div>
</div>

<!-- 对话抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>对话</h2>
    <button class="new-chat-btn" id="newChatBtn">+ 新对话</button>
  </div>
  <div class="session-list" id="sessionList"></div>
</aside>

<!-- 设置面板 -->
<div class="settings-panel" id="settings">
  <div class="sp-header">
    <h2>设置</h2>
    <button class="icon-btn" id="closeSettings" aria-label="关闭">✕</button>
  </div>
  <div class="sp-body">
    <div class="field">
      <div class="section-title">我的 API <span class="sub">填几个用几个，输入即保存</span></div>
      <div id="apiForm"></div>
      <div class="hint">💡 发文字会用「默认」的 API；发图片自动切换到支持图片的 API（带 📷 标记）。</div>
    </div>
    <div class="field">
      <label>我的昵称（可选）</label>
      <input type="text" id="myName" placeholder="让 AI 更懂你" autocomplete="off">
    </div>
    <div class="field">
      <label>对方昵称（可选）</label>
      <input type="text" id="taName" placeholder="让 AI 更懂你们的关系" autocomplete="off">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

const PROVIDERS = {
  deepseek:  { name:'DeepSeek',  icon:'🐋', url:'https://api.deepseek.com/chat/completions', model:'deepseek-chat', visionModel:null, format:'openai', vision:false },
  zhipu:     { name:'智谱 GLM',  icon:'🧠', url:'https://open.bigmodel.cn/api/paas/v4/chat/completions', model:'glm-4-air', visionModel:'glm-4v', format:'openai', vision:true, jsonMode:true },
  kimi:      { name:'Kimi',      icon:'🌙', url:'https://api.moonshot.cn/v1/chat/completions', model:'moonshot-v1-8k', visionModel:'moonshot-v1-8k-vision-preview', format:'openai', vision:true },
  qwen:      { name:'通义千问',  icon:'☁️', url:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model:'qwen-plus', visionModel:'qwen-vl-max', format:'openai', vision:true },
  openai:    { name:'OpenAI',    icon:'🟢', url:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini', visionModel:'gpt-4o', format:'openai', vision:true, jsonMode:true },
  doubao:    { name:'豆包',      icon:'🎵', url:'https://ark.cn-beijing.volces.com/api/v3/chat/completions', model:'doubao-pro-32k', visionModel:'doubao-vision-pro-32k', format:'openai', vision:true },
  anthropic: { name:'Claude',    icon:'🅰️', url:'https://api.anthropic.com/v1/messages', model:'claude-3-5-sonnet-20241022', visionModel:'claude-3-5-sonnet-20241022', format:'anthropic', vision:true },
  google:    { name:'Gemini',    icon:'🔷', url:'https://generativelanguage.googleapis.com/v1beta/models', model:'gemini-2.0-flash', visionModel:'gemini-2.0-flash', format:'google', vision:true }
};
const PROVIDER_ORDER = ['deepseek','qwen','kimi','zhipu','openai','doubao','anthropic','google'];

function genId(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

const state = {
  sessions: [], currentSessionId: '',
  apiKeys: {}, defaultProvider: '',
  myName:'', taName:'',
  imageBase64:null, loading:false,
  pendingDeleteIdx: -1
};
PROVIDER_ORDER.forEach(pid => { state.apiKeys[pid] = ''; });

const $ = id => document.getElementById(id);
const dom = {
  messages:$('messages'), suggestions:$('suggestions'), sList:$('sList'),
  sTitleText:$('sTitleText'), sTitleSpinner:$('sTitleSpinner'),
  imgPreview:$('imgPreview'), previewImg:$('previewImg'), removeImg:$('removeImg'),
  imageBtn:$('imageBtn'), fileInput:$('fileInput'),
  input:$('input'), sendBtn:$('sendBtn'),
  headerTitle:$('headerTitle'),
  statusBar:$('statusBar'),
  drawerBtn:$('drawerBtn'), drawer:$('drawer'), drawerMask:$('drawerMask'),
  newChatBtn:$('newChatBtn'), sessionList:$('sessionList'),
  settingsBtn:$('settingsBtn'), settings:$('settings'),
  closeSettings:$('closeSettings'),
  apiForm:$('apiForm'), myName:$('myName'), taName:$('taName'), toast:$('toast'),
  sheet:$('sheet'), sheetMask:$('sheetMask'), sheetPreview:$('sheetPreview'),
  sheetDelete:$('sheetDelete'), sheetCancel:$('sheetCancel')
};

let toastTimer = null;
function toast(msg, dur=1800, type=''){
  clearTimeout(toastTimer);
  dom.toast.textContent = msg;
  dom.toast.style.background = type==='error' ? 'rgba(220,38,38,0.95)'
    : type==='success' ? 'rgba(5,150,105,0.95)'
    : 'rgba(30,30,35,0.95)';
  dom.toast.classList.add('show');
  toastTimer = setTimeout(()=>dom.toast.classList.remove('show'), dur);
}
function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function toAscii(s){ return String(s||'').replace(/[^\x00-\x7F]/g,''); }

// ============ 会话 ============
function getCurrentSession(){
  if(!state.currentSessionId || state.sessions.length === 0){
    if(state.sessions.length === 0) createSession(false);
    state.currentSessionId = state.sessions[0].id;
  }
  return state.sessions.find(s => s.id === state.currentSessionId) || state.sessions[0];
}
function createSession(switchTo = true){
  const session = {
    id: genId(),
    messages: [],
    status: '',   // ★ 情境描述
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  state.sessions.unshift(session);
  if(switchTo) state.currentSessionId = session.id;
  return session;
}
function generateSessionTitle(session){
  if(!session || !session.messages || session.messages.length === 0) return '新对话';
  const first = session.messages.find(m => m.role === 'ta') || session.messages[0];
  const text = String(first.text || '').trim().replace(/\s+/g, ' ');
  if(!text) return '新对话';
  return text.length > 18 ? text.slice(0, 18) + '…' : text;
}
function formatTime(ts){
  if(!ts) return '';
  const now = Date.now();
  const diff = now - ts;
  if(diff < 60*1000) return '刚刚';
  if(diff < 60*60*1000) return Math.floor(diff/60000) + '分钟前';
  if(diff < 24*60*60*1000) return Math.floor(diff/3600000) + '小时前';
  if(diff < 7*24*60*60*1000) return Math.floor(diff/86400000) + '天前';
  const d = new Date(ts);
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}

// ============ 存储 ============
const KEY = 'chat_multi_v4';
const OLD_KEYS = ['chat_multi_v3','chat_multi_v2','chat_multi_v1','chat_simple_v4','chat_simple_v3','chat_simple_v2','chat_simple_v1'];

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      sessions: state.sessions,
      currentSessionId: state.currentSessionId,
      apiKeys: state.apiKeys,
      defaultProvider: state.defaultProvider,
      myName: state.myName, taName: state.taName
    }));
  }catch(e){ console.warn('保存失败', e); }
}
function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(!raw){
      for(const k of OLD_KEYS){
        const old = localStorage.getItem(k);
        if(old){
          try{
            const d = JSON.parse(old);
            if(Array.isArray(d.apis)){
              d.apis.forEach(a => { if(a.provider && a.apiKey) state.apiKeys[a.provider] = a.apiKey; });
              const active = d.apis.find(a => a.id === d.activeApiId);
              if(active) state.defaultProvider = active.provider;
            }
            if(d.apiKey && d.provider) state.apiKeys[d.provider] = d.apiKey;
            if(d.apiKeys) Object.assign(state.apiKeys, d.apiKeys);
            if(d.defaultProvider) state.defaultProvider = d.defaultProvider;

            // 会话迁移
            if(Array.isArray(d.sessions)){
              state.sessions = d.sessions.map(s => ({
                id: s.id || genId(),
                messages: s.messages || [],
                status: s.status || '',
                createdAt: s.createdAt || Date.now(),
                updatedAt: s.updatedAt || Date.now()
              }));
              state.currentSessionId = d.currentSessionId || (state.sessions[0]?.id || '');
            } else if(Array.isArray(d.messages) && d.messages.length > 0){
              const s = { id: genId(), messages: d.messages, status: '', createdAt: Date.now(), updatedAt: Date.now() };
              state.sessions = [s];
              state.currentSessionId = s.id;
            }
            state.myName = d.myName || '';
            state.taName = d.taName || '';
            save();
          }catch(e){}
          return;
        }
      }
      return;
    }
    const d = JSON.parse(raw);
    state.sessions = Array.isArray(d.sessions) ? d.sessions.map(s => ({
      id: s.id || genId(),
      messages: s.messages || [],
      status: s.status || '',
      createdAt: s.createdAt || Date.now(),
      updatedAt: s.updatedAt || Date.now()
    })) : [];
    state.currentSessionId = d.currentSessionId || '';
    state.apiKeys = Object.assign({}, state.apiKeys, d.apiKeys || {});
    state.defaultProvider = d.defaultProvider || '';
    state.myName = d.myName || '';
    state.taName = d.taName || '';

    if(state.defaultProvider && !state.apiKeys[state.defaultProvider]) state.defaultProvider = '';
    if(!state.defaultProvider){
      state.defaultProvider = Object.keys(state.apiKeys).find(p => state.apiKeys[p]) || '';
    }
    if(state.sessions.length === 0){
      createSession(true);
    } else if(!state.currentSessionId || !state.sessions.find(s => s.id === state.currentSessionId)){
      state.currentSessionId = state.sessions[0].id;
    }
  }catch(e){}
}

// ============ API 选择 ============
function getDefaultApi(){
  const pid = state.defaultProvider;
  if(pid && state.apiKeys[pid]) return { provider: pid, apiKey: state.apiKeys[pid] };
  const first = PROVIDER_ORDER.find(p => state.apiKeys[p]);
  if(first) return { provider: first, apiKey: state.apiKeys[first] };
  return null;
}
function getImageApi(){
  const def = getDefaultApi();
  if(def && PROVIDERS[def.provider].vision) return def;
  for(const pid of PROVIDER_ORDER){
    if(state.apiKeys[pid] && PROVIDERS[pid].vision){
      return { provider: pid, apiKey: state.apiKeys[pid] };
    }
  }
  return null;
}

// ============ 渲染 ============
function renderHeader(){
  const s = getCurrentSession();
  const title = generateSessionTitle(s);
  dom.headerTitle.textContent = (title === '新对话' || !title) ? '聊天助手' : title;
  dom.headerTitle.title = title;
}

// ★ 情境栏渲染
function renderStatusBar(){
  const session = getCurrentSession();
  const status = (session && session.status) || '';
  if (status){
    dom.statusBar.classList.remove('empty');
    dom.statusBar.innerHTML =
      '<span class="status-icon">📌</span>'
      + '<div class="status-content"><span class="status-text">' + esc(status) + '</span></div>'
      + '<button class="status-edit" aria-label="编辑">✎</button>';
  } else {
    dom.statusBar.classList.add('empty');
    dom.statusBar.innerHTML =
      '<span class="status-icon">📌</span>'
      + '<div class="status-content"><span class="status-text placeholder">添加情境描述（可选）</span></div>'
      + '<button class="status-edit" aria-label="编辑">✎</button>';
  }
}

// ★ 进入编辑状态
function editStatus(){
  const session = getCurrentSession();
  if(!session) return;
  const cur = session.status || '';
  dom.statusBar.classList.remove('empty');
  dom.statusBar.innerHTML =
    '<span class="status-icon">📌</span>'
    + '<input type="text" class="status-input" id="statusInput" value="' + esc(cur) + '" placeholder="例如：对方刚加班完很累，心情不好" maxlength="200">';
  const input = $('statusInput');
  input.focus();
  try { input.setSelectionRange(cur.length, cur.length); } catch(e){}

  let done = false;
  const finish = (saveVal) => {
    if(done) return;
    done = true;
    const val = (typeof saveVal === 'string') ? saveVal : input.value.trim();
    session.status = val;
    session.updatedAt = Date.now();
    save();
    renderStatusBar();
    if (val !== cur){
      toast(val ? '已更新情境' : '已清除情境', 1000, 'success');
    }
  };
  input.addEventListener('blur', () => finish());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); input.blur(); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(cur); }
  });
}

function renderMessages(){
  const session = getCurrentSession();
  const msgs = session.messages || [];
  if(msgs.length === 0){
    dom.messages.innerHTML = '<div class="empty">输入对方的话<br>获取 3 条回复建议<br><span style="font-size:12px;color:#bbb;margin-top:8px;display:inline-block;">长按消息可删除</span></div>';
    return;
  }
  let html = '';
  msgs.forEach((m, i)=>{
    const cls = m.role === 'ta' ? 'ta' : 'me';
    html += '<div class="bubble '+cls+'" data-idx="'+i+'">'+esc(m.text)+'</div>';
  });
  dom.messages.innerHTML = html;
  // ★ 绑定长按删除
  dom.messages.querySelectorAll('.bubble').forEach(bubble => {
    attachBubbleLongPress(bubble);
  });
  dom.messages.scrollTop = dom.messages.scrollHeight;
}

// ★ 长按 / 右键 → 弹出操作面板
function attachBubbleLongPress(bubble){
  const idx = parseInt(bubble.dataset.idx);
  let timer = null;
  let triggered = false;

  const startPress = () => {
    triggered = false;
    bubble.classList.add('pressing');
    timer = setTimeout(() => {
      triggered = true;
      bubble.classList.remove('pressing');
      openActionSheet(idx);
      if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
    }, 550);
  };
  const cancelPress = () => {
    clearTimeout(timer);
    bubble.classList.remove('pressing');
  };

  bubble.addEventListener('touchstart', startPress, { passive: true });
  bubble.addEventListener('touchend', cancelPress);
  bubble.addEventListener('touchcancel', cancelPress);
  bubble.addEventListener('touchmove', cancelPress, { passive: true });

  bubble.addEventListener('mousedown', startPress);
  bubble.addEventListener('mouseup', cancelPress);
  bubble.addEventListener('mouseleave', cancelPress);

  // 右键（桌面端）
  bubble.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    openActionSheet(idx);
  });
}

// ★ 弹出操作面板
function openActionSheet(idx){
  const session = getCurrentSession();
  const msg = session.messages[idx];
  if (!msg) return;
  state.pendingDeleteIdx = idx;
  const who = msg.role === 'ta' ? '对方' : '我';
  dom.sheetPreview.innerHTML = '<span class="pv-who">' + who + '：</span>' + esc(msg.text);
  dom.sheetMask.classList.add('show');
  dom.sheet.classList.add('show');
}

function closeActionSheet(){
  dom.sheetMask.classList.remove('show');
  dom.sheet.classList.remove('show');
  state.pendingDeleteIdx = -1;
}

// ★ 删除消息
function deletePendingMessage(){
  const idx = state.pendingDeleteIdx;
  const session = getCurrentSession();
  if (!session || idx < 0 || !session.messages[idx]){ closeActionSheet(); return; }
  session.messages.splice(idx, 1);
  session.updatedAt = Date.now();
  // 删除消息后清空旧建议，避免上下文错乱
  state.suggestions = [];
  state.loading = false;
  save();
  closeActionSheet();
  renderMessages();
  renderSuggestions();
  renderHeader();
  renderStatusBar();
  toast('已删除', 1000, 'success');
}

function renderSuggestions(){
  if(state.loading){
    dom.suggestions.classList.add('show');
    dom.sList.innerHTML = '';
    dom.sTitleText.textContent = '生成中...';
    dom.sTitleSpinner.style.display = 'inline-block';
    return;
  }
  dom.sTitleSpinner.style.display = 'none';
  if(!state.suggestions || state.suggestions.length === 0){
    dom.suggestions.classList.remove('show');
    dom.sList.innerHTML = '';
    return;
  }
  dom.suggestions.classList.add('show');
  dom.sTitleText.textContent = '点击复制发送';
  let html = '';
  state.suggestions.forEach((s, i)=>{
    html += '<div class="s-card" data-idx="'+i+'">'
      + '<div class="s-text">'+esc(s.text)+'</div>'
      + (s.style ? '<div class="s-badge">'+esc(s.style)+'</div>' : '')
      + '</div>';
  });
  dom.sList.innerHTML = html;
  dom.sList.querySelectorAll('.s-card').forEach(card=>{
    card.addEventListener('click', ()=>copySuggestion(parseInt(card.dataset.idx), card));
  });
}

function copySuggestion(idx, card){
  const s = state.suggestions[idx];
  if(!s) return;
  const text = s.text;
  const done = ()=>{
    card.classList.add('copied');
    const session = getCurrentSession();
    session.messages.push({role:'me', text});
    session.updatedAt = Date.now();
    state.suggestions = [];
    save();
    setTimeout(()=>{
      renderMessages();
      renderSuggestions();
      renderHeader();
      toast('已复制', 1200, 'success');
    }, 200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }
  catch(e){ toast('复制失败', 1500, 'error'); }
  document.body.removeChild(ta);
}

// ============ 对话抽屉 ============
function openDrawer(){
  renderSessionList();
  dom.drawerMask.classList.add('show');
  dom.drawer.classList.add('show');
}
function closeDrawer(){
  dom.drawerMask.classList.remove('show');
  dom.drawer.classList.remove('show');
}
function renderSessionList(){
  if(state.sessions.length === 0){
    dom.sessionList.innerHTML = '<div class="session-empty">还没有对话</div>';
    return;
  }
  const sorted = [...state.sessions].sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  let html = '';
  sorted.forEach(s => {
    const isActive = s.id === state.currentSessionId;
    const title = generateSessionTitle(s);
    const count = (s.messages || []).length;
    const hasStatus = !!s.status;
    const meta = count > 0
      ? count + ' 条消息 · ' + formatTime(s.updatedAt)
      : (hasStatus ? '情境已设置' : '空对话');
    const pin = hasStatus ? '<span class="pin" title="已设置情境">📌</span>' : '';
    html += '<div class="session-item'+(isActive?' active':'')+'" data-id="'+s.id+'">'
      + '<div class="s-body">'
      +   '<div class="session-title">'+esc(title)+'</div>'
      +   '<div class="session-meta">'+ pin + esc(meta) +'</div>'
      + '</div>'
      + '<button class="session-del" data-del="'+s.id+'" aria-label="删除">✕</button>'
      + '</div>';
  });
  dom.sessionList.innerHTML = html;

  dom.sessionList.querySelectorAll('.session-item').forEach(item => {
    item.addEventListener('click', e => {
      if(e.target.closest('.session-del')) return;
      switchSession(item.dataset.id);
    });
  });
  dom.sessionList.querySelectorAll('.session-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteSession(btn.dataset.del);
    });
  });
}
function switchSession(id){
  if(state.currentSessionId === id){ closeDrawer(); return; }
  state.currentSessionId = id;
  state.suggestions = [];
  state.loading = false;
  save();
  renderHeader();
  renderMessages();
  renderSuggestions();
  renderStatusBar();
  closeDrawer();
  setTimeout(() => { dom.messages.scrollTop = dom.messages.scrollHeight; }, 50);
}
function deleteSession(id){
  const session = state.sessions.find(s => s.id === id);
  if(!session) return;
  const count = (session.messages || []).length;
  const msg = count > 0
    ? '删除该对话及 ' + count + ' 条消息？'
    : '删除这个空对话？';
  if(!confirm(msg)) return;

  state.sessions = state.sessions.filter(s => s.id !== id);
  if(state.sessions.length === 0){
    createSession(true);
  } else if(state.currentSessionId === id){
    state.currentSessionId = state.sessions[0].id;
    state.suggestions = [];
    state.loading = false;
  }
  save();
  renderSessionList();
  renderHeader();
  renderMessages();
  renderSuggestions();
  renderStatusBar();
  toast('已删除', 1000);
}
function handleNewChat(){
  const cur = getCurrentSession();
  if(cur && (cur.messages || []).length === 0 && !cur.status){
    closeDrawer();
    toast('当前已经是新对话', 1200);
    return;
  }
  createSession(true);
  state.suggestions = [];
  state.loading = false;
  save();
  renderHeader();
  renderMessages();
  renderSuggestions();
  renderStatusBar();
  closeDrawer();
  dom.input.focus();
  toast('已新建对话', 1000, 'success');
}

// ============ 发送 ============
async function handleSend(){
  if(state.loading) return;
  const text = dom.input.value.trim();
  if(!text && !state.imageBase64){ toast('请输入内容', 1200); return; }

  let usedApi;
  let switchedForImage = false;
  if(state.imageBase64){
    usedApi = getImageApi();
    if(!usedApi){
      toast('没有支持图片的 API，请在设置里填入通义/Kimi/OpenAI 等', 3000, 'error');
      return;
    }
    const def = getDefaultApi();
    if(def && def.provider !== usedApi.provider) switchedForImage = true;
  } else {
    usedApi = getDefaultApi();
    if(!usedApi){
      toast('请先在设置里填入 API Key', 1800, 'error');
      openSettings();
      return;
    }
  }

  const session = getCurrentSession();
  const finalText = text || '请描述这张图片';
  session.messages.push({role:'ta', text: finalText});
  session.updatedAt = Date.now();
  dom.input.value = '';
  save();
  renderMessages();
  renderHeader();

  state.loading = true;
  renderSuggestions();
  dom.sendBtn.disabled = true;

  try{
    const result = await callAI(usedApi, session);
    state.suggestions = result.suggestions || [];
    state.loading = false;
    save();
    renderSuggestions();
    if(state.imageBase64) clearImage();
    if(switchedForImage){
      const p = PROVIDERS[usedApi.provider];
      toast('📷 已用 ' + p.name + ' 识别图片', 1500, 'success');
    }
  }catch(err){
    state.loading = false;
    if(session.messages.length > 0 && session.messages[session.messages.length-1].role === 'ta'){
      session.messages.pop();
      session.updatedAt = Date.now();
      save();
      renderMessages();
    }
    renderSuggestions();
    toast('❌ '+err.message, 3500, 'error');
  }finally{
    dom.sendBtn.disabled = false;
  }
}

// ============ 图片 ============
function compressImage(dataUrl, maxBytes = 500*1024){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const maxDim = 1600;
      if(w > maxDim || h > maxDim){
        const r = Math.min(maxDim/w, maxDim/h);
        w = Math.round(w*r); h = Math.round(h*r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const tryC = q => {
        const result = c.toDataURL('image/jpeg', q);
        if(result.length < maxBytes || q < 0.1) resolve(result);
        else tryC(q - 0.05);
      };
      tryC(0.9);
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}
function handleImageSelect(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('请选择图片', 1200, 'error'); return; }
  if(file.size > 20*1024*1024){ toast('图片过大（>20MB）', 1500, 'error'); return; }
  if(!getImageApi()){
    toast('没有支持图片的 API，请先添加', 2500, 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const compressed = await compressImage(e.target.result);
      state.imageBase64 = compressed;
      dom.previewImg.src = compressed;
      dom.imgPreview.classList.add('show');
      toast('图片已加载', 1000, 'success');
    }catch(err){ toast('图片处理失败', 1500, 'error'); }
  };
  reader.readAsDataURL(file);
}
function clearImage(){
  state.imageBase64 = null;
  dom.previewImg.src = '';
  dom.imgPreview.classList.remove('show');
  dom.fileInput.value = '';
}
function showImageModal(src){
  const m = document.createElement('div');
  m.className = 'img-modal';
  m.innerHTML = '<img src="'+src+'">';
  m.addEventListener('click', ()=>m.remove());
  document.body.appendChild(m);
}

// ============ JSON 容错 ============
function extractJSON(content){
  if(!content || typeof content !== 'string') return null;
  const text = content.trim();
  try { return JSON.parse(text); } catch(e){}
  let cleaned = text.replace(/^```(?:json|JSON)?\s*\n?/i, '').replace(/\n?\s*```\s*$/i, '').trim();
  try { return JSON.parse(cleaned); } catch(e){}
  const fb = text.indexOf('{'), lb = text.lastIndexOf('}');
  if (fb >= 0 && lb > fb){
    const js = text.substring(fb, lb + 1);
    try { return JSON.parse(js); } catch(e){}
    let fixed = js.replace(/[""]/g, '"').replace(/['']/g, "'").replace(/,\s*([\]}])/g, '$1');
    try { return JSON.parse(fixed); } catch(e){}
    try { return JSON.parse(fixed.replace(/[\x00-\x1F\x7F]/g, ' ')); } catch(e){}
  }
  const fB = text.indexOf('['), lB = text.lastIndexOf(']');
  if (fB >= 0 && lB > fB){
    try {
      const arr = JSON.parse(text.substring(fB, lB + 1));
      if (Array.isArray(arr)) return { suggestions: arr };
    } catch(e){}
  }
  return null;
}
function textFallback(content){
  if (!content) return null;
  const styles = ['幽默', '走心', '直球'];
  const lines = content.split(/\n+/).map(l => l.trim()
    .replace(/^[\s\-\*#>`]+/, '').replace(/^\d+[\.\)、:：]\s*/, '')
    .replace(/^["「『]+|["」』]+$/g, '').trim()
  ).filter(l => {
    if (l.length < 2 || l.length > 100) return false;
    if (/^(以下是|下面是|建议如下|回复建议|响应)[:：]?$/.test(l)) return false;
    return true;
  });
  if (lines.length === 0) return null;
  return { suggestions: lines.slice(0, 3).map((text, i) => ({ text, style: styles[i] || '建议' })) };
}

// ============ 请求构造 ============
function buildRequest({provider, model, messages, apiKey, temperature, maxTokens, hasImage}){
  const p = PROVIDERS[provider];
  const format = p.format;
  const apiUrl = p.url;

  if(format === 'anthropic'){
    const sys = messages.find(m=>m.role==='system');
    const others = messages.filter(m=>m.role!=='system');
    const anthMsgs = others.map(m=>{
      let blocks;
      if(typeof m.content === 'string') blocks = [{type:'text', text:m.content}];
      else blocks = m.content.map(c=>{
        if(c.type === 'text') return {type:'text', text:c.text};
        if(c.type === 'image_url'){
          const dataUrl = c.image_url.url || '';
          const [meta, b64] = dataUrl.split(',');
          const mm = meta && meta.match(/data:(.*?);/);
          return {type:'image', source:{type:'base64', media_type: mm?mm[1]:'image/jpeg', data:b64||''}};
        }
        return {type:'text', text:''};
      });
      return {role: m.role==='assistant'?'assistant':'user', content:blocks};
    });
    return {
      url: apiUrl,
      headers:{'Content-Type':'application/json','x-api-key': apiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:{ model, max_tokens:maxTokens, temperature, system: sys ? sys.content : '', messages: anthMsgs },
      parse: d => (d && d.content && d.content[0] && d.content[0].text) || ''
    };
  }
  if(format === 'google'){
    const sys = messages.find(m=>m.role==='system');
    const others = messages.filter(m=>m.role!=='system');
    const contents = others.map(m=>{
      const parts = [];
      if(typeof m.content === 'string') parts.push({text: m.content});
      else m.content.forEach(c=>{
        if(c.type === 'text') parts.push({text:c.text});
        else if(c.type === 'image_url'){
          const dataUrl = c.image_url.url || '';
          const [meta, b64] = dataUrl.split(',');
          const mm = meta && meta.match(/data:(.*?);/);
          parts.push({inline_data:{mime_type: mm?mm[1]:'image/jpeg', data:b64||''}});
        }
      });
      return {role: m.role==='assistant'?'model':'user', parts};
    });
    const url = apiUrl.replace(/\/$/, '') + '/' + model + ':generateContent?key=' + encodeURIComponent(apiKey);
    return {
      url, headers:{'Content-Type':'application/json'},
      body:{
        system_instruction: sys ? {parts:[{text:sys.content}]} : undefined,
        contents, generationConfig:{temperature, maxOutputTokens:maxTokens}
      },
      parse: d => { try{ return d.candidates[0].content.parts.map(x=>x.text||'').join(''); }catch(e){ return ''; } }
    };
  }
  const body = {model, messages, temperature, max_tokens:maxTokens};
  if (p.jsonMode && !hasImage) body.response_format = { type: 'json_object' };
  return {
    url: apiUrl,
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey },
    body,
    parse: d => { try{ return d.choices[0].message.content || ''; }catch(e){ return ''; } }
  };
}

// ============ AI 调用 ============
async function callAI(apiEntry, session){
  const pConf = PROVIDERS[apiEntry.provider];
  if(!pConf) throw new Error('未知服务商');

  const key = (apiEntry.provider === 'anthropic' || apiEntry.provider === 'google')
    ? apiEntry.apiKey.trim() : toAscii(apiEntry.apiKey).trim();
  if(!key) throw new Error('API Key 无效');

  let model = pConf.model;
  let imageData = null;
  if(state.imageBase64){
    imageData = state.imageBase64.startsWith('data:image')
      ? state.imageBase64 : 'data:image/jpeg;base64,' + state.imageBase64;
    if(pConf.visionModel) model = pConf.visionModel;
    else throw new Error(pConf.name + ' 不支持图片');
  }

  const my = state.myName ? '我（'+state.myName+'）' : '我';
  const ta = state.taName ? '对方（'+state.taName+'）' : '对方';

  // ★ 情境描述拼到 system prompt 里
  const statusLine = session.status ? `\n【当前情境】${session.status}` : '';

  const systemPrompt = `你是聊天高手。${ta}会发来消息，你需要生成 3 条不同的回复建议，覆盖不同风格：
- 第1条：幽默轻松，可调侃自嘲，让人会心一笑
- 第2条：走心共情，温柔体贴，关注情绪
- 第3条：直接坦诚，简明有力，不绕弯
${statusLine}
每条建议口语化，像微信原话，不超过 40 字。禁止书面语、说教。使用简体中文。
${statusLine ? '⚠️ 请结合【当前情境】调整语气和内容。' : ''}

【重要】你只输出 JSON，不要任何其他内容。
- 不要加\`\`\`json\`\`\`代码块
- 不要加任何解释、前言、后记
- 第一个字符必须是 {，最后一个字符必须是 }
- 必须使用英文双引号 "

JSON 格式：
{"suggestions":[{"text":"第1条建议","style":"幽默"},{"text":"第2条建议","style":"走心"},{"text":"第3条建议","style":"直球"}]}`;

  const messages = [{role:'system', content: systemPrompt}];
  (session.messages || []).slice(-10).forEach((m, i, arr)=>{
    const isLast = i === arr.length - 1;
    const role = m.role === 'ta' ? 'user' : 'assistant';
    if(isLast && m.role === 'ta' && imageData){
      messages.push({
        role:'user',
        content:[
          {type:'text', text: m.text || '请描述图片'},
          {type:'image_url', image_url:{url:imageData}}
        ]
      });
    } else {
      messages.push({role, content: m.text});
    }
  });

  const req = buildRequest({
    provider: apiEntry.provider, model, messages,
    apiKey: key, temperature: 0.8, maxTokens: 800,
    hasImage: !!imageData
  });

  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 60000);
  let resp;
  try{
    resp = await fetch(req.url, {
      method:'POST', headers: req.headers,
      body: JSON.stringify(req.body), signal: ctrl.signal
    });
  }catch(e){
    if(e.name === 'AbortError') throw new Error('请求超时');
    throw new Error('网络错误：' + e.message);
  } finally { clearTimeout(timer); }

  if(!resp.ok){
    let t = await resp.text();
    try{ const j = JSON.parse(t); t = (j.error && j.error.message) || j.message || t; }catch(e){}
    if(resp.status === 400) throw new Error('请求错误：' + t.substring(0, 120));
    if(resp.status === 401) throw new Error('API Key 无效');
    if(resp.status === 403) throw new Error('访问被拒绝（可能额度不足或地区限制）');
    if(resp.status === 429) throw new Error('请求过于频繁，稍后再试');
    throw new Error('API错误(' + resp.status + ')：' + t.substring(0, 100));
  }

  const data = await resp.json();
  const content = req.parse(data) || '';
  let parsed = extractJSON(content);
  if (!parsed || !parsed.suggestions || parsed.suggestions.length === 0){
    console.warn('[解析失败] 原文：', content);
    parsed = textFallback(content);
  }
  if (!parsed || !parsed.suggestions || parsed.suggestions.length === 0){
    throw new Error('AI 返回格式无法解析');
  }

  parsed.suggestions = parsed.suggestions
    .filter(s => s && s.text && String(s.text).trim().length > 0)
    .slice(0, 3)
    .map((s, i) => ({
      text: String(s.text).trim(),
      style: s.style || ['幽默','走心','直球'][i] || '建议'
    }));
  if (parsed.suggestions.length === 0) throw new Error('AI 未生成有效建议');
  return parsed;
}

// ============ API 表单 ============
function renderApiForm(){
  let html = '';
  PROVIDER_ORDER.forEach(pid => {
    const p = PROVIDERS[pid];
    const key = state.apiKeys[pid] || '';
    const hasKey = !!key;
    const isDefault = state.defaultProvider === pid && hasKey;
    const visionTag = p.vision
      ? '<span class="api-tag vision">📷 支持图片</span>'
      : '<span class="api-tag no-vision">无图片</span>';
    const defaultBtn = hasKey
      ? (isDefault
          ? '<button class="default-btn active" data-pid="'+pid+'" data-act="unset">✓ 默认</button>'
          : '<button class="default-btn" data-pid="'+pid+'" data-act="set">设为默认</button>')
      : '';
    const rowCls = 'api-row' + (hasKey ? ' has-key' : '') + (isDefault ? ' is-default' : '');
    html += '<div class="'+rowCls+'" data-pid="'+pid+'">'
      + '<div class="api-row-header">'
      +   '<span class="api-icon">'+p.icon+'</span>'
      +   '<span class="api-name">'+esc(p.name)+'</span>'
      +   visionTag + defaultBtn
      + '</div>'
      + '<input type="text" class="api-key-input" data-pid="'+pid+'" '
      +   'value="'+esc(key)+'" placeholder="粘贴 API Key（可留空）" '
      +   'autocomplete="off" spellcheck="false">'
      + '</div>';
  });
  dom.apiForm.innerHTML = html;

  dom.apiForm.querySelectorAll('.api-key-input').forEach(input => {
    input.addEventListener('input', e => {
      const pid = e.target.dataset.pid;
      const val = e.target.value.trim();
      const hadKey = !!state.apiKeys[pid];
      state.apiKeys[pid] = val;
      const hasKey = !!val;
      if (hasKey && !hadKey && !state.defaultProvider) state.defaultProvider = pid;
      if (!hasKey && state.defaultProvider === pid){
        state.defaultProvider = Object.keys(state.apiKeys).find(p => state.apiKeys[p]) || '';
      }
      save();
      updateRowStyle(pid, val);
    });
    input.addEventListener('blur', e => {
      state.apiKeys[e.target.dataset.pid] = e.target.value.trim();
      save();
    });
  });
  dom.apiForm.querySelectorAll('.default-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.pid;
      state.defaultProvider = btn.dataset.act === 'unset' ? '' : pid;
      save();
      renderApiForm();
    });
  });
}
function updateRowStyle(pid, key){
  const row = dom.apiForm.querySelector('.api-row[data-pid="'+pid+'"]');
  if(!row) return;
  const hasKey = !!key;
  const isDefault = state.defaultProvider === pid && hasKey;
  row.classList.toggle('has-key', hasKey);
  row.classList.toggle('is-default', isDefault);

  const header = row.querySelector('.api-row-header');
  const oldBtn = header.querySelector('.default-btn');
  if(oldBtn) oldBtn.remove();
  if(hasKey){
    const btn = document.createElement('button');
    btn.className = 'default-btn' + (isDefault ? ' active' : '');
    btn.dataset.pid = pid;
    btn.dataset.act = isDefault ? 'unset' : 'set';
    btn.textContent = isDefault ? '✓ 默认' : '设为默认';
    btn.addEventListener('click', () => {
      state.defaultProvider = btn.dataset.act === 'unset' ? '' : pid;
      save();
      renderApiForm();
    });
    header.appendChild(btn);
  }
  dom.apiForm.querySelectorAll('.api-row').forEach(r => {
    const rp = r.dataset.pid;
    const rHas = !!state.apiKeys[rp];
    const rDef = state.defaultProvider === rp && rHas;
    r.classList.toggle('is-default', rDef);
  });
}

// ============ 设置面板 ============
function openSettings(){
  dom.settings.classList.add('show');
  dom.myName.value = state.myName;
  dom.taName.value = state.taName;
  renderApiForm();
}
function closeSettings(){
  state.myName = dom.myName.value.trim();
  state.taName = dom.taName.value.trim();
  save();
  dom.settings.classList.remove('show');
}

// ============ 事件 ============
function bindEvents(){
  dom.settingsBtn.addEventListener('click', openSettings);
  dom.closeSettings.addEventListener('click', closeSettings);
  dom.drawerBtn.addEventListener('click', openDrawer);
  dom.drawerMask.addEventListener('click', closeDrawer);
  dom.newChatBtn.addEventListener('click', handleNewChat);

  // ★ 情境栏点击 → 编辑
  dom.statusBar.addEventListener('click', (e) => {
    if (e.target.tagName === 'INPUT') return;
    editStatus();
  });

  dom.sendBtn.addEventListener('click', handleSend);
  dom.input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); handleSend(); }
  });
  dom.imageBtn.addEventListener('click', ()=>dom.fileInput.click());
  dom.fileInput.addEventListener('change', e=>{
    if(e.target.files.length) handleImageSelect(e.target.files[0]);
  });
  dom.removeImg.addEventListener('click', clearImage);
  dom.previewImg.addEventListener('click', ()=>{
    if(dom.previewImg.src && dom.previewImg.src.startsWith('data:image')){
      showImageModal(dom.previewImg.src);
    }
  });
  dom.myName.addEventListener('input', ()=>{ state.myName = dom.myName.value.trim(); save(); });
  dom.taName.addEventListener('input', ()=>{ state.taName = dom.taName.value.trim(); save(); });

  // ★ 操作面板
  dom.sheetMask.addEventListener('click', closeActionSheet);
  dom.sheetCancel.addEventListener('click', closeActionSheet);
  dom.sheetDelete.addEventListener('click', deletePendingMessage);

  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      if(dom.sheet.classList.contains('show')) closeActionSheet();
      else if(dom.drawer.classList.contains('show')) closeDrawer();
      else if(dom.settings.classList.contains('show')) closeSettings();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') save();
  });
  window.addEventListener('beforeunload', save);
}

// ============ 初始化 ============
function init(){
  load();
  if(state.sessions.length === 0) createSession(true);
  renderHeader();
  renderMessages();
  renderSuggestions();
  renderStatusBar();
  bindEvents();

  const hasAny = PROVIDER_ORDER.some(p => state.apiKeys[p]);
  if (!hasAny){
    const guided = localStorage.getItem('chat_guided_v4');
    if (!guided){
      setTimeout(openSettings, 400);
      try { localStorage.setItem('chat_guided_v4', '1'); } catch(e){}
    }
  }
}
init();
})();
</script>
