<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>聊天助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#fff;color:#1a1a1a;font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;background:#fff;display:flex;flex-direction:column;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #ebebf0;flex-shrink:0;gap:8px;}
header h1{font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:6px;}
header h1 .mode-tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;flex-shrink:0;}
header h1 .mode-tag.chat{background:#ede9fe;color:#5b21b6;}
header h1 .mode-tag.real{background:#dcfce7;color:#166534;}
.icon-btn{width:36px;height:36px;border:none;background:transparent;border-radius:50%;font-size:18px;cursor:pointer;
  color:#666;display:inline-flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.icon-btn:hover{background:#f5f5f7;}
main{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.empty{margin:auto;color:#999;text-align:center;font-size:14px;line-height:1.8;}
.bubble{max-width:80%;padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.45;word-break:break-word;
  animation:pop .2s ease;position:relative;transition:transform .15s,filter .15s;user-select:text;}
@keyframes pop{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.bubble.pressing{transform:scale(0.97);filter:brightness(0.95);}
.bubble.ta{align-self:flex-start;background:#f5f5f7;color:#1a1a1a;border-bottom-left-radius:6px;}
.bubble.me{align-self:flex-end;background:#7c5cff;color:#fff;border-bottom-right-radius:6px;}
.bubble.me.manual{background:#10b981;}
.bubble.real{border-style:dashed;border-width:1.5px;background:#fff;}
.bubble.real.ta{border-color:#d4d4d8;color:#1a1a1a;}
.bubble.real.me{border-color:#10b981;color:#065f46;background:#ecfdf5;}
.bubble.real::before{content:'🗣️';position:absolute;top:-8px;left:-4px;font-size:12px;opacity:0.5;}
.suggestions{flex-shrink:0;padding:0 18px 12px;display:none;flex-direction:column;gap:8px;}
.suggestions.show{display:flex;}
.s-title{font-size:12px;color:#999;font-weight:500;padding:4px 0;display:flex;align-items:center;justify-content:space-between;}
.s-title .tip{font-size:11px;color:#c4a000;font-weight:400;}
.spinner{width:12px;height:12px;border:2px solid #ebebf0;border-top-color:#7c5cff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.s-card{background:#f5f5f7;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.45;
  transition:background .15s;display:flex;align-items:flex-start;gap:10px;position:relative;}
.s-card:hover{background:#efeff4;}
.s-card .s-text{flex:1;min-width:0;cursor:pointer;padding:2px 0;outline:none;}
.s-card .s-text:hover{color:#5b3dd6;}
.s-card .s-badge{font-size:11px;color:#999;background:#fff;padding:2px 8px;border-radius:8px;flex-shrink:0;font-weight:500;}
.s-card .s-edit{background:transparent;border:none;color:#c0c0c8;font-size:13px;cursor:pointer;padding:2px 6px;
  border-radius:6px;flex-shrink:0;transition:all .15s;line-height:1;opacity:0.6;}
.s-card .s-edit:hover{background:#fff;color:#7c5cff;opacity:1;}
.s-card.editing{background:#fff;box-shadow:0 0 0 1.5px #7c5cff;}
.s-card.editing .s-badge{display:none;}
.s-card .edit-input{flex:1;min-width:0;border:none;background:transparent;font-size:15px;font-family:inherit;
  color:#1a1a1a;outline:none;padding:2px 0;line-height:1.45;resize:none;min-height:22px;}
.s-card .edit-actions{display:flex;gap:4px;flex-shrink:0;}
.s-card .edit-actions button{border:none;background:transparent;font-size:16px;cursor:pointer;padding:3px 6px;
  border-radius:6px;color:#999;transition:all .15s;line-height:1;}
.s-card .edit-actions .btn-ok{color:#059669;}
.s-card .edit-actions .btn-ok:hover{background:#d1fae5;}
.s-card .edit-actions .btn-cancel:hover{background:#fee2e2;color:#dc2626;}
.s-card.copied{background:#ecfdf5;}
.s-card.copied .s-badge{color:#059669;background:#d1fae5;}
.status-bar{display:flex;align-items:center;gap:8px;padding:9px 16px;background:#fffbeb;
  border-top:1px solid #fef3c7;font-size:12px;color:#92400e;cursor:pointer;flex-shrink:0;
  transition:background .15s;min-height:36px;}
.status-bar:hover{background:#fef3c7;}
.status-bar.empty .status-text{color:#b45309;opacity:0.75;}
.status-bar .status-icon{font-size:14px;flex-shrink:0;line-height:1;}
.status-bar .status-content{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4;}
.status-bar .status-text{color:#92400e;font-weight:500;}
.status-bar .status-text.placeholder{font-weight:400;}
.status-bar .status-edit{border:none;background:transparent;color:#b45309;font-size:13px;cursor:pointer;
  padding:2px 6px;border-radius:6px;flex-shrink:0;line-height:1;}
.status-bar .status-edit:hover{background:#fde68a;}
.status-bar .status-input{flex:1;min-width:0;border:none;background:transparent;font-size:13px;
  font-family:inherit;color:#78350f;outline:none;font-weight:500;padding:0;}
.status-bar .status-input::placeholder{color:#b45309;opacity:0.6;font-weight:400;}
.composer{flex-shrink:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ebebf0;
  display:flex;align-items:center;gap:6px;background:#fff;}
.composer input{flex:1;min-width:0;height:40px;padding:0 14px;border:none;background:#f5f5f7;border-radius:20px;
  font-size:15px;outline:none;color:#1a1a1a;font-family:inherit;}
.composer input:focus{background:#efeff4;}
.composer input::placeholder{color:#999;}
.send-btn{width:36px;height:36px;border-radius:50%;border:none;background:#7c5cff;color:#fff;font-size:18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s;flex-shrink:0;}
.send-btn:hover{background:#6a4ae6;}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}
.send-btn:active:not(:disabled){transform:scale(0.95);}
.me-btn{width:36px;height:36px;border-radius:50%;border:none;background:#d1fae5;color:#059669;font-size:16px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;
  font-weight:600;line-height:1;}
.me-btn:hover{background:#a7f3d0;}
.me-btn:active{transform:scale(0.95);}
.img-preview{padding:0 16px 8px;display:none;align-items:center;gap:8px;flex-shrink:0;}
.img-preview.show{display:flex;}
.img-preview img{width:56px;height:56px;object-fit:cover;border-radius:10px;}
.img-preview button{border:none;background:transparent;color:#999;font-size:16px;cursor:pointer;padding:4px;}
.action-sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:500;opacity:0;pointer-events:none;transition:opacity .2s;}
.action-sheet-mask.show{opacity:1;pointer-events:auto;}
.action-sheet{position:fixed;bottom:0;left:0;right:0;z-index:501;
  transform:translateY(100%);transition:transform .25s cubic-bezier(0.4,0,0.2,1);
  padding:0 12px calc(12px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;box-sizing:border-box;}
.action-sheet.show{transform:translateY(0);}
.action-sheet-inner{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 -4px 24px rgba(0,0,0,0.1);}
.action-sheet .preview{padding:14px 18px;font-size:12px;color:#666;border-bottom:1px solid #ebebf0;
  max-height:100px;overflow:hidden;line-height:1.5;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.action-sheet .preview .pv-who{font-weight:600;color:#7c5cff;font-size:11px;margin-right:4px;}
.action-sheet .btn-item{display:block;width:100%;padding:15px;border:none;background:transparent;
  font-size:16px;font-family:inherit;color:#1a1a1a;cursor:pointer;text-align:center;
  border-bottom:1px solid #ebebf0;font-weight:500;transition:background .15s;}
.action-sheet .btn-item:last-child{border-bottom:none;}
.action-sheet .btn-item:hover{background:#f5f5f7;}
.action-sheet .btn-item.danger{color:#dc2626;}
.action-sheet .btn-item.cancel{color:#666;font-weight:400;}
.me-input-mask{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:500;opacity:0;pointer-events:none;transition:opacity .2s;}
.me-input-mask.show{opacity:1;pointer-events:auto;}
.me-input-panel{position:fixed;left:0;right:0;bottom:0;z-index:501;
  transform:translateY(100%);transition:transform .25s cubic-bezier(0.4,0,0.2,1);
  padding:0 12px calc(12px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;box-sizing:border-box;}
.me-input-panel.show{transform:translateY(0);}
.me-input-inner{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 -4px 24px rgba(0,0,0,0.1);padding:16px;}
.me-input-title{font-size:13px;font-weight:600;color:#059669;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;}
.me-input-title .hint{font-size:11px;color:#999;font-weight:400;}
.me-input-ctx{font-size:12px;color:#666;background:#f5f5f7;border-radius:8px;padding:8px 10px;margin-bottom:10px;
  line-height:1.5;max-height:60px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.me-input-ctx .pv-who{font-weight:600;color:#7c5cff;font-size:11px;margin-right:4px;}
.me-input-area{width:100%;min-height:88px;max-height:200px;padding:12px 14px;border:1.5px solid #ebebf0;
  border-radius:12px;font-size:15px;font-family:inherit;color:#1a1a1a;background:#fff;outline:none;
  resize:vertical;line-height:1.5;box-sizing:border-box;transition:border-color .15s;}
.me-input-area:focus{border-color:#10b981;}
.me-input-area::placeholder{color:#bbb;}
.me-input-actions{display:flex;gap:8px;margin-top:12px;}
.me-btn-cancel{flex:1;height:44px;border:1.5px solid #ebebf0;background:#fff;color:#666;
  font-size:15px;font-family:inherit;border-radius:12px;cursor:pointer;font-weight:500;}
.me-btn-cancel:hover{background:#f5f5f7;}
.me-btn-save{flex:2;height:44px;border:none;background:#10b981;color:#fff;
  font-size:15px;font-family:inherit;border-radius:12px;cursor:pointer;font-weight:600;}
.me-btn-save:hover{background:#059669;}
.speak-panel{position:fixed;inset:0;background:#fff;z-index:600;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
.speak-panel.show{display:flex;}
.speak-panel .sp-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border:none;
  background:transparent;border-radius:50%;font-size:22px;color:#999;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;}
.speak-panel .sp-close:hover{background:#f5f5f7;color:#1a1a1a;}
.speak-panel .sp-hint{font-size:12px;color:#999;margin-bottom:20px;letter-spacing:0.3px;}
.speak-panel .sp-text{font-size:28px;line-height:1.6;color:#1a1a1a;font-weight:600;
  max-width:520px;word-break:break-word;margin-bottom:32px;padding:0 8px;}
.speak-panel .sp-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.speak-panel .sp-actions button{height:48px;padding:0 24px;border-radius:24px;
  font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .15s;}
.sp-btn-speak{border:1.5px solid #7c5cff;background:#fff;color:#7c5cff;}
.sp-btn-speak:hover{background:#f5f2ff;}
.sp-btn-said{border:none;background:#10b981;color:#fff;}
.sp-btn-said:hover{background:#059669;}
.sp-btn-copy{border:1.5px solid #ebebf0;background:#fff;color:#666;}
.sp-btn-copy:hover{background:#f5f5f7;}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-mask.show{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:340px;background:#fff;z-index:201;
  transform:translateX(-100%);transition:transform .28s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,0.08);}
.drawer.show{transform:translateX(0);}
.drawer-header{padding:16px 16px 12px;border-bottom:1px solid #ebebf0;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:8px;}
.drawer-header h2{font-size:16px;font-weight:600;}
.new-chat-btn{padding:8px 14px;border:none;border-radius:10px;background:#7c5cff;color:#fff;
  font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.new-chat-btn:hover{background:#6a4ae6;}
.session-list{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch;}
.session-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;
  cursor:pointer;transition:background .15s;position:relative;margin-bottom:2px;}
.session-item:hover{background:#f5f5f7;}
.session-item.active{background:#f0ecff;}
.session-item.active .session-title{color:#5b3dd6;font-weight:600;}
.session-item .s-body{flex:1;min-width:0;}
.session-item .session-title{font-size:14px;font-weight:500;color:#1a1a1a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  display:flex;align-items:center;gap:5px;}
.session-item .session-title .m-tag{font-size:9px;padding:1px 5px;border-radius:4px;
  font-weight:600;flex-shrink:0;line-height:1.5;}
.session-item .session-title .m-tag.real{background:#dcfce7;color:#166534;}
.session-item .session-title .m-tag.chat{background:#ede9fe;color:#5b21b6;}
.session-item .session-meta{font-size:11px;color:#999;margin-top:3px;display:flex;align-items:center;gap:6px;}
.session-item .session-meta .pin{color:#d97706;}
.session-item .session-del{width:26px;height:26px;border:none;background:transparent;color:#c0c0c8;
  font-size:15px;cursor:pointer;border-radius:50%;flex-shrink:0;display:inline-flex;
  align-items:center;justify-content:center;opacity:0;transition:all .15s;}
.session-item:hover .session-del{opacity:1;}
.session-item .session-del:hover{background:#fee2e2;color:#dc2626;opacity:1 !important;}
.session-empty{color:#999;font-size:13px;text-align:center;padding:30px 0;}
.new-chat-row{display:flex;gap:6px;padding:0 8px 8px;flex-shrink:0;}
.new-chat-row .ncr-btn{flex:1;padding:10px 8px;border:1.5px dashed #d8d8e3;background:#fff;
  border-radius:12px;font-size:12px;font-family:inherit;color:#666;cursor:pointer;
  font-weight:500;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;}
.new-chat-row .ncr-btn:hover{border-color:#7c5cff;color:#7c5cff;background:#faf8ff;}
.settings-panel{position:fixed;inset:0;background:#fff;z-index:100;transform:translateX(100%);
  transition:transform .25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;overflow:hidden;}
.settings-panel.show{transform:translateX(0);}
.sp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  border-bottom:1px solid #ebebf0;flex-shrink:0;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;}
.sp-header h2{font-size:16px;font-weight:600;}
.sp-body{flex:1;overflow-y:auto;padding:18px 18px 40px;-webkit-overflow-scrolling:touch;
  max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;}
.section-title{font-size:13px;font-weight:600;color:#666;margin-bottom:10px;}
.section-title .sub{font-weight:400;color:#999;font-size:11px;margin-left:4px;}
.api-row{background:#fafafc;border:1.5px solid #ebebf0;border-radius:12px;padding:10px 12px;margin-bottom:10px;
  transition:border-color .15s,background .15s;}
.api-row.has-key{background:#fff;border-color:#d8d8e3;}
.api-row.is-default{background:#faf8ff;border-color:#7c5cff;}
.api-row-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.api-row-header .api-icon{font-size:18px;line-height:1;flex-shrink:0;}
.api-row-header .api-name{font-size:14px;font-weight:600;color:#1a1a1a;flex:1;min-width:0;}
.api-row-header .api-tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;line-height:1.6;flex-shrink:0;}
.api-row-header .api-tag.vision{background:#e0f2fe;color:#0369a1;}
.api-row-header .api-tag.no-vision{background:#f3f4f6;color:#9ca3af;}
.api-row-header .default-btn{font-size:11px;padding:3px 9px;border-radius:8px;border:1px solid #ebebf0;
  background:#fff;color:#999;cursor:pointer;font-family:inherit;font-weight:500;flex-shrink:0;transition:all .15s;}
.api-row-header .default-btn:hover{border-color:#7c5cff;color:#7c5cff;}
.api-row-header .default-btn.active{background:#7c5cff;color:#fff;border-color:#7c5cff;}
.api-row input{width:100%;height:38px;padding:0 12px;border:1px solid #ebebf0;background:#fff;border-radius:10px;
  font-size:13px;outline:none;color:#1a1a1a;font-family:ui-monospace,monospace;}
.api-row input:focus{border-color:#7c5cff;}
.api-row input::placeholder{color:#bbb;font-family:inherit;}
.field{margin-bottom:24px;}
.field > label{display:block;font-size:13px;font-weight:600;color:#666;margin-bottom:10px;}
.field input[type=text],.field input[type=password],.field textarea{width:100%;padding:11px 14px;
  border:1px solid #ebebf0;background:#fff;border-radius:12px;font-size:15px;outline:none;
  color:#1a1a1a;font-family:inherit;transition:border-color .15s;line-height:1.5;}
.field input[type=text],.field input[type=password]{height:44px;padding:0 14px;}
.field textarea{min-height:88px;resize:vertical;}
.field input:focus,.field textarea:focus{border-color:#7c5cff;}
.hint{font-size:12px;color:#999;line-height:1.6;margin-top:8px;}
.profile-panel{background:linear-gradient(135deg,#f0f9ff,#ecfeff);border:1.5px solid #bae6fd;
  border-radius:14px;padding:16px;margin-bottom:24px;}
.profile-panel .pp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.profile-panel .pp-head .pp-title{font-size:14px;font-weight:700;color:#0369a1;
  display:flex;align-items:center;gap:6px;}
.profile-panel .pp-head .pp-count{font-size:11px;color:#0ea5e9;background:#fff;padding:3px 10px;
  border-radius:8px;font-weight:500;}
.profile-panel .pp-section{margin-bottom:16px;}
.profile-panel .pp-section:last-of-type{margin-bottom:0;}
.profile-panel .pp-sec-title{font-size:11px;font-weight:700;color:#0284c7;
  text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.profile-panel .pp-sec-title::before{content:'';width:3px;height:12px;background:#0ea5e9;border-radius:2px;}
.profile-panel .pp-tags{display:flex;flex-wrap:wrap;gap:6px;}
.profile-panel .pp-tag{font-size:11px;padding:4px 10px;background:#fff;border-radius:8px;
  color:#0369a1;font-weight:500;border:1px solid #e0f2fe;line-height:1.4;}
.profile-panel .pp-tag.highlight{background:#fef3c7;color:#92400e;border-color:#fde68a;}
.profile-panel .pp-scenes{display:flex;flex-direction:column;gap:8px;}
.profile-panel .pp-scene{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #e0f2fe;}
.profile-panel .pp-scene .ctx{font-size:11px;color:#0284c7;font-weight:600;margin-bottom:6px;}
.profile-panel .pp-scene .res{font-size:12px;color:#0c4a6e;line-height:1.5;font-style:italic;}
.profile-panel .pp-empty{font-size:12px;color:#0ea5e9;line-height:1.6;}
.profile-panel .pp-actions{margin-top:14px;padding-top:14px;border-top:1px dashed #bae6fd;display:flex;gap:8px;}
.profile-panel .pp-actions button{flex:1;font-size:12px;padding:8px 12px;border-radius:10px;
  cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;}
.profile-panel .pp-btn-clear{border:1px solid #bae6fd;background:#fff;color:#0ea5e9;}
.profile-panel .pp-btn-clear:hover{background:#e0f2fe;border-color:#7dd3fc;}
.profile-panel .pp-btn-view{border:1px solid #fde68a;background:#fffbeb;color:#d97706;}

<script>
(function(){
'use strict';
const PROVIDERS = {
  deepseek:  { name:'DeepSeek',  icon:'🐋', url:'https://api.deepseek.com/chat/completions', model:'deepseek-chat', visionModel:null, format:'openai', vision:false },
  zhipu:     { name:'智谱 GLM',  icon:'🧠', url:'https://open.bigmodel.cn/api/paas/v4/chat/completions', model:'glm-4-air', visionModel:'glm-4v', format:'openai', vision:true, jsonMode:true },
  kimi:      { name:'Kimi',      icon:'🌙', url:'https://api.moonshot.cn/v1/chat/completions', model:'moonshot-v1-8k', visionModel:'moonshot-v1-8k-vision-preview', format:'openai', vision:true },
  qwen:      { name:'通义千问',  icon:'☁️', url:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model:'qwen-plus', visionModel:'qwen-vl-max', format:'openai', vision:true },
  openai:    { name:'OpenAI',    icon:'🟢', url:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini', visionModel:'gpt-4o', format:'openai', vision:true, jsonMode:true },
  doubao:    { name:'豆包',      icon:'🎵', url:'https://ark.cn-beijing.volces.com/api/v3/chat/completions', model:'doubao-pro-32k', visionModel:'doubao-vision-pro-32k', format:'openai', vision:true },
  anthropic: { name:'Claude',    icon:'🅰️', url:'https://api.anthropic.com/v1/messages', model:'claude-3-5-sonnet-20241022', visionModel:'claude-3-5-sonnet-20241022', format:'anthropic', vision:true },
  google:    { name:'Gemini',    icon:'🔷', url:'https://generativelanguage.googleapis.com/v1beta/models', model:'gemini-2.0-flash', visionModel:'gemini-2.0-flash', format:'google', vision:true }
};
const PROVIDER_ORDER = ['deepseek','qwen','kimi','zhipu','openai','doubao','anthropic','google'];
function genId(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
const state = {
  sessions: [], currentSessionId: '',
  apiKeys: {}, defaultProvider: '',
  myName:'', taName:'', myStyle:'',
  styleSamples: [],
  webdav: { url:'https://data.cstcloud.cn/dav', user:'', pass:'', path:'chat-assistant/data.json', auto:false },
  imageBase64:null, loading:false,
  pendingDeleteIdx: -1,
  currentSpeakIdx: -1
};
PROVIDER_ORDER.forEach(pid => { state.apiKeys[pid] = ''; });
const $ = id => document.getElementById(id);
const dom = {
  messages:$('messages'), suggestions:$('suggestions'), sList:$('sList'),
  sTitleText:$('sTitleText'), sTitleTip:$('sTitleTip'), sTitleSpinner:$('sTitleSpinner'),
  imgPreview:$('imgPreview'), previewImg:$('previewImg'), removeImg:$('removeImg'),
  imageBtn:$('imageBtn'), fileInput:$('fileInput'), modeBtn:$('modeBtn'),
  input:$('input'), sendBtn:$('sendBtn'), meBtn:$('meBtn'),
  headerTitle:$('headerTitle'), statusBar:$('statusBar'),
  drawerBtn:$('drawerBtn'), drawer:$('drawer'), drawerMask:$('drawerMask'),
  newChatBtn:$('newChatBtn'), newChatOnlineBtn:$('newChatOnlineBtn'), newChatRealBtn:$('newChatRealBtn'),
  sessionList:$('sessionList'),
  settingsBtn:$('settingsBtn'), settings:$('settings'),
  closeSettings:$('closeSettings'),
  apiForm:$('apiForm'), myName:$('myName'), taName:$('taName'), myStyle:$('myStyle'),
  profilePanel:$('profilePanel'), toast:$('toast'),
  sheet:$('sheet'), sheetMask:$('sheetMask'), sheetPreview:$('sheetPreview'),
  sheetDelete:$('sheetDelete'), sheetCancel:$('sheetCancel'),
  meInputMask:$('meInputMask'), meInputPanel:$('meInputPanel'),
  meInputArea:$('meInputArea'), meInputCtx:$('meInputCtx'),
  meInputCancel:$('meInputCancel'), meInputSave:$('meInputSave'),
  samplesModal:$('samplesModal'), samplesBody:$('samplesBody'), closeSamples:$('closeSamples'),
  speakPanel:$('speakPanel'), speakText:$('speakText'), speakClose:$('speakClose'),
  speakCopy:$('speakCopy'), speakPlay:$('speakPlay'), speakSaid:$('speakSaid'),
  syncPanel:$('syncPanel'), syncUrl:$('syncUrl'), syncUser:$('syncUser'), syncPass:$('syncPass'),
  syncPath:$('syncPath'), syncUpBtn:$('syncUpBtn'), syncDownBtn:$('syncDownBtn'),
  syncAuto:$('syncAuto'), syncStatus:$('syncStatus'), syncLog:$('syncLog')
};
let toastTimer = null;
function toast(msg, dur=1800, type=''){
  clearTimeout(toastTimer);
  dom.toast.textContent = msg;
  dom.toast.style.background = type==='error' ? 'rgba(220,38,38,0.95)'
    : type==='success' ? 'rgba(5,150,105,0.95)' : 'rgba(30,30,35,0.95)';
  dom.toast.classList.add('show');
  toastTimer = setTimeout(()=>dom.toast.classList.remove('show'), dur);
}
function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function toAscii(s){ return String(s||'').replace(/[^\x00-\x7F]/g,''); }
function analyzeLangStyle(samples){
  const texts = samples.map(s => s.myText).filter(t => t && t.trim().length > 0);
  if (texts.length < 3) return null;
  const profile = { count: texts.length, avgLen:0, maxLen:0, usePeriodRate:0,
    useComma:false, useExclamation:false, useEmoji:false, emojiRate:0, endWithPeriod:false,
    particles:[], commonOpeners:[], commonEndings:[], isShort:false };
  const lens = texts.map(t => t.length);
  profile.avgLen = Math.round(lens.reduce((a,b)=>a+b,0)/lens.length);
  profile.maxLen = Math.max(...lens);
  profile.isShort = profile.avgLen <= 12;
  const allText = texts.join('\n');
  const pc = (allText.match(/[。]/g)||[]).length;
  const cc = (allText.match(/[，,]/g)||[]).length;
  const ec = (allText.match(/[！!]/g)||[]).length;
  profile.usePeriodRate = pc / texts.length;
  profile.useComma = cc > 0;
  profile.useExclamation = ec > 0;
  profile.endWithPeriod = pc / texts.length > 0.5;
  const emojiRegex = /[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{1F600}-\u{1F64F}]/u;
  let emojiCount = 0;
  texts.forEach(t => { if (emojiRegex.test(t)) emojiCount++; });
  profile.emojiRate = emojiCount / texts.length;
  profile.useEmoji = profile.emojiRate > 0.15;
  const particleList = ['哈哈哈','哈哈哈哈','hhh','嘿嘿','嘻嘻','呜呜','emmm','嗯','哦','哦哦','呀','吧','嘛','诶','诶呀','啊','哎','唉','呃','6','笑死','绝了','牛','草','卧槽','妈呀','QAQ','qwq','阿这','那确实','真的假的','是的','对啊','就是','然后','那个','这个','感觉','觉得'];
  profile.particles = particleList.filter(p => allText.includes(p)).slice(0,12);
  const openerCount = {};
  texts.forEach(t => { const c = t.trim(); if(!c) return; const f = c[0]; openerCount[f] = (openerCount[f]||0)+1; });
  profile.commonOpeners = Object.entries(openerCount).sort((a,b)=>b[1]-a[1]).slice(0,4).filter(x=>x[1]>=2).map(x=>x[0]);
  const endingCount = {};
  texts.forEach(t => { const c = t.trim(); if(c.length<2) return; const e = c.slice(-2); endingCount[e] = (endingCount[e]||0)+1; });
  profile.commonEndings = Object.entries(endingCount).sort((a,b)=>b[1]-a[1]).slice(0,3).filter(x=>x[1]>=2).map(x=>x[0]);
  return profile;
}
function analyzeScenes(samples){
  const withCtx = samples.filter(s => s.taText && s.myText);
  if (withCtx.length < 3) return [];
  const scenes = [
    { key:'complaint', name:'对方抱怨/情绪低落', match: t => /累|难过|烦|不开心|emo|委屈|崩|哭|唉|难受|痛|焦虑|压力|抑郁|丧/i.test(t), samples: [] },
    { key:'praise', name:'对方夸奖/道谢', match: t => /谢谢|感谢|好的你|真好|厉害|棒|优秀|喜欢你|爱你|么么/i.test(t), samples: [] },
    { key:'question', name:'对方问问题', match: t => /[？?]|吗|呢|怎么|为什么|什么|哪|谁|如何/i.test(t), samples: [] },
    { key:'invite', name:'对方邀约/提议', match: t => /一起|要不要|去不去|来不来|约|走|出去|吃|玩/i.test(t), samples: [] },
    { key:'tease', name:'对方调侃/逗你', match: t => /哈哈|哈哈哈哈哈|笑死|逗|骗|猜|调侃/i.test(t), samples: [] },
    { key:'casual', name:'日常闲聊', match: t => t.length > 0, samples: [] }
  ];
  withCtx.forEach(s => {
    for (const sc of scenes){ if (sc.match(s.taText)){ sc.samples.push(s); break; } }
  });
  return scenes.filter(sc => sc.samples.length > 0).map(sc => ({
    key: sc.key, name: sc.name, count: sc.samples.length,
    examples: sc.samples.sort((a,b)=>a.myText.length-b.myText.length).slice(0,2)
      .map(s => ({ ta: s.taText, me: s.myText }))
  }));
}
function profileToPrompt(langProfile, scenes){
  const parts = [];
  if (langProfile){
    const lines = [];
    if (langProfile.avgLen <= 8) lines.push(`· 平均 ${langProfile.avgLen} 字，非常短`);
    else if (langProfile.avgLen <= 15) lines.push(`· 平均 ${langProfile.avgLen} 字，偏短`);
    else lines.push(`· 平均 ${langProfile.avgLen} 字，偏长`);
    if (langProfile.usePeriodRate < 0.15) lines.push('· 几乎不打句号');
    else if (langProfile.endWithPeriod) lines.push('· 习惯用句号结尾');
    if (!langProfile.useComma) lines.push('· 不用逗号，用空格或语气词断句');
    if (langProfile.useExclamation) lines.push('· 会打感叹号');
    if (!langProfile.useEmoji) lines.push('· 基本不用 emoji');
    if (langProfile.particles.length > 0) lines.push('· 常用词：' + langProfile.particles.slice(0,8).join('、'));
    if (langProfile.commonOpeners.length > 0) lines.push('· 常以 "' + langProfile.commonOpeners.join('" "') + '" 开头');
    if (langProfile.commonEndings.length > 0) lines.push('· 常以 "' + langProfile.commonEndings.join('" "') + '" 结尾');
    parts.push('【我的语言风格】\n' + lines.join('\n'));
  }
  if (scenes && scenes.length > 0){
    const sceneLines = scenes.map(sc => {
      const examples = sc.examples.map(e => `  对方说"${e.ta}" → 我回"${e.me}"`).join('\n');
      return `· ${sc.name}（${sc.count}次）：\n${examples}`;
    }).join('\n\n');
    parts.push('【我在不同场景下的反应模式】\n' + sceneLines);
  }
  return parts.join('\n\n');
}

function formatTime(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  if(diff < 60*1000) return '刚刚';
  if(diff < 60*60*1000) return Math.floor(diff/60000) + '分钟前';
  if(diff < 24*60*60*1000) return Math.floor(diff/3600000) + '小时前';
  if(diff < 7*24*60*60*1000) return Math.floor(diff/86400000) + '天前';
  const d = new Date(ts);
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}
const KEY = 'chat_multi_v10';
const OLD_KEYS = ['chat_multi_v9','chat_multi_v8','chat_multi_v7','chat_multi_v6','chat_multi_v5','chat_multi_v4','chat_multi_v3','chat_multi_v2','chat_multi_v1'];
function serialize(){
  return {
    version: 10,
    exportedAt: Date.now(),
    sessions: state.sessions, currentSessionId: state.currentSessionId,
    apiKeys: state.apiKeys, defaultProvider: state.defaultProvider,
    myName: state.myName, taName: state.taName, myStyle: state.myStyle,
    styleSamples: state.styleSamples,
    webdav: { url: state.webdav.url, user: state.webdav.user, pass: state.webdav.pass, path: state.webdav.path, auto: state.webdav.auto }
  };
}
function deserialize(d){
  state.sessions = Array.isArray(d.sessions) ? d.sessions.map(s => ({
    id: s.id || genId(), messages: s.messages || [], status: s.status || '',
    mode: s.mode || 'chat',
    createdAt: s.createdAt || Date.now(), updatedAt: s.updatedAt || Date.now()
  })) : [];
  state.currentSessionId = d.currentSessionId || '';
  state.apiKeys = Object.assign({}, state.apiKeys, d.apiKeys || {});
  state.defaultProvider = d.defaultProvider || '';
  state.myName = d.myName || '';
  state.taName = d.taName || '';
  state.myStyle = d.myStyle || '';
  if (Array.isArray(d.styleSamples)) state.styleSamples = d.styleSamples.slice(-100);
  else if (Array.isArray(d.myReplies)) state.styleSamples = d.myReplies.map(t => ({ myText:t, taText:'', timestamp: Date.now() }));
  else state.styleSamples = [];
  if (d.webdav){
    state.webdav.url = d.webdav.url || 'https://data.cstcloud.cn/dav';
    state.webdav.user = d.webdav.user || '';
    state.webdav.pass = d.webdav.pass || '';
    state.webdav.path = d.webdav.path || 'chat-assistant/data.json';
    state.webdav.auto = !!d.webdav.auto;
  }
  if(state.defaultProvider && !state.apiKeys[state.defaultProvider]) state.defaultProvider = '';
  if(!state.defaultProvider) state.defaultProvider = Object.keys(state.apiKeys).find(p => state.apiKeys[p]) || '';
  if(state.sessions.length === 0) createSession(true, 'chat');
  else if(!state.currentSessionId || !state.sessions.find(s => s.id === state.currentSessionId)){
    state.currentSessionId = state.sessions[0].id;
  }
}
let syncTimer = null;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(serialize()));
    scheduleSync();
  }catch(e){ console.warn('保存失败', e); }
}
function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(!raw){
      for(const k of OLD_KEYS){
        const old = localStorage.getItem(k);
        if(old){
          try { const d = JSON.parse(old); deserialize(d); save(); } catch(e){}
          return;
        }
      }
      return;
    }
    const d = JSON.parse(raw);
    deserialize(d);
  }catch(e){}
}
function scheduleSync(){
  if (!state.webdav.auto) return;
  if (!state.webdav.url || !state.webdav.user || !state.webdav.pass) return;

function webdavAuth(){

function webdavBaseUrl(){

function webdavFullPath(){

async function webdavEnsureDir(){
  const dir = state.webdav.path.replace(/^\/+|\/+$/g, '').split('/').slice(0, -1);
  if (dir.length === 0) return;
  let cur = webdavBaseUrl();
  for (const seg of dir){
    cur += '/' + seg;
    try {
      await fetch(cur, {
        method: 'MKCOL',
        headers: { 'Authorization': webdavAuth() }
      });
    } catch(e){ /* 忽略 */ }
  }
}
async function webdavUpload(silent){
  if (!webdavConfigOk()) throw new Error('请先填写 WebDAV 配置');
  if (!silent){ syncLog('上传中...'); syncStatusSet('同步中', 'off'); }
  const data = JSON.stringify(serialize(), null, 2);
  const url = webdavFullPath();
  let resp = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': webdavAuth(),
      'Content-Type': 'application/json;charset=utf-8'
    },
    body: data
  });
  if (!resp.ok){
    if (resp.status === 409 || resp.status === 404){
      await webdavEnsureDir();
      resp = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': webdavAuth(),
          'Content-Type': 'application/json;charset=utf-8'
        },
        body: data
      });
    }
  }
  if (!resp.ok){
    if (!silent){ syncLog('上传失败：' + resp.status, 'err'); syncStatusSet('同步失败', 'err'); }
    throw new Error('上传失败(' + resp.status + ')');
  }
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  if (!silent){ syncLog('✅ 上传成功 · ' + timeStr, 'ok'); }
  syncStatusSet('已同步', 'on');
  if (!silent) toast('已上传到数据胶囊', 1500, 'success');
}
async function webdavDownload(){
  if (!webdavConfigOk()){ toast('请先填写 WebDAV 配置', 1800, 'error'); return; }
  syncLog('拉取中...'); syncStatusSet('同步中', 'off');
  try {
    const resp = await fetch(webdavFullPath(), {
      method: 'GET',
      headers: { 'Authorization': webdavAuth() }
    });
    if (resp.status === 404){ syncLog('云端没有数据', 'err'); syncStatusSet('未同步', 'off'); toast('云端暂无数据', 1800, 'error'); return; }
    if (!resp.ok){ syncLog('拉取失败：' + resp.status, 'err'); syncStatusSet('同步失败', 'err'); toast('拉取失败', 1800, 'error'); return; }
    const d = JSON.parse(await resp.text());
    if (!confirm('云端数据将覆盖本地，确定拉取？')){ syncLog('已取消'); return; }
    deserialize(d);
    save();
    updateProfileCache();
    renderHeader(); renderMessages(); renderSuggestions(); renderStatusBar();
    renderProfilePanel(); renderApiForm();
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    syncLog('✅ 拉取成功 · ' + timeStr, 'ok'); syncStatusSet('已同步', 'on');
    toast('已从数据胶囊拉取', 1500, 'success');
  } catch(e){
    syncLog('拉取出错：' + e.message, 'err'); syncStatusSet('同步失败', 'err');
    toast('拉取出错', 1800, 'error');
  }
}

function attachBubbleLongPress(bubble){

  const cancelPress = () => { clearTimeout(timer); bubble.classList.remove('pressing'); };
  bubble.addEventListener('touchstart', startPress, { passive: true });
  bubble.addEventListener('touchend', cancelPress);
  bubble.addEventListener('touchcancel', cancelPress);
  bubble.addEventListener('touchmove', cancelPress, { passive: true });
  bubble.addEventListener('mousedown', startPress);

function copyText(text, cb){

}
function fallbackCopy(text, cb){

function compressImage(dataUrl, maxBytes = 500*1024){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const maxDim = 1600;
      if(w > maxDim || h > maxDim){ const r = Math.min(maxDim/w, maxDim/h); w = Math.round(w*r); h = Math.round(h*r); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const tryC = q => {
        const result = c.toDataURL('image/jpeg', q);
        if(result.length < maxBytes || q < 0.1) resolve(result);
        else tryC(q - 0.05);
      };
      tryC(0.9);
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

function extractJSON(content){
  if(!content || typeof content !== 'string') return null;
  const text = content.trim();
  try { return JSON.parse(text); } catch(e){}
  let cleaned = text.replace(/^```(?:json|JSON)?\s*\n?/i, '').replace(/\n?\s*```\s*$/i, '').trim();
  try { return JSON.parse(cleaned); } catch(e){}
  const fb = text.indexOf('{'), lb = text.lastIndexOf('}');
  if (fb >= 0 && lb > fb){
    const js = text.substring(fb, lb + 1);
    try { return JSON.parse(js); } catch(e){}
    let fixed = js.replace(/[""]/g, '"').replace(/['']/g, "'").replace(/,\s*([\]}])/g, '$1');
    try { return JSON.parse(fixed); } catch(e){}
    try { return JSON.parse(fixed.replace(/[\x00-\x1F\x7F]/g, ' ')); } catch(e){}
  }
  const fB = text.indexOf('['), lB = text.lastIndexOf(']');
  if (fB >= 0 && lB > fB){
    try {
      const arr = JSON.parse(text.substring(fB, lB + 1));
      if (Array.isArray(arr)) return { suggestions: arr };
    } catch(e){}
  }
  return null;
}
function textFallback(content){
  if (!content) return null;
  const styles = ['短','情绪','展开'];
  const lines = content.split(/\n+/).map(l => l.trim()
    .replace(/^[\s\-\*#>`]+/, '').replace(/^\d+[\.\)、:：]\s*/, '')
    .replace(/^["「『]+|["」』]+$/g, '').trim()
  ).filter(l => {
    if (l.length < 2 || l.length > 100) return false;
    if (/^(以下是|下面是|建议如下|回复建议|响应)[:：]?$/.test(l)) return false;
    return true;
  });
  if (lines.length === 0) return null;
  return { suggestions: lines.slice(0, 3).map((text, i) => ({ text, style: styles[i] || '建议' })) };
}
function buildRequest({provider, model, messages, apiKey, temperature, maxTokens, hasImage}){
  const p = PROVIDERS[provider];
  const format = p.format;
  const apiUrl = p.url;
  if(format === 'anthropic'){
    const sys = messages.find(m=>m.role==='system');
    const others = messages.filter(m=>m.role!=='system');
    const anthMsgs = others.map(m=>{
      let blocks;
      if(typeof m.content === 'string') blocks = [{type:'text', text:m.content}];
      else blocks = m.content.map(c=>{
        if(c.type === 'text') return {type:'text', text:c.text};
        if(c.type === 'image_url'){
          const dataUrl = c.image_url.url || '';
          const [meta, b64] = dataUrl.split(',');
          const mm = meta && meta.match(/data:(.*?);/);
          return {type:'image', source:{type:'base64', media_type: mm?mm[1]:'image/jpeg', data:b64||''}};
        }
        return {type:'text', text:''};
      });
      return {role: m.role==='assistant'?'assistant':'user', content:blocks};
    });
    return {
      url: apiUrl,
      headers:{'Content-Type':'application/json','x-api-key': apiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:{ model, max_tokens:maxTokens, temperature, system: sys ? sys.content : '', messages: anthMsgs },
      parse: d => (d && d.content && d.content[0] && d.content[0].text) || ''
    };
  }
  if(format === 'google'){
    const sys = messages.find(m=>m.role==='system');
    const others = messages.filter(m=>m.role!=='system');
    const contents = others.map(m=>{
      const parts = [];
      if(typeof m.content === 'string') parts.push({text: m.content});
      else m.content.forEach(c=>{
        if(c.type === 'text') parts.push({text:c.text});
        else if(c.type === 'image_url'){
          const dataUrl = c.image_url.url || '';
          const [meta, b64] = dataUrl.split(',');
          const mm = meta && meta.match(/data:(.*?);/);
          parts.push({inline_data:{mime_type: mm?mm[1]:'image/jpeg', data:b64||''}});
        }
      });
      return {role: m.role==='assistant'?'model':'user', parts};
    });
    const url = apiUrl.replace(/\/$/, '') + '/' + model + ':generateContent?key=' + encodeURIComponent(apiKey);
    return {
      url, headers:{'Content-Type':'application/json'},
      body:{ system_instruction: sys ? {parts:[{text:sys.content}]} : undefined,
        contents, generationConfig:{temperature, maxOutputTokens:maxTokens} },
      parse: d => { try{ return d.candidates[0].content.parts.map(x=>x.text||'').join(''); }catch(e){ return ''; } }
    };
  }
  const body = {model, messages, temperature, max_tokens:maxTokens};
  if (p.jsonMode && !hasImage) body.response_format = { type: 'json_object' };
  return {
    url: apiUrl,
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey },
    body,
    parse: d => { try{ return d.choices[0].message.content || ''; }catch(e){ return ''; } }
  };
}

  dom.apiForm.querySelectorAll('.default-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.defaultProvider = btn.dataset.act === 'unset' ? '' : btn.dataset.pid;
      save(); renderApiForm();
    });
  });
}
function updateRowStyle(pid, key){
  const row = dom.apiForm.querySelector('.api-row[data-pid="'+pid+'"]');
  if(!row) return;
  const hasKey = !!key;
  const isDefault = state.defaultProvider === pid && hasKey;
  row.classList.toggle('has-key', hasKey);
  row.classList.toggle('is-default', isDefault);
  const header = row.querySelector('.api-row-header');
  const oldBtn = header.querySelector('.default-btn');
  if(oldBtn) oldBtn.remove();
  if(hasKey){
    const btn = document.createElement('button');
    btn.className = 'default-btn' + (isDefault ? ' active' : '');
    btn.dataset.pid = pid;
    btn.dataset.act = isDefault ? 'unset' : 'set';
    btn.textContent = isDefault ? '✓ 默认' : '设为默认';
    btn.addEventListener('click', () => {
      state.defaultProvider = btn.dataset.act === 'unset' ? '' : pid;
      save(); renderApiForm();
    });
    header.appendChild(btn);
  }
  dom.apiForm.querySelectorAll('.api-row').forEach(r => {
    const rp = r.dataset.pid;
    const rHas = !!state.apiKeys[rp];
    const rDef = state.defaultProvider === rp && rHas;
    r.classList.toggle('is-default', rDef);
  });
}
function renderProfilePanel(){
  const samples = state.styleSamples || [];
  const lang = state.langProfile;
  const scenes = state.sceneProfile || [];
  if (samples.length === 0){
    dom.profilePanel.innerHTML =
      '<div class="pp-head"><div class="pp-title">🧬 我的综合画像</div><div class="pp-count">0 条样本</div></div>'
      + '<div class="pp-empty">还没有学习样本。<br>· 用 <b>✍️</b> 记录你说过的话<br>· 或 <b>✎</b> 修改 AI 的建议后复制<br>AI 会跨所有对话自动总结你的画像。</div>';
    return;
  }
  if (samples.length < 3){
    dom.profilePanel.innerHTML =
      '<div class="pp-head"><div class="pp-title">🧬 我的综合画像</div><div class="pp-count">' + samples.length + ' 条样本</div></div>'
      + '<div class="pp-empty">至少需要 3 条样本才能分析。</div>'
      + '<div class="pp-actions"><button class="pp-btn-clear" data-action="clear">🗑️ 清空样本</button>'
      + '<button class="pp-btn-view" data-action="view">👁️ 查看样本</button></div>';
    bindProfileActions();
    return;
  }
  const tags = [];
  if (lang){
    if (lang.avgLen <= 8) tags.push({ text:'⚡ 超短句 ' + lang.avgLen + '字', highlight:true });
    else if (lang.avgLen <= 15) tags.push({ text:'✂️ 偏短句 ' + lang.avgLen + '字' });
    else tags.push({ text:'📝 长句 ' + lang.avgLen + '字' });
    if (lang.usePeriodRate < 0.15) tags.push({ text:'不用句号', highlight:true });
    else if (lang.endWithPeriod) tags.push({ text:'爱用句号' });
    if (!lang.useComma) tags.push({ text:'不用逗号' });
    if (lang.useExclamation) tags.push({ text:'会打感叹号' });
    if (lang.useEmoji) tags.push({ text:'用 emoji' });
    else tags.push({ text:'不用 emoji', highlight:true });
    if (lang.particles.length > 0) tags.push({ text:'常用：' + lang.particles.slice(0,4).join('·'), highlight:true });
    if (lang.commonOpeners.length > 0) tags.push({ text:'常以"' + lang.commonOpeners.slice(0,2).join('" "') + '"开头' });
    if (lang.commonEndings.length > 0) tags.push({ text:'常以"' + lang.commonEndings.slice(0,2).join('" "') + '"结尾' });
  }
  const langHtml = tags.length > 0
    ? '<div class="pp-tags">' + tags.map(t => '<span class="pp-tag' + (t.highlight ? ' highlight' : '') + '">' + esc(t.text) + '</span>').join('') + '</div>'
    : '<div class="pp-empty">样本不足</div>';
  let scenesHtml = '';
  if (scenes.length > 0){
    scenesHtml = '<div class="pp-scenes">' + scenes.slice(0, 4).map(sc =>
      '<div class="pp-scene"><div class="ctx">' + esc(sc.name) + '（' + sc.count + '次）</div>'
      + sc.examples.map(e => '<div class="res">对方"…" → 我"' + esc(e.me) + '"</div>').join('')
      + '</div>').join('') + '</div>';
  } else {
    scenesHtml = '<div class="pp-empty">用 ✍️ 记录时带上对方原话，就能看到你的场景反应模式</div>';
  }
  dom.profilePanel.innerHTML =
    '<div class="pp-head"><div class="pp-title">🧬 我的综合画像</div>'
    + '<div class="pp-count">' + samples.length + ' 条样本 · 跨所有对话</div></div>'
    + '<div class="pp-section"><div class="pp-sec-title">语言特征</div>' + langHtml + '</div>'
    + '<div class="pp-section"><div class="pp-sec-title">场景反应</div>' + scenesHtml + '</div>'
    + '<div class="pp-actions"><button class="pp-btn-clear" data-action="clear">🗑️ 清空样本</button>'
    + '<button class="pp-btn-view" data-action="view">👁️ 查看全部</button></div>';
  bindProfileActions();
}
function bindProfileActions(){
  const clearBtn = dom.profilePanel.querySelector('[data-action="clear"]');
  const viewBtn = dom.profilePanel.querySelector('[data-action="view"]');
  if (clearBtn) clearBtn.addEventListener('click', clearStyleSamples);
  if (viewBtn) viewBtn.addEventListener('click', openSamplesModal);
}
function clearStyleSamples(){
  if (!confirm('清空所有学习样本？AI 会忘记你的说话方式。')) return;
  state.styleSamples = []; state.langProfile = null; state.sceneProfile = [];
  save(); renderProfilePanel();
  toast('已清空学习样本', 1200, 'success');
}
function openSamplesModal(){
  const samples = state.styleSamples || [];
  if (samples.length === 0){
    dom.samplesBody.innerHTML = '<div style="color:#999;text-align:center;padding:40px 0;">暂无样本</div>';
  } else {
    const sorted = [...samples].sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    dom.samplesBody.innerHTML = sorted.map(s => {
      const hasCtx = s.taText;
      return '<div class="sample-item' + (hasCtx ? '' : ' no-ctx') + '">'
        + '<div class="si-pair">'
        + (hasCtx ? '<div class="si-ta"><span class="lbl">对方</span>' + esc(s.taText) + '</div>' : '')
        + '<div class="si-me"><span class="lbl">我</span>' + esc(s.myText) + '</div>'
        + '</div>'
        + (s.timestamp ? '<div class="si-meta">' + formatTime(s.timestamp) + '</div>' : '')
        + '</div>';
    }).join('');
  }
  dom.samplesModal.classList.add('show');
}
function closeSamplesModal(){ dom.samplesModal.classList.remove('show'); }
function openSettings(){
  dom.settings.classList.add('show');
  dom.myName.value = state.myName;
  dom.taName.value = state.taName;
  dom.myStyle.value = state.myStyle;
  renderProfilePanel();
  renderSyncPanel();
  renderApiForm();
}
function closeSettings(){
  state.myName = dom.myName.value.trim();
  state.taName = dom.taName.value.trim();
  state.myStyle = dom.myStyle.value.trim();
  save();
  dom.settings.classList.remove('show');
}
function bindEvents(){
  dom.settingsBtn.addEventListener('click', openSettings);
  dom.closeSettings.addEventListener('click', closeSettings);
  dom.drawerBtn.addEventListener('click', openDrawer);
  dom.drawerMask.addEventListener('click', closeDrawer);
  dom.newChatBtn.addEventListener('click', () => handleNewChat('chat'));
  dom.newChatOnlineBtn.addEventListener('click', () => handleNewChat('chat'));
  dom.newChatRealBtn.addEventListener('click', () => handleNewChat('real'));
  dom.statusBar.addEventListener('click', (e) => { if (e.target.tagName === 'INPUT') return; editStatus(); });
  dom.sendBtn.addEventListener('click', handleSend);
  dom.input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); handleSend(); }
  });
  dom.modeBtn.addEventListener('click', () => {
    const session = getCurrentSession();
    session.mode = (session.mode || 'chat') === 'real' ? 'chat' : 'real';
    session.updatedAt = Date.now();
    state.suggestions = []; state.loading = false;
    save();
    updateModeBtn(); renderHeader(); renderMessages(); renderSuggestions();
    toast(session.mode === 'real' ? '🗣️ 已切换到现实对话' : '💬 已切换到线上聊天', 1200, 'success');
  });
  dom.imageBtn.addEventListener('click', ()=>dom.fileInput.click());
  dom.fileInput.addEventListener('change', e=>{
    if(e.target.files.length) handleImageSelect(e.target.files[0]);
  });
  dom.removeImg.addEventListener('click', clearImage);
  dom.previewImg.addEventListener('click', ()=>{
    if(dom.previewImg.src && dom.previewImg.src.startsWith('data:image')) showImageModal(dom.previewImg.src);
  });
  dom.myName.addEventListener('input', ()=>{ state.myName = dom.myName.value.trim(); save(); });
  dom.taName.addEventListener('input', ()=>{ state.taName = dom.taName.value.trim(); save(); });
  dom.myStyle.addEventListener('input', ()=>{ state.myStyle = dom.myStyle.value; save(); });
  dom.speakClose.addEventListener('click', closeSpeakPanel);
  dom.speakCopy.addEventListener('click', () => {
    const idx = state.currentSpeakIdx;
    if (idx < 0) return;
    copyText(state.suggestions[idx].text, () => toast('已复制', 1000, 'success'));
  });
  dom.speakPlay.addEventListener('click', () => {
    const idx = state.currentSpeakIdx;
    if (idx < 0) return;
    speakText(state.suggestions[idx].text);
  });
  dom.speakSaid.addEventListener('click', confirmSpeakSaid);
  dom.speakPanel.addEventListener('click', (e) => {
    if (e.target === dom.speakPanel) closeSpeakPanel();
  });
  dom.meBtn.addEventListener('click', openMeInput);
  dom.meInputMask.addEventListener('click', closeMeInput);
  dom.meInputCancel.addEventListener('click', closeMeInput);
  dom.meInputSave.addEventListener('click', saveMeInput);
  dom.meInputArea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveMeInput(); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeMeInput(); }
  });
  dom.closeSamples.addEventListener('click', closeSamplesModal);
  dom.sheetMask.addEventListener('click', closeActionSheet);
  dom.sheetCancel.addEventListener('click', closeActionSheet);
  dom.sheetDelete.addEventListener('click', deletePendingMessage);
  dom.syncUrl.addEventListener('input', ()=>{ state.webdav.url = dom.syncUrl.value.trim(); save(); renderSyncPanel(); });
  dom.syncUser.addEventListener('input', ()=>{ state.webdav.user = dom.syncUser.value.trim(); save(); renderSyncPanel(); });
  dom.syncPass.addEventListener('input', ()=>{ state.webdav.pass = dom.syncPass.value; save(); renderSyncPanel(); });
  dom.syncPath.addEventListener('input', ()=>{ state.webdav.path = dom.syncPath.value.trim() || 'chat-assistant/data.json'; save(); renderSyncPanel(); });
  dom.syncAuto.addEventListener('change', ()=>{ state.webdav.auto = dom.syncAuto.checked; save(); renderSyncPanel(); });
  dom.syncUpBtn.addEventListener('click', async () => {
    dom.syncUpBtn.disabled = true;
    try { await webdavUpload(false); }
    catch(e){ syncLog('❌ ' + e.message, 'err'); syncStatusSet('同步失败', 'err'); toast(e.message, 2500, 'error'); }
    finally { dom.syncUpBtn.disabled = false; }
  });
  dom.syncDownBtn.addEventListener('click', async () => {
    dom.syncDownBtn.disabled = true;
    try { await webdavDownload(); }
    finally { dom.syncDownBtn.disabled = false; }
  });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      if(dom.speakPanel.classList.contains('show')) closeSpeakPanel();
      else if(dom.samplesModal.classList.contains('show')) closeSamplesModal();
      else if(dom.meInputPanel.classList.contains('show')) closeMeInput();
      else if(dom.sheet.classList.contains('show')) closeActionSheet();
      else if(dom.drawer.classList.contains('show')) closeDrawer();
      else if(dom.settings.classList.contains('show')) closeSettings();
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  window.addEventListener('beforeunload', save);
  if (window.speechSynthesis) speechSynthesis.getVoices();
}
function init(){
  load();
  updateProfileCache();
  if(state.sessions.length === 0) createSession(true, 'chat');
  updateModeBtn();
  renderHeader(); renderMessages(); renderSuggestions(); renderStatusBar();
  bindEvents();
  const hasAny = PROVIDER_ORDER.some(p => state.apiKeys[p]);
  if (!hasAny){
    const guided = localStorage.getItem('chat_guided_v10');
    if (!guided){
      setTimeout(openSettings, 400);
      try { localStorage.setItem('chat_guided_v10', '1'); } catch(e){}
    }
  }
}
init();
})();
</script>
</body>
</html>
