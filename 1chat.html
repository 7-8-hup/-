<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 聊天助手</title>
    <style>
        :root {
            --purple-50: #faf5ff;
            --purple-100: #f3e8ff;
            --purple-200: #e9d5ff;
            --purple-300: #d8b4fe;
            --purple-400: #c084fc;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7c3aed;
            --purple-800: #6d28d9;
            --green-50: #f0fdf4;
            --green-100: #dcfce7;
            --green-200: #bbf7d0;
            --green-700: #15803d;
            --green-800: #166534;
            --red-50: #fef2f2;
            --red-100: #fee2e2;
            --red-700: #b91c1c;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 40px;
            --shadow-sm: 0 2px 8px rgba(100, 70, 120, 0.06);
            --shadow-md: 0 8px 24px rgba(100, 70, 120, 0.12);
            --shadow-lg: 0 16px 48px rgba(100, 70, 120, 0.18);
            --shadow-glow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 20px 60px rgba(100, 70, 120, 0.2);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(160deg, #faf5ff 0%, #f0e6f6 30%, #e8dcf0 60%, #f5f0fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #app {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-glow);
            padding: 18px 14px 12px;
            height: 96vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            gap: 8px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 30px;
            letter-spacing: 0.2px;
            white-space: nowrap;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .badge.online { background: var(--green-100); color: var(--green-800); }
        .badge.offline { background: var(--red-100); color: var(--red-700); }
        .settings-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 30px;
            transition: var(--transition);
            line-height: 1;
            flex-shrink: 0;
        }
        .settings-btn:hover { background: rgba(124, 58, 237, 0.08); }
        .settings-btn:active { transform: scale(0.9); }
        .profile-tag {
            font-size: 11px;
            color: var(--gray-500);
            background: rgba(124, 58, 237, 0.07);
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            max-width: 110px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: var(--transition);
            font-weight: 500;
            flex-shrink: 1;
        }
        .profile-tag:hover { background: rgba(124, 58, 237, 0.15); }

        .settings-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin: 10px 0;
            display: none;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.7);
            max-height: 55vh;
            overflow-y: auto;
            box-shadow: var(--shadow-sm);
        }
        .settings-panel.show { display: block; animation: fadeSlideIn 0.25s ease; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .settings-panel label {
            font-size: 11px;
            font-weight: 600;
            color: var(--gray-600);
            display: block;
            margin: 10px 0 4px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .settings-panel label:first-of-type { margin-top: 0; }
        .settings-panel input {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--gray-200);
            font-size: 13px;
            outline: none;
            background: #fff;
            transition: var(--transition);
        }
        .settings-panel input:focus { border-color: var(--purple-500); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08); }
        .settings-panel .hint { font-size: 10px; color: var(--gray-400); margin-top: 3px; }
        .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .toggle-row label { margin: 0; cursor: pointer; font-weight: 400; text-transform: none; font-size: 13px; }
        .toggle-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--purple-600); cursor: pointer; }
        .btn-save {
            margin-top: 12px;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 30px;
            background: var(--purple-600);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .btn-save:hover { background: var(--purple-700); box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35); }
        .btn-save:active { transform: scale(0.96); }
        .btn-secondary { background: var(--gray-200); color: var(--gray-700); box-shadow: none; }
        .btn-secondary:hover { background: var(--gray-300); box-shadow: none; }

        .object-list { margin-top: 6px; }
        .object-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #fff;
            border-radius: var(--radius-sm);
            margin-bottom: 5px;
            border: 1.5px solid var(--gray-200);
            cursor: pointer;
            transition: var(--transition);
        }
        .object-item:hover { background: var(--gray-50); border-color: var(--gray-300); }
        .object-item.active { border-color: var(--purple-500); background: #faf5ff; box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.06); }
        .object-item .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--purple-100);
            color: var(--purple-700);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            margin-right: 10px;
            text-transform: uppercase;
        }
        .object-item .info-wrap { flex: 1; min-width: 0; }
        .object-item .name { font-weight: 600; font-size: 13px; color: var(--gray-800); }
        .object-item .info { font-size: 10px; color: var(--gray-500); margin-top: 1px; }
        .object-item .del-btn {
            background: none;
            border: none;
            color: var(--gray-400);
            font-size: 15px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 20px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .object-item .del-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.06); }
        .add-object-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .add-object-row input { flex: 1; min-width: 70px; padding: 7px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .add-object-row input:focus { border-color: var(--purple-500); }
        .add-object-row .btn { padding: 7px 14px; border-radius: 30px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; background: var(--purple-600); color: #fff; transition: var(--transition); }
        .add-object-row .btn:active { transform: scale(0.92); }

        .preset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 12px;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            border: 1px solid var(--gray-200);
        }
        .preset-item .name { font-size: 12px; font-weight: 500; cursor: pointer; flex: 1; color: var(--gray-700); transition: var(--transition); }
        .preset-item .name:hover { color: var(--purple-600); }
        .preset-item .del-preset { background: none; border: none; color: var(--gray-400); cursor: pointer; padding: 0 6px; font-size: 13px; transition: var(--transition); }
        .preset-item .del-preset:hover { color: #ef4444; }
        .add-preset-row { display: flex; gap: 5px; margin-top: 5px; }
        .add-preset-row input { flex: 1; padding: 6px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .add-preset-row input:focus { border-color: var(--purple-500); }
        .add-preset-row .btn { padding: 6px 13px; border-radius: 20px; border: none; font-size: 11px; cursor: pointer; background: var(--purple-600); color: #fff; font-weight: 600; transition: var(--transition); }

        .tags-wrap { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: #ede9fe;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 11px;
            color: #5b21b6;
            cursor: pointer;
            border: 1px solid #ddd6fe;
            transition: var(--transition);
            font-weight: 500;
        }
        .tag .del-tag { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 12px; padding: 0 2px; transition: var(--transition); }
        .tag .del-tag:hover { color: #ef4444; }
        .tag:hover { background: #ddd6fe; }
        .relation-input-row { display: flex; gap: 5px; margin: 4px 0 6px; }
        .relation-input-row input { flex: 1; padding: 6px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .relation-input-row input:focus { border-color: var(--purple-500); }
        .relation-input-row .btn { padding: 6px 13px; border-radius: 20px; border: none; font-size: 11px; cursor: pointer; background: var(--purple-600); color: #fff; font-weight: 600; transition: var(--transition); }

        .scenario-input-row { display: flex; gap: 5px; margin: 4px 0 6px; }
        .scenario-input-row input { flex: 1; padding: 6px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .scenario-input-row input:focus { border-color: var(--purple-500); }
        .scenario-input-row .btn { padding: 6px 13px; border-radius: 20px; border: none; font-size: 11px; cursor: pointer; background: var(--purple-600); color: #fff; font-weight: 600; transition: var(--transition); }

        .config-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .config-group {
            flex: 1;
            min-width: 80px;
            max-width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .config-group label {
            font-size: 9px;
            font-weight: 700;
            color: var(--gray-400);
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .chip-group {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .chip {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 30px;
            background: var(--gray-100);
            color: var(--gray-500);
            border: 1.5px solid transparent;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .chip:hover { background: #ede9fe; color: var(--purple-600); }
        .chip.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3); font-weight: 600; }
        .chip:active { transform: scale(0.9); }

        .quick-bar {
            display: flex;
            gap: 10px;
            margin: 6px 0;
            flex-shrink: 0;
            flex-wrap: wrap;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-size: 11px;
        }
        .quick-item { font-size: 11px; color: var(--gray-500); display: flex; align-items: center; gap: 3px; }
        .quick-item .label { font-weight: 600; color: var(--gray-600); font-size: 10px; }
        .quick-item .value {
            background: #ede9fe;
            padding: 1px 9px;
            border-radius: 30px;
            font-weight: 500;
            color: #5b21b6;
            cursor: pointer;
            font-size: 11px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .quick-item .value:hover { background: #ddd6fe; }
        .quick-item .value .mini-avatar {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--purple-200);
            color: var(--purple-700);
            font-size: 8px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .history-area {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.45);
            border-radius: var(--radius-lg);
            margin: 6px 0 4px;
            padding: 10px 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }
        .history-empty { color: #c4b5d0; font-size: 13px; text-align: center; margin: auto; font-weight: 500; letter-spacing: 0.3px; }
        .msg-bubble {
            max-width: 85%;
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
            animation: msgIn 0.25s ease;
            position: relative;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg-girl { align-self: flex-start; background: #ede9fe; color: #2e1065; border-bottom-left-radius: 6px; border: 1px solid #e9d5ff; }
        .msg-guy { align-self: flex-end; background: #d1fae5; color: #064e3b; border-bottom-right-radius: 6px; border: 1px solid #bbf7d0; }
        .msg-label { font-size: 9px; opacity: 0.5; margin-bottom: 2px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }

        .suggestions-panel {
            flex-shrink: 0;
            max-height: 40vh;
            overflow-y: auto;
            background: linear-gradient(135deg, #fffdf5, #fffef9);
            border: 1.5px solid #f3e8d0;
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            margin: 4px 0 2px;
            box-shadow: 0 2px 12px rgba(180, 150, 80, 0.08);
            animation: slideUp 0.3s ease;
            display: none;
        }
        .suggestions-panel.show { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .suggestions-panel .s-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .suggestions-panel .s-title { font-weight: 700; font-size: 12px; color: #8b7355; display: flex; align-items: center; gap: 4px; letter-spacing: 0.2px; }
        .suggestions-panel .s-close { background: none; border: none; color: #c4b5a0; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 20px; transition: var(--transition); line-height: 1; }
        .suggestions-panel .s-close:hover { color: #a08060; background: rgba(0, 0, 0, 0.04); }
        .suggestion-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            margin-bottom: 5px;
            background: #fff;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid #f0e8d5;
            transition: var(--transition);
            position: relative;
        }
        .suggestion-card:last-child { margin-bottom: 0; }
        .suggestion-card:hover { background: #fffbeb; border-color: #e8d8b0; box-shadow: 0 1px 4px rgba(180, 150, 80, 0.1); transform: translateX(2px); }
        .suggestion-card:active { transform: scale(0.97); background: #fef9e7; }
        .suggestion-card .s-num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ede9fe;
            color: #5b21b6;
            font-weight: 700;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .suggestion-card .s-body { flex: 1; min-width: 0; }
        .suggestion-card .s-text { font-weight: 500; font-size: 13px; color: var(--gray-800); line-height: 1.4; }
        .suggestion-card .s-meta { font-size: 10px; color: #a09080; display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
        .suggestion-card .s-meta span { background: #fdf6e8; padding: 1px 7px; border-radius: 10px; font-size: 9px; white-space: nowrap; }
        .suggestion-card .s-copy-hint { font-size: 9px; color: var(--purple-500); opacity: 0; transition: var(--transition); white-space: nowrap; font-weight: 500; }
        .suggestion-card:hover .s-copy-hint { opacity: 1; }
        .suggestion-card.copied { background: #f0fdf4 !important; border-color: #bbf7d0 !important; }
        .suggestion-card.copied .s-num { background: #bbf7d0; color: #166534; }
        .suggestion-card.copied .s-copy-hint { opacity: 1; color: #15803d; }

        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-area input {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1.5px solid var(--gray-200);
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: var(--transition);
        }
        .input-area input:focus { border-color: var(--purple-500); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.06); }
        .input-area .btn-group { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }
        .btn { padding: 11px 18px; border-radius: 40px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: var(--transition); letter-spacing: 0.2px; }
        .btn:active { transform: scale(0.93); }
        .btn-primary { background: var(--purple-600); color: #fff; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3); }
        .btn-primary:hover { background: var(--purple-700); box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4); }
        .btn-primary:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; }
        .btn-outline { background: transparent; color: var(--gray-500); border: 1.5px solid var(--gray-200); padding: 10px 14px; font-size: 12px; }
        .btn-outline:hover { background: var(--gray-50); border-color: var(--gray-300); }
        .btn-image { background: transparent; color: var(--purple-600); border: 1.5px solid var(--purple-400); padding: 9px 13px; font-size: 18px; line-height: 1; }
        .btn-image:hover { background: rgba(124, 58, 237, 0.06); border-color: var(--purple-500); }
        .image-preview {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            flex-shrink: 0;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            border: 1px solid var(--gray-200);
        }
        .image-preview img { max-width: 50px; max-height: 50px; border-radius: 10px; border: 1px solid var(--gray-200); object-fit: cover; }
        .image-preview .remove-img { background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 20px; transition: var(--transition); }
        .image-preview .remove-img:hover { background: rgba(239, 68, 68, 0.08); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            background: var(--gray-800);
            color: #fff;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 13px;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            z-index: 999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid var(--gray-200);
            border-top-color: var(--purple-600);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .suggestions-loader { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; color: var(--gray-500); font-size: 12px; font-weight: 500; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0b5bc; }

        .small-btn { padding: 4px 10px; font-size: 11px; border-radius: 20px; }
        hr { margin: 14px 0; border: none; border-top: 1px solid var(--gray-200); }

        @media (max-width: 400px) {
            #app { padding: 12px 8px 8px; border-radius: 28px; height: 98vh; }
            .header h1 { font-size: 17px; }
            .chip { font-size: 9px; padding: 3px 8px; }
            .btn { padding: 9px 14px; font-size: 12px; }
            .input-area input { padding: 10px 14px; font-size: 13px; }
            .suggestions-panel { max-height: 30vh; padding: 8px 10px; }
            .suggestion-card .s-text { font-size: 12px; }
            .profile-tag { max-width: 80px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>💬 聊天助手</h1>
            <div class="header-right">
                <span class="profile-tag" id="profileTag">👤 选择对象</span>
                <span class="badge offline" id="statusBadge">⛔ 未连接</span>
                <button class="settings-btn" id="settingsToggle" title="设置">⚙️</button>
            </div>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <label>📦 API 预设</label>
            <div id="presetList"></div>
            <div class="add-preset-row">
                <input type="text" id="newPresetName" placeholder="预设名称">
                <button class="btn" id="addPresetBtn">💾 保存</button>
            </div>
            <label>🔑 API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
            <label>🌐 API 地址</label>
            <input type="text" id="apiUrlInput" placeholder="https://open.bigmodel.cn/api/paas/v4/chat/completions">
            <label>🧠 模型名称</label>
            <input type="text" id="modelInput" placeholder="glm-4-flash / deepseek-chat">
            <div class="toggle-row">
                <input type="checkbox" id="useAI" checked>
                <label for="useAI">启用 AI</label>
            </div>
            <button class="btn-save" id="saveSettingsBtn">💾 保存配置到预设</button>
            <hr>

            <label>🎯 场景管理</label>
            <div class="scenario-input-row">
                <input type="text" id="newScenarioInput" placeholder="新场景名称">
                <button class="btn" id="addScenarioBtn">➕</button>
            </div>
            <div class="tags-wrap" id="scenarioTags"></div>
            <div style="font-size:10px; color:var(--gray-400); margin-top:3px;">点击场景名称可切换，点击 ✕ 删除</div>
            <hr>

            <label>👥 聊天对象</label>
            <div class="object-list" id="objectList"></div>
            <div class="add-object-row">
                <input type="text" id="newObjectName" placeholder="昵称">
                <button class="btn small-btn" id="addObjectBtn">➕</button>
            </div>
            <label>🤝 关系管理</label>
            <div class="relation-input-row">
                <input type="text" id="newRelationInput" placeholder="关系">
                <button class="btn" id="addRelationBtn">➕</button>
            </div>
            <div class="tags-wrap" id="relationTags"></div>
            <label>✏️ 编辑对象</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input type="text" id="profileName" placeholder="昵称" style="flex:1;min-width:55px;">
                <input type="number" id="profileAge" placeholder="年龄" style="flex:0.7;min-width:45px;">
            </div>
            <input type="text" id="profileHobby" placeholder="爱好/职业">
            <input type="text" id="profileNote" placeholder="备注">
            <label style="margin-top:6px;">🤝 与我的关系</label>
            <input type="text" id="profileRelationship" placeholder="输入或点击标签">
            <div class="tags-wrap" id="profileRelationTags"></div>
            <button class="btn-save" id="saveObjectBtn">💾 更新对象</button>
            <hr>

            <label>🧑 我的资料</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input type="text" id="myName" placeholder="我的昵称" style="flex:1;min-width:55px;">
                <input type="number" id="myAge" placeholder="年龄" style="flex:0.7;min-width:45px;">
            </div>
            <input type="text" id="myHobby" placeholder="我的爱好/职业">
            <input type="text" id="myNote" placeholder="我的备注">
            <button class="btn-save" id="saveMyProfileBtn" style="margin-top:6px;">💾 保存我的资料</button>
        </div>

        <div class="config-row">
            <div class="config-group">
                <label>🎯 场景</label>
                <div class="chip-group" id="scenarioGroup"></div>
            </div>
            <div class="config-group">
                <label>🎭 风格</label>
                <div class="chip-group" id="styleGroup">
                    <button class="chip" data-value="幽默">幽默</button>
                    <button class="chip" data-value="直球">直球</button>
                    <button class="chip active" data-value="话题延伸">延伸</button>
                    <button class="chip" data-value="开启话题">开启</button>
                    <button class="chip" data-value="高情商回复">高情商</button>
                </div>
            </div>
        </div>

        <div class="quick-bar" id="quickBar">
            <div class="quick-item"><span class="label">🤝</span><span class="value" id="quickRelation">未设置</span></div>
            <div class="quick-item"><span class="label">🎯</span><span class="value" id="quickPurpose">日常闲聊</span></div>
        </div>

        <div class="history-area" id="historyArea">
            <div class="history-empty">👋 添加对象开始</div>
        </div>

        <div class="suggestions-panel" id="suggestionsPanel">
            <div class="s-header">
                <span class="s-title">💡 AI 候选回复</span>
                <button class="s-close" id="closeSuggestionsBtn" title="关闭">✕</button>
            </div>
            <div id="suggestionsContent"></div>
        </div>

        <div class="image-preview" id="imagePreview" style="display:none;">
            <img id="previewImg" alt="预览">
            <button class="remove-img" id="removeImgBtn">✕</button>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入对方原话...">
            <div class="btn-group">
                <button class="btn btn-image" id="imageBtn" title="上传图片">📷</button>
                <button class="btn btn-primary" id="sendBtn">🚀 获取</button>
                <button class="btn btn-outline" id="clearHistoryBtn" title="清除记录">🗑️</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const state = {
            objects: [],
            currentObjectId: null,
            config: { scenario: '日常闲聊', style: '话题延伸' },
            isLoading: false,
            pendingGuyReply: false,
            apiKey: '',
            apiUrl: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
            model: 'glm-4-flash',
            useAI: true,
            imageBase64: null,
            presets: [],
            currentPreset: '',
            relations: ['朋友', '同事', '恋人', '家人', '客户', '其他'],
            currentSuggestions: null,
            scenarios: ['日常闲聊', '深入交流', '正式沟通'],
            myProfile: { name: '', age: '', hobby: '', note: '' }
        };

        const $ = id => document.getElementById(id);
        const historyArea = $('historyArea'),
            toastEl = $('toast'),
            statusBadge = $('statusBadge'),
            profileTag = $('profileTag');
        const messageInput = $('messageInput'),
            sendBtn = $('sendBtn');
        const settingsPanel = $('settingsPanel'),
            settingsToggle = $('settingsToggle'),
            apiKeyInput = $('apiKeyInput'),
            apiUrlInput = $('apiUrlInput'),
            modelInput = $('modelInput'),
            useAICheckbox = $('useAI');
        const profileName = $('profileName'),
            profileAge = $('profileAge'),
            profileHobby = $('profileHobby'),
            profileNote = $('profileNote'),
            profileRelationship = $('profileRelationship');
        const saveSettingsBtn = $('saveSettingsBtn'),
            saveObjectBtn = $('saveObjectBtn'),
            clearHistoryBtn = $('clearHistoryBtn'),
            objectList = $('objectList'),
            newObjectName = $('newObjectName'),
            addObjectBtn = $('addObjectBtn');
        const imageBtn = $('imageBtn'),
            fileInput = $('fileInput'),
            imagePreview = $('imagePreview'),
            previewImg = $('previewImg'),
            removeImgBtn = $('removeImgBtn');
        const presetList = $('presetList'),
            newPresetName = $('newPresetName'),
            addPresetBtn = $('addPresetBtn');
        const quickRelation = $('quickRelation'),
            quickPurpose = $('quickPurpose');
        const relationTags = $('relationTags'),
            profileRelationTags = $('profileRelationTags'),
            newRelationInput = $('newRelationInput'),
            addRelationBtn = $('addRelationBtn');
        const suggestionsPanel = $('suggestionsPanel'),
            suggestionsContent = $('suggestionsContent'),
            closeSuggestionsBtn = $('closeSuggestionsBtn');
        const scenarioTags = $('scenarioTags'),
            newScenarioInput = $('newScenarioInput'),
            addScenarioBtn = $('addScenarioBtn'),
            scenarioGroup = $('scenarioGroup');
        const myName = $('myName'),
            myAge = $('myAge'),
            myHobby = $('myHobby'),
            myNote = $('myNote'),
            saveMyProfileBtn = $('saveMyProfileBtn');

        function getConfig() {
            const s = document.querySelector('#scenarioGroup .chip.active')?.dataset.value || state.config.scenario ||
                '日常闲聊';
            const t = document.querySelector('#styleGroup .chip.active')?.dataset.value || '话题延伸';
            return { scenario: s, style: t };
        }
        function showToast(m, d = 2000) {
            toastEl.textContent = m;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), d);
        }
        function updateStatusBadge() {
            const h = state.apiKey && state.apiKey.trim().length > 0;
            if (state.useAI && h) { statusBadge.textContent = '🤖 AI 在线';
                statusBadge.className = 'badge online'; } else if (!state.useAI) { statusBadge.textContent =
                    '⛔ AI 禁用';
                statusBadge.className = 'badge offline'; } else { statusBadge.textContent = '⚠️ 缺少 Key';
                statusBadge.className = 'badge offline'; }
        }
        function updateQuickPurposeText() {
            const current = getConfig().scenario || '日常闲聊';
            quickPurpose.textContent = current;
        }

        // ---------- 场景管理 ----------
        function renderScenarioTags() {
            let html = '';
            state.scenarios.forEach(s => {
                html += `<span class="tag" data-scenario="${s}">${s}<button class="del-tag" data-scenario="${s}">✕</button></span>`;
            });
            scenarioTags.innerHTML = html;
            scenarioTags.querySelectorAll('.tag').forEach(tag => {
                tag.addEventListener('click', function(e) {
                    if (e.target.closest('.del-tag')) return;
                    const scenario = this.dataset.scenario;
                    document.querySelectorAll('#scenarioGroup .chip').forEach(c => c.classList.remove('active'));
                    const targetChip = document.querySelector(`#scenarioGroup .chip[data-value="${scenario}"]`);
                    if (targetChip) targetChip.classList.add('active');
                    state.config.scenario = scenario;
                    updateQuickPurposeText();
                    saveToStorage();
                    const obj = getCurrentObject();
                    if (obj && obj.history && obj.history.some(m => m.role === 'girl')) {
                        regenerateSuggestions();
                    }
                    showToast(`场景切换为：${scenario}`, 1000);
                });
            });
            scenarioTags.querySelectorAll('.del-tag').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const scenario = this.dataset.scenario;
                    if (state.scenarios.length <= 1) { showToast('至少保留一个场景', 1000); return; }
                    if (confirm(`删除场景 "${scenario}" ？`)) {
                        state.scenarios = state.scenarios.filter(s => s !== scenario);
                        if (state.config.scenario === scenario) {
                            state.config.scenario = state.scenarios[0];
                        }
                        saveToStorage();
                        renderScenarioTags();
                        renderScenarioChips();
                        updateQuickPurposeText();
                        showToast('已删除', 1000);
                    }
                });
            });
        }
        function renderScenarioChips() {
            scenarioGroup.innerHTML = '';
            state.scenarios.forEach(s => {
                const chip = document.createElement('button');
                chip.className = 'chip' + (s === state.config.scenario ? ' active' : '');
                chip.dataset.value = s;
                chip.textContent = s;
                chip.addEventListener('click', function(e) {
                    const scenario = this.dataset.value;
                    document.querySelectorAll('#scenarioGroup .chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    state.config.scenario = scenario;
                    updateQuickPurposeText();
                    saveToStorage();
                    const obj = getCurrentObject();
                    if (obj && obj.history && obj.history.some(m => m.role === 'girl')) {
                        regenerateSuggestions();
                    }
                    showToast(`场景：${scenario}`, 1000);
                });
                scenarioGroup.appendChild(chip);
            });
        }
        function addScenario(name) {
            name = name.trim();
            if (!name) { showToast('请输入场景名称', 1000); return; }
            if (state.scenarios.includes(name)) { showToast('已存在', 1000); return; }
            state.scenarios.push(name);
            if (!state.config.scenario) state.config.scenario = name;
            saveToStorage();
            renderScenarioTags();
            renderScenarioChips();
            updateQuickPurposeText();
            showToast(`已添加场景：${name}`, 1000);
        }

        // ---------- 预设 ----------
        function renderPresets() {
            if (state.presets.length === 0) { presetList.innerHTML =
                    '<div style="color:#9ca3af;font-size:12px;padding:4px 0;">暂无预设</div>'; return; }
            let html = '';
            state.presets.forEach(p => {
                const active = p.name === state.currentPreset ? '▶️ ' : '';
                html +=
                    `<div class="preset-item"><span class="name" data-name="${p.name}">${active}${p.name}</span><button class="del-preset" data-name="${p.name}">✕</button></div>`;
            });
            presetList.innerHTML = html;
            presetList.querySelectorAll('.name').forEach(el => {
                el.addEventListener('click', function() {
                    const name = this.dataset.name;
                    const preset = state.presets.find(p => p.name === name);
                    if (preset) {
                        state.apiKey = preset.apiKey;
                        state.apiUrl = preset.apiUrl;
                        state.model = preset.model;
                        state.currentPreset = name;
                        apiKeyInput.value = preset.apiKey;
                        apiUrlInput.value = preset.apiUrl;
                        modelInput.value = preset.model;
                        saveToStorage();
                        updateStatusBadge();
                        showToast(`已切换：${name}`, 1500);
                        renderPresets();
                    }
                });
            });
            presetList.querySelectorAll('.del-preset').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const name = this.dataset.name;
                    if (confirm(`删除预设 "${name}" ？`)) {
                        state.presets = state.presets.filter(p => p.name !== name);
                        if (state.currentPreset === name) state.currentPreset = '';
                        saveToStorage();
                        renderPresets();
                        showToast('已删除', 1000);
                    }
                });
            });
        }
        function saveCurrentAsPreset(name) {
            if (!name.trim()) { showToast('请输入名称', 1000); return; }
            const key = toAscii(apiKeyInput.value.trim());
            const url = toAscii(apiUrlInput.value.trim()) || 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
            const model = toAscii(modelInput.value.trim()) || 'glm-4-flash';
            if (!key) { showToast('API Key不能为空', 1000); return; }
            if (state.presets.some(p => p.name === name.trim()) && !confirm(`覆盖 "${name}" ？`)) return;
            state.presets = state.presets.filter(p => p.name !== name.trim());
            state.presets.push({ name: name.trim(), apiKey: key, apiUrl: url, model });
            state.currentPreset = name.trim();
            state.apiKey = key;
            state.apiUrl = url;
            state.model = model;
            apiKeyInput.value = key;
            apiUrlInput.value = url;
            modelInput.value = model;
            saveToStorage();
            renderPresets();
            updateStatusBadge();
            showToast(`已保存：${name.trim()}`, 1500);
        }

        // ---------- 关系 ----------
        function renderRelations() {
            let html = '';
            state.relations.forEach(r => { html +=
                    `<span class="tag" data-rel="${r}">${r}<button class="del-tag" data-rel="${r}">✕</button></span>`; });
            relationTags.innerHTML = html;
            relationTags.querySelectorAll('.tag').forEach(tag => {
                tag.addEventListener('click', function(e) { if (e.target.closest('.del-tag')) return;
                    newRelationInput.value = this.dataset.rel; });
            });
            relationTags.querySelectorAll('.del-tag').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const rel = this.dataset.rel;
                    if (confirm(`删除关系 "${rel}" ？`)) {
                        state.relations = state.relations.filter(r => r !== rel);
                        saveToStorage();
                        renderRelations();
                        renderProfileRelationTags();
                        showToast('已删除', 1000);
                    }
                });
            });
            renderProfileRelationTags();
        }
        function renderProfileRelationTags() {
            let html = '';
            state.relations.forEach(r => { html += `<span class="tag" data-rel="${r}">${r}</span>`; });
            profileRelationTags.innerHTML = html;
            profileRelationTags.querySelectorAll('.tag').forEach(tag => {
                tag.addEventListener('click', function() { profileRelationship.value = this.dataset.rel; });
            });
        }
        function addRelation(rel) {
            rel = rel.trim();
            if (!rel || state.relations.includes(rel)) return;
            state.relations.push(rel);
            saveToStorage();
            renderRelations();
            showToast(`已添加：${rel}`, 1000);
        }

        // ---------- 对象 ----------
        function getCurrentObject() { return state.objects.find(o => o.id === state.currentObjectId) || null; }
        function updateProfileTag() {
            const o = getCurrentObject();
            profileTag.textContent = o ? `👤 ${o.name||'未命名'}${o.age?' · '+o.age+'岁':''}${o.hobby?' · '+o.hobby:''}` :
                '👤 选择对象';
        }
        function updateQuickBar() {
            const o = getCurrentObject();
            if (o) {
                const initial = (o.name || '?')[0].toUpperCase();
                quickRelation.innerHTML = `<span class="mini-avatar">${initial}</span> ${o.relationship || '未设置'}`;
            } else {
                quickRelation.textContent = '未设置';
            }
            updateQuickPurposeText();
        }

        function renderObjectList() {
            if (state.objects.length === 0) { objectList.innerHTML =
                    '<div style="color:#9ca3af;font-size:12px;text-align:center;padding:6px;">暂无对象，请添加</div>'; return; }
            let html = '';
            state.objects.forEach(obj => {
                const a = obj.id === state.currentObjectId ? 'active' : '';
                const c = obj.history ? obj.history.length : 0;
                const initial = (obj.name || '?')[0].toUpperCase();
                html += `
                    <div class="object-item ${a}" data-id="${obj.id}">
                        <div class="avatar">${initial}</div>
                        <div class="info-wrap">
                            <div class="name">${obj.name||'未命名'}${obj.age?' ('+obj.age+'岁)':''}</div>
                            <div class="info">${obj.hobby||'无备注'} · ${c}条消息</div>
                        </div>
                        <button class="del-btn" data-id="${obj.id}">✕</button>
                    </div>
                `;
            });
            objectList.innerHTML = html;
            objectList.querySelectorAll('.object-item').forEach(item => {
                item.addEventListener('click', function(e) { if (e.target.closest('.del-btn')) return;
                    switchObject(this.dataset.id); });
            });
            objectList.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (confirm('删除该对象？')) deleteObject(this.dataset.id);
                });
            });
        }
        function switchObject(id) {
            state.currentObjectId = id;
            state.currentSuggestions = null;
            loadCurrentObject();
            renderObjectList();
            updateProfileTag();
            updateQuickBar();
            renderHistory();
            renderSuggestionsPanel();
            saveToStorage();
        }
        function loadCurrentObject() {
            const o = getCurrentObject();
            if (o) {
                profileName.value = o.name || '';
                profileAge.value = o.age || '';
                profileHobby.value = o.hobby || '';
                profileNote.value = o.note || '';
                profileRelationship.value = o.relationship || '';
                renderHistory();
            } else {
                profileName.value = profileAge.value = profileHobby.value = profileNote.value = profileRelationship.value =
                    '';
                historyArea.innerHTML = '<div class="history-empty">👋 添加对象开始</div>';
                state.currentSuggestions = null;
                renderSuggestionsPanel();
            }
            updateProfileTag();
            updateQuickBar();
        }
        function addObject(name) {
            if (!name.trim()) { showToast('请输入昵称', 1000); return; }
            if (state.objects.some(o => o.name === name.trim())) { showToast('已存在', 1000); return; }
            const n = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                name: name.trim(),
                age: '',
                hobby: '',
                note: '',
                relationship: '',
                purpose: '闲聊',
                history: []
            };
            state.objects.push(n);
            state.currentObjectId = n.id;
            state.currentSuggestions = null;
            renderObjectList();
            loadCurrentObject();
            saveToStorage();
            showToast(`已添加：${n.name}`, 1500);
        }
        function deleteObject(id) {
            state.objects = state.objects.filter(o => o.id !== id);
            if (state.currentObjectId === id) {
                state.currentObjectId = state.objects.length > 0 ? state.objects[0].id : null;
                state.currentSuggestions = null;
            }
            renderObjectList();
            loadCurrentObject();
            saveToStorage();
            showToast('已删除', 1000);
        }
        function saveObjectDetails() {
            const o = getCurrentObject();
            if (!o) { showToast('请先选择对象', 1000); return; }
            o.name = profileName.value.trim() || '未命名';
            o.age = parseInt(profileAge.value) || '';
            o.hobby = profileHobby.value.trim();
            o.note = profileNote.value.trim();
            const rel = profileRelationship.value.trim();
            o.relationship = rel || '';
            if (rel && !state.relations.includes(rel)) { state.relations.push(rel);
                renderRelations(); }
            renderObjectList();
            updateProfileTag();
            updateQuickBar();
            saveToStorage();
            showToast('已更新', 1500);
        }

        // ---------- 历史 ----------
        function getCurrentHistory() { const o = getCurrentObject(); return o ? o.history : []; }
        function pushHistory(r, c) { const o = getCurrentObject(); if (o) { o.history.push({ role: r, content: c });
                saveToStorage();
                renderHistory(); } }
        function renderHistory() {
            const h = getCurrentHistory();
            if (h.length === 0) { historyArea.innerHTML =
                    `<div class="history-empty">👋 ${getCurrentObject()?'开始与 '+getCurrentObject().name+' 的对话':'添加对象开始'}</div>`; return; }
            let html = '';
            h.forEach(msg => {
                const cls = msg.role === 'girl' ? 'msg-girl' : 'msg-guy';
                const label = msg.role === 'girl' ? '🗣️ 对方' : '🧑 我';
                html +=
                    `<div class="msg-bubble ${cls}"><div class="msg-label">${label}</div>${escapeHtml(msg.content)}</div>`;
            });
            historyArea.innerHTML = html;
            historyArea.scrollTop = historyArea.scrollHeight;
        }
        function escapeHtml(str) { const div = document.createElement('div');
            div.textContent = str; return div.innerHTML; }

        // ---------- 建议面板 ----------
        function renderSuggestionsPanel() {
            const s = state.currentSuggestions;
            if (!s || !s.suggestions || s.suggestions.length === 0) {
                suggestionsPanel.classList.remove('show');
                suggestionsContent.innerHTML = '';
                return;
            }
            suggestionsPanel.classList.add('show');
            let html = '';
            s.suggestions.forEach((item, idx) => {
                html += `
                <div class="suggestion-card" data-text="${encodeURIComponent(item.text)}" data-index="${idx}" onclick="window.copySuggestionFromPanel(this)">
                    <div class="s-num">${idx+1}</div>
                    <div class="s-body">
                        <div class="s-text">${escapeHtml(item.text)}</div>
                        <div class="s-meta"><span>💡 ${escapeHtml(item.reason||'推荐')}</span><span>📈 ${escapeHtml(item.expectedEffect||'预期')}</span></div>
                    </div>
                    <div class="s-copy-hint">👆 复制</div>
                </div>`;
            });
            suggestionsContent.innerHTML = html;
            suggestionsPanel.scrollTop = 0;
        }

        function copySuggestionFromPanel(card) {
            const text = decodeURIComponent(card.dataset.text);
            if (!text) { showToast('内容为空', 1000); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => onSuggestionCopied(card, text)).catch(() =>
                    fallbackCopyPanel(text, card));
            } else { fallbackCopyPanel(text, card); }
        }
        function fallbackCopyPanel(t, card) {
            const ta = document.createElement('textarea');
            ta.value = t;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy');
                onSuggestionCopied(card, t); } catch (e) { showToast('⚠️ 手动复制', 3000); }
            document.body.removeChild(ta);
        }
        function onSuggestionCopied(card, text) {
            card.classList.add('copied');
            card.querySelector('.s-copy-hint').textContent = '✅ 已复制';
            pushHistory('guy', text);
            showToast('✅ 已复制并记录', 1000);
            setTimeout(() => {
                closeSuggestionsPanel();
            }, 600);
        }
        function closeSuggestionsPanel() {
            state.currentSuggestions = null;
            renderSuggestionsPanel();
            saveToStorage();
        }

        // ---------- 图片 ----------
        function compressImage(d, m = 1024 * 1024) {
            return new Promise(r => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width,
                        h = img.height;
                    const c = document.createElement('canvas');
                    let q = 0.9;
                    const t = (Q) => { c.width = w;
                        c.height = h;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const nd = c.toDataURL('image/jpeg', Q); if (nd.length < m || Q < 0.2) r(nd);
                        else t(Q - 0.1); };
                    t(0.9);
                };
                img.src = d;
            });
        }
        function handleImageSelect(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async e => {
                try { const compressed = await compressImage(e.target.result);
                    state.imageBase64 = compressed;
                    previewImg.src = compressed;
                    imagePreview.style.display = 'flex';
                    showToast('✅ 图片已加载', 1000); } catch (err) { showToast('❌ 图片处理失败', 2000); }
            };
            reader.readAsDataURL(file);
        }
        function clearImage() { state.imageBase64 = null;
            imagePreview.style.display = 'none';
            previewImg.src = '';
            fileInput.value = ''; }

        function toAscii(str) { return str.replace(/[^\x00-\x7F]/g, ''); }
        function isStyleOpeningTopic() { return document.querySelector('#styleGroup .chip.active')?.dataset.value ===
                '开启话题'; }

        // ---------- AI 调用 ----------
        async function regenerateSuggestions() {
            const obj = getCurrentObject();
            if (!obj) { showToast('请先选择对象', 1000); return; }
            const history = obj.history || [];
            let lastGirlMsg = null;
            for (let i = history.length - 1; i >= 0; i--) { if (history[i].role === 'girl') { lastGirlMsg = history[i]; break; } }
            if (!lastGirlMsg && !isStyleOpeningTopic()) { showToast('暂无对方消息', 1500); return; }
            if (!state.useAI || !state.apiKey || state.apiKey.trim().length === 0) { showToast('AI未启用或无Key',
                1500); return; }
            state.isLoading = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loader"></span>生成中';
            suggestionsPanel.classList.add('show');
            suggestionsContent.innerHTML = '<div class="suggestions-loader"><span class="loader"></span>AI 正在生成建议...</div>';
            const config = getConfig();
            const relation = obj.relationship || '未设置';
            const isOpening = isStyleOpeningTopic();
            let girlMsg = lastGirlMsg ? lastGirlMsg.content : '';
            if (isOpening && !girlMsg) girlMsg = '请生成几个适合开启新话题的开场白';
            try {
                const r = await callAI(girlMsg, history, config, state.imageBase64, relation, '闲聊', isOpening);
                if (!r.analysis || !r.suggestions || r.suggestions.length < 3) throw new Error('AI返回结构不完整');
                state.currentSuggestions = { suggestions: r.suggestions, analysis: r.analysis };
                renderSuggestionsPanel();
                saveToStorage();
                showToast('💡 已生成候选回复', 1000);
            } catch (err) {
                showToast('❌ ' + err.message, 4000);
                state.currentSuggestions = null;
                renderSuggestionsPanel();
            } finally {
                state.isLoading = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '🚀 获取';
                if (!state.currentSuggestions || !state.currentSuggestions.suggestions) suggestionsPanel.classList.remove(
                    'show');
            }
        }

        async function callAI(gm, h, c, image, relation, purpose, isOpening = false) {
            const cleanKey = toAscii(state.apiKey).trim();
            if (!cleanKey) throw new Error('API Key 无效');
            const cleanUrl = toAscii(state.apiUrl).trim();
            if (!cleanUrl || !cleanUrl.startsWith('http')) throw new Error('API 地址无效');
            let cleanModel = toAscii(state.model).trim() || 'glm-4-flash';
            const isDeepSeek = cleanUrl.includes('deepseek.com');
            if (isDeepSeek && image && !cleanModel.includes('vl')) { cleanModel = 'deepseek-vl';
                showToast('🔄 自动切换视觉模型', 1500); }
            const o = getCurrentObject();
            const profileText = o ?
                `对方信息：${o.name||'未命名'}${o.age?'，'+o.age+'岁':''}${o.hobby?'，喜欢/从事 '+o.hobby:''}${o.note?'，'+o.note:''}` :
                '';

            // 我的资料
            const my = state.myProfile;
            const myText = my.name ? `我（${my.name}${my.age?'，'+my.age+'岁':''}${my.hobby?'，爱好/职业 '+my.hobby:''}${my.note?'，'+my.note:''}）` :
                '我';

            let si = '';
            if (c.style === '幽默') si = '用轻松幽默口语回应，像朋友聊天，可自嘲调侃。';
            else if (c.style === '直球') si = '直接、自信，简洁，不绕弯子。';
            else if (c.style === '话题延伸') si = '提出开放性问题或分享经历，引导深入。';
            else if (c.style === '开启话题') si = '生成全新话题开场白，自然有趣，让对方易接话。';
            else if (c.style === '高情商回复') si = '高情商回应，注重共情、温和、体面，善于化解尴尬。';

            let sp = `你是一位聊天高手。回答要口语化、有语气词、有情绪。
        ${profileText}
        我自己的信息：${myText}
        关系：${relation}　目的：${purpose}
        场景：${c.scenario}　风格：${c.style}
        要求：${si}
        绝对禁止书面语、说教、"首先/其次/最后"。
        每条建议像微信原话，不超过25字，带个人风格。
        对方抱怨先共情，分享先回应情绪。
        建议不要全是问句，适当用陈述句和感叹句。`;
            if (isOpening) sp += `\n当前为"开启话题"风格，直接基于对象信息生成3个有趣开场白。`;
            else sp += `\n示例：对方"今天好累"→"累啥，我昨天加班到凌晨，你起码还能喊累（狗头）"`;
            sp += `\n输出纯JSON，含"analysis"和"suggestions"(3条，每条有text,reason,expectedEffect)。text要口语化。`;

            let messages = [{ role: 'system', content: sp }];
            let userContent = [{ type: 'text', text: gm }];
            if (image) userContent.push({ type: 'image_url', image_url: { url: image } });
            messages.push({ role: 'user', content: userContent });
            const payload = { model: cleanModel, messages: messages, temperature: 1.0, max_tokens: 500 };
            const tryFetch = async (includeFormat) => {
                const p = { ...payload };
                if (includeFormat && !isDeepSeek) p.response_format = { type: 'json_object' };
                if (isDeepSeek) delete p.response_format;
                return fetch(cleanUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cleanKey}` },
                    body: JSON.stringify(p)
                });
            };
            let resp;
            if (isDeepSeek) resp = await tryFetch(false);
            else { resp = await tryFetch(true); if (resp.status === 400 || resp.status === 422) { resp = await tryFetch(
                        false); } }
            if (!resp.ok) { const e = await resp.text(); throw new Error(`API请求失败(${resp.status}):${e}`); }
            const data = await resp.json();
            const content = data.choices[0].message.content;
            try { return JSON.parse(content); } catch (e1) { const m = content.match(/```json\s*([\s\S]*?)\s*```/); if (m) try { return JSON
                        .parse(m[1]); } catch (e2) {} const b = content.match(/\{[\s\S]*\}/); if (b) try { return JSON.parse(b[
                        0]); } catch (e3) {} throw new Error('AI返回格式错误'); }
        }

        // ---------- 发送 ----------
        async function handleSend() {
            if (state.isLoading) return;
            if (!getCurrentObject()) { showToast('请先添加对象', 1500); return; }
            const input = messageInput.value.trim();
            const isOpening = isStyleOpeningTopic();
            if (!input && !state.imageBase64 && !isOpening) { showToast('请输入文字或上传图片', 1000); return; }
            let finalText;
            if (!input && !state.imageBase64 && isOpening) finalText = '请生成几个适合开启新话题的开场白';
            else finalText = input || '描述这张图片';
            if (state.pendingGuyReply) { pushHistory('girl', finalText);
                state.pendingGuyReply = false; } else pushHistory('girl', finalText);
            messageInput.value = '';
            renderHistory();
            state.isLoading = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loader"></span>思考中';
            suggestionsPanel.classList.add('show');
            suggestionsContent.innerHTML = '<div class="suggestions-loader"><span class="loader"></span>AI 正在生成建议...</div>';
            const config = getConfig();
            const o = getCurrentObject();
            const relation = o?.relationship || '未设置';
            try {
                if (!state.useAI || !state.apiKey || state.apiKey.trim().length === 0) throw new Error('AI未启用');
                const h = getCurrentHistory();
                const r = await callAI(finalText, h, config, state.imageBase64, relation, '闲聊', isOpening);
                if (!r.analysis || !r.suggestions || r.suggestions.length < 3) throw new Error('AI返回不完整');
                state.currentSuggestions = { suggestions: r.suggestions, analysis: r.analysis };
                renderSuggestionsPanel();
                saveToStorage();
                showToast('💡 已生成候选回复', 1000);
            } catch (err) {
                showToast('❌ ' + err.message, 4000);
                const o2 = getCurrentObject();
                if (o2 && o2.history.length > 0 && o2.history[o2.history.length - 1].role === 'girl') { o2.history.pop();
                    renderHistory();
                    saveToStorage(); }
                state.currentSuggestions = null;
                renderSuggestionsPanel();
                messageInput.value = input || '';
            } finally {
                state.isLoading = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '🚀 获取';
                if (!state.currentSuggestions || !state.currentSuggestions.suggestions) suggestionsPanel.classList.remove(
                    'show');
            }
        }

        // ---------- 存储 ----------
        function saveToStorage() {
            try {
                const data = {
                    objects: state.objects,
                    currentObjectId: state.currentObjectId,
                    apiKey: state.apiKey,
                    apiUrl: state.apiUrl,
                    model: state.model,
                    useAI: state.useAI,
                    presets: state.presets,
                    currentPreset: state.currentPreset,
                    relations: state.relations,
                    currentSuggestions: state.currentSuggestions,
                    scenarios: state.scenarios,
                    config: state.config,
                    myProfile: state.myProfile
                };
                localStorage.setItem('chat_data', JSON.stringify(data));
            } catch (e) {}
        }
        function loadFromStorage() {
            try {
                const raw = localStorage.getItem('chat_data');
                if (raw) {
                    const data = JSON.parse(raw);
                    state.objects = data.objects || [];
                    state.currentObjectId = data.currentObjectId || null;
                    state.apiKey = data.apiKey || '';
                    state.apiUrl = data.apiUrl || 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
                    state.model = data.model || 'glm-4-flash';
                    state.useAI = data.useAI !== undefined ? data.useAI : true;
                    state.presets = data.presets || [];
                    state.currentPreset = data.currentPreset || '';
                    state.relations = data.relations || ['朋友', '同事', '恋人', '家人', '客户', '其他'];
                    state.currentSuggestions = data.currentSuggestions || null;
                    state.scenarios = data.scenarios || ['日常闲聊', '深入交流', '正式沟通'];
                    state.config = data.config || { scenario: '日常闲聊', style: '话题延伸' };
                    state.myProfile = data.myProfile || { name: '', age: '', hobby: '', note: '' };
                    apiKeyInput.value = state.apiKey;
                    apiUrlInput.value = state.apiUrl;
                    modelInput.value = state.model;
                    useAICheckbox.checked = state.useAI;
                    myName.value = state.myProfile.name || '';
                    myAge.value = state.myProfile.age || '';
                    myHobby.value = state.myProfile.hobby || '';
                    myNote.value = state.myProfile.note || '';
                    if (!state.scenarios.includes(state.config.scenario)) {
                        state.config.scenario = state.scenarios[0] || '日常闲聊';
                    }
                    renderObjectList();
                    loadCurrentObject();
                    updateStatusBadge();
                    renderPresets();
                    renderRelations();
                    renderSuggestionsPanel();
                    renderScenarioTags();
                    renderScenarioChips();
                    updateQuickPurposeText();
                    updatePlaceholder();
                    return;
                }
            } catch (e) {}
            state.objects = [];
            state.currentObjectId = null;
            state.presets = [];
            state.currentPreset = '';
            state.relations = ['朋友', '同事', '恋人', '家人', '客户', '其他'];
            state.currentSuggestions = null;
            state.scenarios = ['日常闲聊', '深入交流', '正式沟通'];
            state.config = { scenario: '日常闲聊', style: '话题延伸' };
            state.myProfile = { name: '', age: '', hobby: '', note: '' };
            renderObjectList();
            loadCurrentObject();
            updateStatusBadge();
            renderPresets();
            renderRelations();
            renderSuggestionsPanel();
            renderScenarioTags();
            renderScenarioChips();
            updateQuickPurposeText();
            saveToStorage();
        }
        function updatePlaceholder() { messageInput.placeholder = isStyleOpeningTopic() ? '输入话题方向（可选）或留空自动生成' :
                '输入对方原话...'; }

        // 我的资料保存
        function saveMyProfile() {
            state.myProfile.name = myName.value.trim();
            state.myProfile.age = parseInt(myAge.value) || '';
            state.myProfile.hobby = myHobby.value.trim();
            state.myProfile.note = myNote.value.trim();
            saveToStorage();
            showToast('我的资料已保存', 1500);
        }

        // ---------- 事件绑定 ----------
        settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('show'));
        profileTag.addEventListener('click', () => settingsPanel.classList.toggle('show'));
        addObjectBtn.addEventListener('click', () => { addObject(newObjectName.value.trim());
            newObjectName.value = ''; });
        newObjectName.addEventListener('keydown', e => { if (e.key === 'Enter') { addObject(newObjectName.value.trim());
                newObjectName.value = ''; } });
        saveObjectBtn.addEventListener('click', saveObjectDetails);
        saveSettingsBtn.addEventListener('click', () => { saveCurrentAsPreset(newPresetName.value.trim() || '默认配置'); });
        addPresetBtn.addEventListener('click', () => { const n = newPresetName.value.trim(); if (!n) { showToast('请输入名称',
                1000); return; }
            saveCurrentAsPreset(n);
            newPresetName.value = ''; });
        clearHistoryBtn.addEventListener('click', () => { if (confirm('清除所有聊天记录？')) { const o = getCurrentObject(); if (
                    o) { o.history = [];
                    state.pendingGuyReply = false;
                    state.currentSuggestions = null;
                    renderHistory();
                    renderSuggestionsPanel();
                    saveToStorage();
                    showToast('已清除', 1000); } } });
        sendBtn.addEventListener('click', handleSend);
        messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                handleSend(); } });
        imageBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => { if (e.target.files.length > 0) handleImageSelect(e.target.files[0]); });
        removeImgBtn.addEventListener('click', clearImage);
        closeSuggestionsBtn.addEventListener('click', closeSuggestionsPanel);
        addRelationBtn.addEventListener('click', () => { addRelation(newRelationInput.value);
            newRelationInput.value = ''; });
        newRelationInput.addEventListener('keydown', e => { if (e.key === 'Enter') { addRelation(newRelationInput.value);
                newRelationInput.value = ''; } });

        addScenarioBtn.addEventListener('click', () => { addScenario(newScenarioInput.value);
            newScenarioInput.value = ''; });
        newScenarioInput.addEventListener('keydown', e => { if (e.key === 'Enter') { addScenario(newScenarioInput.value);
                newScenarioInput.value = ''; } });

        saveMyProfileBtn.addEventListener('click', saveMyProfile);

        document.querySelectorAll('#styleGroup .chip').forEach(chip => {
            chip.addEventListener('click', function(e) {
                document.querySelectorAll('#styleGroup .chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                updatePlaceholder();
                const obj = getCurrentObject();
                if (!obj) { showToast('请先选择对象', 1000); return; }
                const history = obj.history || [];
                if (!history.some(m => m.role === 'girl') && !isStyleOpeningTopic()) { showToast('暂无对方消息',
                    1200); return; }
                regenerateSuggestions();
            });
        });

        window.copySuggestionFromPanel = copySuggestionFromPanel;
        loadFromStorage();
        showToast('💡 已修复设置按钮被遮挡问题', 2000);
    </script>
</body>
</html>
