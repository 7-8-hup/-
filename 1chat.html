<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💬 智能聊天助手</title>
<style>
/* 所有样式不变，直接复制之前版本即可，此处省略，实际使用请从之前版本复制完整样式 */
</style>
</head>
<body>
<!-- 所有 HTML 不变，直接复制之前版本即可，此处省略，实际使用请从之前版本复制完整 HTML -->
<script>
// ========== 核心状态 ==========
const state={objects:[],currentObjectId:null,config:{scenario:'日常闲聊',style:'话题延伸'},isLoading:!1,pendingGuyReply:!1,apiKey:'',apiUrl:'https://open.bigmodel.cn/api/paas/v4/chat/completions',model:'glm-4-flash',useAI:!0,imageBase64:null,presets:[],currentPreset:'',relations:['朋友','同事','恋人','家人','客户','其他']};

// ... 所有辅助函数不变，直接复制之前版本 ...

// ========== 关键修改：通用 API 调用（支持自动降级） ==========
function toAscii(str){return str.replace(/[^\x00-\x7F]/g,'')}

async function callAI(gm,h,c,image,relation,purpose,isOpening=false){
  const cleanKey=toAscii(state.apiKey).trim();
  if(!cleanKey)throw new Error('API Key 无效');
  const cleanUrl=toAscii(state.apiUrl).trim();
  if(!cleanUrl||!cleanUrl.startsWith('http'))throw new Error('API 地址无效');
  const cleanModel=toAscii(state.model).trim()||'glm-4-flash';

  const o=getCurrentObject();
  const profileText=o?`对方信息：${o.name||'未命名'}${o.age?'，'+o.age+'岁':''}${o.hobby?'，喜欢/从事 '+o.hobby:''}${o.note?'，'+o.note:''}`:'';

  let sp = `你是一个嘴巴很贱但很真诚的聊天高手。你的回答要像真人说话一样——有语气词（"啊/吧/啦/呗"）、有断句、有情绪。
当前聊天对象信息：${profileText}
与我的关系：${relation}
沟通目的：${purpose}
场景：${c.scenario}
风格：${c.style}

绝对禁止：书面语、说教、分析体、"首先/其次/最后/综上所述"。
每条建议必须像微信聊天里的原话，不超过25个字，带点个人风格（自嘲/反问/夸张）。
如果对方在抱怨，先共情再给建议；如果对方在分享，先回应情绪再延伸话题。
建议不要全是问句，适当用陈述句和感叹句。`;

  if(isOpening){
    sp += `\n注意：当前是"开启话题"风格，请忽略上方用户输入（如果有），直接基于对象信息生成3个自然、有趣的开场白或话题建议，让对方容易接话。`;
  } else {
    sp += `\n示例：
对方："今天好累啊"
→ 回答1："累啥，我昨天加班到凌晨，你起码还能喊累（狗头）"
→ 回答2："那别聊了，快去躺平，明天再战！"
→ 回答3："具体累啥？工作还是心累？说出来我帮你骂两句"`;
  }

  sp += `\n输出纯JSON，包含"analysis"(简短潜台词)和"suggestions"(3条建议，每条有text, reason, expectedEffect)。
text必须是口语化的原话，reason简短说明为什么这么回，expectedEffect写对方可能的反应。`;

  let messages=[{role:'system',content:sp}];
  let userContent=[{type:'text',text:gm}];
  if(image)userContent.push({type:'image_url',image_url:{url:image}});
  messages.push({role:'user',content:userContent});

  // ========== 核心修复：自动检测 API 是否支持 response_format ==========
  const tryFetch = async (includeFormat) => {
    const payload = {
      model: cleanModel,
      messages: messages,
      temperature: 1.0,
      max_tokens: 500
    };
    if (includeFormat) {
      payload.response_format = { type: 'json_object' };
    }
    const resp = await fetch(cleanUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${cleanKey}`
      },
      body: JSON.stringify(payload)
    });
    return resp;
  };

  let resp = await tryFetch(true);
  // 如果返回 400 或 422，可能是 response_format 不被支持，去掉重试
  if (resp.status === 400 || resp.status === 422) {
    console.warn('API 不支持 response_format，自动降级重试...');
    resp = await tryFetch(false);
  }

  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`API 请求失败 (${resp.status}): ${err}`);
  }

  const data = await resp.json();
  const content = data.choices[0].message.content;
  try {
    return JSON.parse(content);
  } catch (e1) {
    const m = content.match(/```json\s*([\s\S]*?)\s*```/);
    if (m) {
      try { return JSON.parse(m[1]); } catch (e2) {}
    }
    const b = content.match(/\{[\s\S]*\}/);
    if (b) {
      try { return JSON.parse(b[0]); } catch (e3) {}
    }
    throw new Error('AI 返回格式错误');
  }
}

// ... 其余函数不变，直接复制之前版本 ...

// ========== 事件绑定等不变 ==========
</script>
</body>
</html>
