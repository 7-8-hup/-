<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>聊天助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#fff;
  --surface:#f5f5f7;
  --text:#1a1a1a;
  --text-2:#666;
  --text-3:#999;
  --primary:#7c5cff;
  --border:#ebebf0;
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#app{
  max-width:520px;margin:0 auto;height:100vh;height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;position:relative;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;
}
header h1{font-size:16px;font-weight:600;letter-spacing:-0.2px;}
.icon-btn{
  width:36px;height:36px;border:none;background:transparent;border-radius:50%;
  font-size:18px;cursor:pointer;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface);}
.icon-btn:active{background:#e8e8ed;}
main{
  flex:1;overflow-y:auto;padding:16px 18px;
  display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.empty{
  margin:auto;color:var(--text-3);text-align:center;
  font-size:14px;line-height:1.8;
}
.bubble{
  max-width:80%;padding:9px 14px;border-radius:18px;
  font-size:15px;line-height:1.45;word-break:break-word;
  animation:pop .2s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.bubble.ta{align-self:flex-start;background:var(--surface);color:var(--text);border-bottom-left-radius:6px;}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:6px;}
.suggestions{
  flex-shrink:0;padding:0 18px 12px;
  display:none;flex-direction:column;gap:8px;
}
.suggestions.show{display:flex;}
.s-title{
  font-size:12px;color:var(--text-3);font-weight:500;padding:4px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.s-title .spinner{
  width:12px;height:12px;border:2px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.s-card{
  background:var(--surface);border-radius:12px;padding:10px 14px;
  font-size:15px;line-height:1.45;cursor:pointer;
  transition:background .15s,transform .1s;
  display:flex;align-items:flex-start;gap:10px;
}
.s-card:hover{background:#efeff4;}
.s-card:active{background:#e8e8ee;transform:scale(0.995);}
.s-card.copied{background:#ecfdf5;}
.s-card .s-text{flex:1;min-width:0;}
.s-card .s-badge{
  font-size:11px;color:var(--text-3);background:var(--bg);
  padding:2px 8px;border-radius:8px;flex-shrink:0;font-weight:500;
}
.s-card.copied .s-badge{color:#059669;background:#d1fae5;}
.composer{
  flex-shrink:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);display:flex;align-items:center;
  gap:8px;background:var(--bg);
}
.composer input{
  flex:1;min-width:0;height:40px;padding:0 14px;border:none;
  background:var(--surface);border-radius:20px;font-size:15px;
  outline:none;color:var(--text);font-family:inherit;
  transition:background .15s;
}
.composer input:focus{background:#efeff4;}
.composer input::placeholder{color:var(--text-3);}
.send-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:var(--primary);color:#fff;font-size:18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s,opacity .15s;flex-shrink:0;
}
.send-btn:hover{background:#6a4ae6;}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}
.send-btn:active:not(:disabled){transform:scale(0.95);}
.img-preview{
  padding:0 16px 8px;display:none;align-items:center;gap:8px;flex-shrink:0;
}
.img-preview.show{display:flex;}
.img-preview img{width:56px;height:56px;object-fit:cover;border-radius:10px;}
.img-preview button{
  border:none;background:transparent;color:var(--text-3);
  font-size:16px;cursor:pointer;padding:4px;
}
.settings-panel{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  transform:translateX(100%);transition:transform .25s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.settings-panel.show{transform:translateX(0);}
.sp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;
  max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;
}
.sp-header h2{font-size:16px;font-weight:600;}
.sp-body{
  flex:1;overflow-y:auto;padding:24px 18px;
  -webkit-overflow-scrolling:touch;
  max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;
}
.field{margin-bottom:22px;}
.field label{
  display:block;font-size:13px;font-weight:500;
  color:var(--text-2);margin-bottom:8px;
}
.field input{
  width:100%;height:44px;padding:0 14px;border:1px solid var(--border);
  background:var(--bg);border-radius:12px;font-size:15px;
  outline:none;color:var(--text);font-family:inherit;
  transition:border-color .15s;
}
.field input:focus{border-color:var(--primary);}
.field .row{display:flex;gap:8px;}
.field .row input{flex:1;min-width:0;}
.detect-btn{
  height:44px;padding:0 18px;border:none;background:var(--primary);
  color:#fff;font-size:14px;font-weight:500;border-radius:12px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;
  transition:background .15s,opacity .15s;
}
.detect-btn:hover{background:#6a4ae6;}
.detect-btn:disabled{opacity:.5;cursor:not-allowed;}
.status-text{
  font-size:12px;color:var(--text-3);
  margin-top:8px;min-height:16px;line-height:1.4;
}
.status-text.ok{color:#059669;}
.status-text.err{color:#dc2626;}
.status-text.info{color:var(--primary);}
.hint{
  font-size:12px;color:var(--text-3);line-height:1.6;margin-top:10px;
}
.clear-btn{
  width:100%;height:44px;border:1px solid var(--border);
  background:transparent;color:#dc2626;font-size:15px;
  border-radius:12px;cursor:pointer;font-family:inherit;
  transition:background .15s;
}
.clear-btn:hover{background:#fef2f2;}
.toast{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(8px);
  background:rgba(30,30,35,0.95);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:999;max-width:80%;text-align:center;font-weight:500;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.img-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.img-modal img{max-width:92vw;max-height:90vh;border-radius:12px;object-fit:contain;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>聊天助手</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️</button>
  </header>

  <main id="messages">
    <div class="empty">输入对方的话<br>获取 3 条回复建议</div>
  </main>

  <section class="suggestions" id="suggestions">
    <div class="s-title">
      <span id="sTitleText">回复建议</span>
      <span id="sTitleSpinner" style="display:none" class="spinner"></span>
    </div>
    <div id="sList"></div>
  </section>

  <div class="img-preview" id="imgPreview">
    <img id="previewImg" alt="">
    <button id="removeImg" aria-label="移除">✕</button>
  </div>

  <div class="composer">
    <button class="icon-btn" id="imageBtn" aria-label="图片">📷</button>
    <input type="text" id="input" placeholder="对方说了什么..." autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="发送">↑</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<div class="settings-panel" id="settings">
  <div class="sp-header">
    <h2>设置</h2>
    <button class="icon-btn" id="closeSettings" aria-label="关闭">✕</button>
  </div>
  <div class="sp-body">
    <div class="field">
      <label>API Key</label>
      <div class="row">
        <input type="password" id="apiKey" placeholder="粘贴任意 AI 的 Key" autocomplete="off">
        <button class="detect-btn" id="detectBtn">识别</button>
      </div>
      <div class="status-text" id="detectStatus"></div>
      <div class="hint">支持 DeepSeek / 通义 / 智谱 / Kimi / 豆包 / OpenAI / Claude / Gemini。<br>粘贴后点识别即可自动配置。</div>
    </div>

    <div class="field">
      <label>我的昵称（可选）</label>
      <input type="text" id="myName" placeholder="让 AI 更懂你" autocomplete="off">
    </div>

    <div class="field">
      <label>对方昵称（可选）</label>
      <input type="text" id="taName" placeholder="让 AI 更懂你们的关系" autocomplete="off">
    </div>

    <div class="field">
      <button class="clear-btn" id="clearBtn">清空对话记录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

const PROVIDERS = {
  openai:    { name:'OpenAI',  icon:'🟢', url:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini', visionModel:'gpt-4o', format:'openai' },
  deepseek:  { name:'DeepSeek',icon:'🐋', url:'https://api.deepseek.com/chat/completions', model:'deepseek-chat', visionModel:null, format:'openai' },
  qwen:      { name:'通义千问',icon:'☁️', url:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model:'qwen-plus', visionModel:'qwen-vl-max', format:'openai' },
  zhipu:     { name:'智谱',    icon:'🧠', url:'https://open.bigmodel.cn/api/paas/v4/chat/completions', model:'glm-4-flash', visionModel:'glm-4v', format:'openai' },
  kimi:      { name:'Kimi',    icon:'🌙', url:'https://api.moonshot.cn/v1/chat/completions', model:'moonshot-v1-8k', visionModel:'moonshot-v1-8k-vision-preview', format:'openai' },
  doubao:    { name:'豆包',    icon:'🎵', url:'https://ark.cn-beijing.volces.com/api/v3/chat/completions', model:'doubao-pro-32k', visionModel:'doubao-vision-pro-32k', format:'openai' },
  anthropic: { name:'Claude',  icon:'🅰️', url:'https://api.anthropic.com/v1/messages', model:'claude-3-5-sonnet-20241022', visionModel:'claude-3-5-sonnet-20241022', format:'anthropic' },
  google:    { name:'Gemini',  icon:'🔷', url:'https://generativelanguage.googleapis.com/v1beta/models', model:'gemini-2.0-flash', visionModel:'gemini-2.0-flash', format:'google' }
};
const PROBE_CANDIDATES = ['deepseek','kimi','zhipu','openai','doubao','qwen'];

const state = {
  messages: [], suggestions: [],
  apiKey:'', apiUrl:'', model:'', provider:'',
  myName:'', taName:'',
  imageBase64:null, loading:false
};

const $ = id => document.getElementById(id);
const dom = {
  messages:$('messages'),
  suggestions:$('suggestions'), sList:$('sList'),
  sTitleText:$('sTitleText'), sTitleSpinner:$('sTitleSpinner'),
  imgPreview:$('imgPreview'), previewImg:$('previewImg'), removeImg:$('removeImg'),
  imageBtn:$('imageBtn'), fileInput:$('fileInput'),
  input:$('input'), sendBtn:$('sendBtn'),
  settingsBtn:$('settingsBtn'), settings:$('settings'),
  closeSettings:$('closeSettings'), clearBtn:$('clearBtn'),
  apiKey:$('apiKey'), detectBtn:$('detectBtn'), detectStatus:$('detectStatus'),
  myName:$('myName'), taName:$('taName'),
  toast:$('toast')
};

let toastTimer = null;
function toast(msg, dur=1800, type=''){
  clearTimeout(toastTimer);
  dom.toast.textContent = msg;
  dom.toast.style.background = type==='error' ? 'rgba(220,38,38,0.95)'
    : type==='success' ? 'rgba(5,150,105,0.95)'
    : 'rgba(30,30,35,0.95)';
  dom.toast.classList.add('show');
  toastTimer = setTimeout(()=>dom.toast.classList.remove('show'), dur);
}

function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function toAscii(s){ return String(s||'').replace(/[^\x00-\x7F]/g,''); }

// ============ 存储 ============
const KEY = 'chat_simple_v1';
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      messages: state.messages,
      apiKey: state.apiKey, apiUrl: state.apiUrl,
      model: state.model, provider: state.provider,
      myName: state.myName, taName: state.taName
    }));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    Object.assign(state, {
      messages: d.messages || [],
      apiKey: d.apiKey || '', apiUrl: d.apiUrl || '',
      model: d.model || '', provider: d.provider || '',
      myName: d.myName || '', taName: d.taName || ''
    });
  }catch(e){}
}

// ============ 渲染 ============
function renderMessages(){
  if(state.messages.length === 0){
    dom.messages.innerHTML = '<div class="empty">输入对方的话<br>获取 3 条回复建议</div>';
    return;
  }
  let html = '';
  state.messages.forEach(m=>{
    const cls = m.role === 'ta' ? 'ta' : 'me';
    html += '<div class="bubble '+cls+'">' + esc(m.text) + '</div>';
  });
  dom.messages.innerHTML = html;
  dom.messages.scrollTop = dom.messages.scrollHeight;
}

function renderSuggestions(){
  if(state.loading){
    dom.suggestions.classList.add('show');
    dom.sList.innerHTML = '';
    dom.sTitleText.textContent = '生成中...';
    dom.sTitleSpinner.style.display = 'inline-block';
    return;
  }
  dom.sTitleSpinner.style.display = 'none';
  if(!state.suggestions || state.suggestions.length === 0){
    dom.suggestions.classList.remove('show');
    dom.sList.innerHTML = '';
    return;
  }
  dom.suggestions.classList.add('show');
  dom.sTitleText.textContent = '点击复制发送';
  let html = '';
  state.suggestions.forEach((s, i)=>{
    html += '<div class="s-card" data-idx="'+i+'">'
      + '<div class="s-text">' + esc(s.text) + '</div>'
      + (s.style ? '<div class="s-badge">' + esc(s.style) + '</div>' : '')
      + '</div>';
  });
  dom.sList.innerHTML = html;
  dom.sList.querySelectorAll('.s-card').forEach(card=>{
    card.addEventListener('click', ()=>copySuggestion(parseInt(card.dataset.idx), card));
  });
}

function copySuggestion(idx, card){
  const s = state.suggestions[idx];
  if(!s) return;
  const text = s.text;
  const done = ()=>{
    card.classList.add('copied');
    state.messages.push({role:'me', text});
    state.suggestions = [];
    save();
    setTimeout(()=>{
      renderMessages();
      renderSuggestions();
      toast('✅ 已复制', 1200, 'success');
    }, 200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }
  catch(e){ toast('复制失败', 1500, 'error'); }
  document.body.removeChild(ta);
}

// ============ 发送 ============
async function handleSend(){
  if(state.loading) return;
  const text = dom.input.value.trim();
  if(!text && !state.imageBase64){ toast('请输入内容', 1200); return; }
  if(!state.apiKey || !state.apiUrl || !state.model){
    toast('请先配置 API Key', 1800, 'error');
    openSettings();
    return;
  }
  const finalText = text || '请描述这张图片';
  state.messages.push({role:'ta', text: finalText});
  dom.input.value = '';
  save();
  renderMessages();

  state.loading = true;
  renderSuggestions();
  dom.sendBtn.disabled = true;

  try{
    const result = await callAI();
    state.suggestions = result.suggestions || [];
    state.loading = false;
    save();
    renderSuggestions();
    if(state.imageBase64) clearImage();
  }catch(err){
    state.loading = false;
    // 回滚最后一条
    if(state.messages.length > 0 && state.messages[state.messages.length-1].role === 'ta'){
      state.messages.pop();
      save();
      renderMessages();
    }
    renderSuggestions();
    toast('❌ ' + err.message, 3000, 'error');
  }finally{
    dom.sendBtn.disabled = false;
  }
}

// ============ 图片 ============
function compressImage(dataUrl, maxBytes = 500*1024){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const maxDim = 1600;
      if(w > maxDim || h > maxDim){
        const r = Math.min(maxDim/w, maxDim/h);
        w = Math.round(w*r); h = Math.round(h*r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const tryC = q => {
        const result = c.toDataURL('image/jpeg', q);
        if(result.length < maxBytes || q < 0.1) resolve(result);
        else tryC(q - 0.05);
      };
      tryC(0.9);
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}
function handleImageSelect(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('请选择图片', 1200, 'error'); return; }
  if(file.size > 20*1024*1024){ toast('图片过大（>20MB）', 1500, 'error'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const compressed = await compressImage(e.target.result);
      state.imageBase64 = compressed;
      dom.previewImg.src = compressed;
      dom.imgPreview.classList.add('show');
      toast('图片已加载', 1000, 'success');
    }catch(err){ toast('图片处理失败', 1500, 'error'); }
  };
  reader.readAsDataURL(file);
}
function clearImage(){
  state.imageBase64 = null;
  dom.previewImg.src = '';
  dom.imgPreview.classList.remove('show');
  dom.fileInput.value = '';
}
function showImageModal(src){
  const m = document.createElement('div');
  m.className = 'img-modal';
  m.innerHTML = '<img src="'+src+'">';
  m.addEventListener('click', ()=>m.remove());
  document.body.appendChild(m);
}

// ============ API Key 识别 ============
function detectByPrefix(key){
  const k = (key||'').trim();
  if(!k) return null;
  if(k.startsWith('sk-ant-')) return {provider:'anthropic', high:true};
  if(k.startsWith('AIza') || k.startsWith('AQ.')) return {provider:'google', high:true};
  if(k.startsWith('sk-ws-') || k.startsWith('sk-sp-')) return {provider:'qwen', high:true};
  if(k.startsWith('sk-kimi-')) return {provider:'kimi', high:true};
  if(k.startsWith('sk-proj-') || k.startsWith('sk-svcacct-')) return {provider:'openai', high:true};
  if(k.startsWith('sk-')) return {high:false};
  return {high:false};
}

async function probeOne(pid, key){
  const p = PROVIDERS[pid];
  if(!p) return null;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 9000);
  try{
    const resp = await fetch(p.url, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({ model:p.model, messages:[{role:'user',content:'hi'}], max_tokens:1 }),
      signal: ctrl.signal
    });
    if(resp.ok) return 'valid';
    if(resp.status === 401 || resp.status === 403) return 'format-match';
    return null;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}

async function probeAll(key){
  const results = await Promise.all(
    PROBE_CANDIDATES.map(async id => ({id, r: await probeOne(id, key)}))
  );
  const valid = results.find(x=>x.r === 'valid');
  if(valid) return {provider:valid.id, valid:true};
  const fmt = results.find(x=>x.r === 'format-match');
  if(fmt) return {provider:fmt.id, valid:false};
  return null;
}

async function autoDetect(key){
  const k = (key||'').trim();
  if(!k) return null;
  const p = detectByPrefix(k);
  if(p && p.high && p.provider) return {providerId:p.provider, key:k, valid:true};
  const probed = await probeAll(k);
  if(probed) return {providerId:probed.provider, key:k, valid:probed.valid};
  return null;
}

function setStatus(msg, cls){
  dom.detectStatus.textContent = msg || '';
  dom.detectStatus.className = 'status-text' + (cls ? ' '+cls : '');
}

// ============ 请求构造 ============
function buildRequest({provider, apiUrl, model, messages, imageData, apiKey, temperature, maxTokens}){
  const p = PROVIDERS[provider];
  const format = p ? p.format : 'openai';

  if(format === 'anthropic'){
    const sys = messages.find(m=>m.role==='system');
    const others = messages.filter(m=>m.role!=='system');
    const anthMsgs = others.map(m=>{
      let blocks;
      if(typeof m.content === 'string'){
        blocks = [{type:'text', text:m.content}];
      } else {
        blocks = m.content.map(c=>{
          if(c.type === 'text') return {type:'text', text:c.text};
          if(c.type === 'image_url'){
            const dataUrl = c.image_url.url || '';
            const [meta, b64] = dataUrl.split(',');
            const mm = meta && meta.match(/data:(.*?);/);
            return {type:'image', source:{type:'base64', media_type: mm?mm[1]:'image/jpeg', data:b64||''}};
          }
          return {type:'text', text:''};
        });
      }
      return {role: m.role==='assistant'?'assistant':'user', content:blocks};
    });
    return {
      url: apiUrl,
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:{
        model, max_tokens:maxTokens, temperature,
        system: sys ? sys.content : '',
        messages: anthMsgs
      },
      parse: d => (d && d.content && d.content[0] && d.content[0].text) || ''
    };
  }

  if(format === 'google'){
    const sys = messages.find(m=>m.role==='system');
    const others = messages.filter(m=>m.role!=='system');
    const contents = others.map(m=>{
      const parts = [];
      if(typeof m.content === 'string') parts.push({text: m.content});
      else m.content.forEach(c=>{
        if(c.type === 'text') parts.push({text:c.text});
        else if(c.type === 'image_url'){
          const dataUrl = c.image_url.url || '';
          const [meta, b64] = dataUrl.split(',');
          const mm = meta && meta.match(/data:(.*?);/);
          parts.push({inline_data:{mime_type: mm?mm[1]:'image/jpeg', data:b64||''}});
        }
      });
      return {role: m.role==='assistant'?'model':'user', parts};
    });
    const url = apiUrl.replace(/\/$/, '') + '/' + model + ':generateContent?key=' + encodeURIComponent(apiKey);
    return {
      url,
      headers:{'Content-Type':'application/json'},
      body:{
        system_instruction: sys ? {parts:[{text:sys.content}]} : undefined,
        contents,
        generationConfig:{temperature, maxOutputTokens:maxTokens}
      },
      parse: d => {
        try{ return d.candidates[0].content.parts.map(x=>x.text||'').join(''); }
        catch(e){ return ''; }
      }
    };
  }

  // OpenAI 兼容
  return {
    url: apiUrl,
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + apiKey
    },
    body:{model, messages, temperature, max_tokens:maxTokens},
    parse: d => {
      try{ return d.choices[0].message.content || ''; }
      catch(e){ return ''; }
    }
  };
}

// ============ AI 调用 ============
async function callAI(){
  const key = toAscii(state.apiKey).trim();
  const url = toAscii(state.apiUrl).trim();
  if(!key) throw new Error('API Key 无效');
  if(!url || !url.startsWith('http')) throw new Error('API 地址无效');

  const pid = state.provider;
  const pConf = PROVIDERS[pid];
  let model = toAscii(state.model).trim() || (pConf ? pConf.model : 'deepseek-chat');

  let imageData = null;
  if(state.imageBase64){
    imageData = state.imageBase64.startsWith('data:image')
      ? state.imageBase64
      : 'data:image/jpeg;base64,' + state.imageBase64;
    if(pConf && pConf.visionModel) model = pConf.visionModel;
    else if(pConf && !pConf.visionModel) throw new Error((pConf.name||'该服务商') + ' 不支持图片');
  }

  const my = state.myName ? '我（'+state.myName+'）' : '我';
  const ta = state.taName ? '对方（'+state.taName+'）' : '对方';

  const systemPrompt = `你是聊天高手。${ta}会发来消息，你需要生成 3 条不同的回复建议，覆盖不同风格：
- 第1条：幽默轻松，可调侃自嘲，让人会心一笑
- 第2条：走心共情，温柔体贴，关注情绪
- 第3条：直接坦诚，简明有力，不绕弯

每条建议口语化，像微信原话，不超过 40 字。禁止书面语、说教。使用简体中文。
输出纯 JSON：{"suggestions":[{"text":"...","style":"幽默"},{"text":"...","style":"走心"},{"text":"...","style":"直球"}]}`;

  const messages = [{role:'system', content: systemPrompt}];
  state.messages.slice(-10).forEach((m, i, arr)=>{
    const isLast = i === arr.length - 1;
    const role = m.role === 'ta' ? 'user' : 'assistant';
    if(isLast && m.role === 'ta' && imageData){
      messages.push({
        role:'user',
        content:[
          {type:'text', text: m.text || '请描述图片'},
          {type:'image_url', image_url:{url:imageData}}
        ]
      });
    } else {
      messages.push({role, content: m.text});
    }
  });

  const req = buildRequest({
    provider: pid, apiUrl: url, model, messages, imageData,
    apiKey: key, temperature: 1.0, maxTokens: 800
  });

  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 60000);
  let resp;
  try{
    resp = await fetch(req.url, {
      method:'POST',
      headers: req.headers,
      body: JSON.stringify(req.body),
      signal: ctrl.signal
    });
  }catch(e){
    if(e.name === 'AbortError') throw new Error('请求超时');
    throw new Error('网络错误：' + e.message);
  } finally { clearTimeout(timer); }

  if(!resp.ok){
    let t = await resp.text();
    try{ const j = JSON.parse(t); t = (j.error && j.error.message) || j.message || t; }catch(e){}
    if(resp.status === 400) throw new Error('请求错误：' + t.substring(0, 120));
    if(resp.status === 401) throw new Error('API Key 无效');
    if(resp.status === 403) throw new Error('访问被拒绝（可能额度不足或地区限制）');
    if(resp.status === 429) throw new Error('请求过于频繁，稍后再试');
    throw new Error('API错误(' + resp.status + ')：' + t.substring(0, 100));
  }

  const data = await resp.json();
  const content = req.parse(data) || '';
  let parsed;
  try{ parsed = JSON.parse(content); }
  catch(e1){
    const m = content.match(/```json\s*([\s\S]*?)\s*```/);
    if(m) try{ parsed = JSON.parse(m[1]); }catch(e2){}
    if(!parsed){
      const b = content.match(/\{[\s\S]*\}/);
      if(b) try{ parsed = JSON.parse(b[0]); }catch(e3){}
    }
    if(!parsed) throw new Error('AI 返回格式错误');
  }
  if(!parsed.suggestions || parsed.suggestions.length === 0) throw new Error('AI 未生成建议');
  return parsed;
}

// ============ 设置面板 ============
function openSettings(){
  dom.settings.classList.add('show');
  dom.apiKey.value = state.apiKey;
  dom.myName.value = state.myName;
  dom.taName.value = state.taName;
  if(state.provider && PROVIDERS[state.provider]){
    setStatus(PROVIDERS[state.provider].icon + ' 当前：' + PROVIDERS[state.provider].name, 'ok');
  } else {
    setStatus('');
  }
}
function closeSettings(){
  state.apiKey = dom.apiKey.value.trim();
  state.myName = dom.myName.value.trim();
  state.taName = dom.taName.value.trim();
  save();
  dom.settings.classList.remove('show');
}

// ============ 事件 ============
function bindEvents(){
  dom.settingsBtn.addEventListener('click', openSettings);
  dom.closeSettings.addEventListener('click', closeSettings);
  dom.sendBtn.addEventListener('click', handleSend);
  dom.input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); handleSend(); }
  });
  dom.imageBtn.addEventListener('click', ()=>dom.fileInput.click());
  dom.fileInput.addEventListener('change', e=>{
    if(e.target.files.length) handleImageSelect(e.target.files[0]);
  });
  dom.removeImg.addEventListener('click', clearImage);
  dom.previewImg.addEventListener('click', ()=>{
    if(dom.previewImg.src && dom.previewImg.src.startsWith('data:image')){
      showImageModal(dom.previewImg.src);
    }
  });
  dom.clearBtn.addEventListener('click', ()=>{
    if(confirm('清空所有对话记录？')){
      state.messages = [];
      state.suggestions = [];
      save();
      renderMessages();
      renderSuggestions();
      toast('已清空', 1200, 'success');
    }
  });

  dom.detectBtn.addEventListener('click', async ()=>{
    const key = dom.apiKey.value.trim();
    if(!key){ setStatus('请先粘贴 API Key', 'err'); return; }
    dom.detectBtn.disabled = true;
    dom.detectBtn.textContent = '识别中';
    setStatus('正在识别...', 'info');
    try{
      const r = await autoDetect(key);
      if(r && r.providerId && PROVIDERS[r.providerId]){
        const p = PROVIDERS[r.providerId];
        state.apiKey = r.key;
        state.provider = r.providerId;
        state.apiUrl = p.url;
        state.model = p.model;
        save();
        const warn = r.valid === false ? '（Key 格式匹配但可能无效）' : '';
        setStatus(p.icon + ' 已识别：' + p.name + warn, r.valid === false ? 'info' : 'ok');
        toast('✅ ' + p.name, 1200, 'success');
      } else {
        setStatus('⚠️ 无法识别，请检查 Key 是否正确', 'err');
        toast('识别失败', 1500, 'error');
      }
    }catch(e){
      setStatus('识别出错：' + e.message, 'err');
    } finally {
      dom.detectBtn.disabled = false;
      dom.detectBtn.textContent = '识别';
    }
  });
}

// ============ 初始化 ============
function init(){
  load();
  renderMessages();
  renderSuggestions();
  bindEvents();
  if(!state.apiKey){
    setTimeout(()=>{ if(!state.apiKey) openSettings(); }, 500);
  }
}
init();
})();
</script>
