<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 聊天军师</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px 10px;
        }
        #app {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 20px 16px 24px;
            position: relative;
            height: 95vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .header span {
            font-size: 14px;
            color: #888;
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-top: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .config-group {
            flex: 1;
            min-width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .config-group label {
            font-size: 11px;
            font-weight: 600;
            color: #999;
            letter-spacing: 0.5px;
        }
        .chip-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .chip {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #f0f0f0;
            color: #666;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 500;
            white-space: nowrap;
        }
        .chip.active {
            background: #1a73e8;
            color: #fff;
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.25);
        }
        .chip:active { transform: scale(0.95); }

        .history-area {
            flex: 1;
            background: #f8f9fa;
            border-radius: 16px;
            margin: 14px 0 12px;
            padding: 12px 10px;
            overflow-y: auto;
            min-height: 120px;
            max-height: 45vh;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid #eee;
        }
        .history-empty {
            color: #bbb;
            font-size: 13px;
            text-align: center;
            margin: auto;
        }
        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .msg-girl {
            align-self: flex-start;
            background: #e3f0ff;
            color: #0b2b4a;
            border-bottom-left-radius: 4px;
        }
        .msg-guy {
            align-self: flex-end;
            background: #d4f0d4;
            color: #0d3d0d;
            border-bottom-right-radius: 4px;
        }
        .msg-label {
            font-size: 10px;
            opacity: 0.6;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .suggestions-area {
            flex-shrink: 0;
            background: #fffbeb;
            border-radius: 16px;
            padding: 14px 12px;
            margin: 6px 0 10px;
            border-left: 4px solid #f9ab00;
            max-height: 50vh;
            overflow-y: auto;
            display: none;
        }
        .suggestions-area.show {
            display: block;
        }
        .analysis-text {
            font-size: 13px;
            font-weight: 500;
            color: #5d4e00;
            background: rgba(249, 171, 0, 0.12);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: inline-block;
        }
        .suggestion-card {
            background: white;
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #f0e8d0;
            cursor: pointer;
            transition: all 0.15s;
        }
        .suggestion-card:active {
            transform: scale(0.97);
            background: #fafafa;
        }
        .suggestion-text {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .suggestion-meta {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .suggestion-meta span {
            background: #f5f5f5;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .badge-copy {
            font-size: 11px;
            color: #1a73e8;
            font-weight: 600;
            float: right;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-area input {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1.5px solid #ddd;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            background: #fafafa;
        }
        .input-area input:focus {
            border-color: #1a73e8;
            background: #fff;
        }
        .input-area .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary {
            background: #1a73e8;
            color: white;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            color: #666;
            border: 1.5px solid #ddd;
        }
        .btn-outline:active { background: #f0f0f0; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #222;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #eee;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <h1>💬 聊天军师</h1>
        <span>本地模拟版</span>
    </div>

    <div class="config-row">
        <div class="config-group">
            <label>🎯 场景</label>
            <div class="chip-group" id="scenarioGroup">
                <button class="chip" data-value="破冰">破冰</button>
                <button class="chip active" data-value="暧昧">暧昧</button>
                <button class="chip" data-value="挽回">挽回</button>
            </div>
        </div>
        <div class="config-group">
            <label>🎭 风格</label>
            <div class="chip-group" id="styleGroup">
                <button class="chip active" data-value="暖男">暖男</button>
                <button class="chip" data-value="幽默">幽默</button>
                <button class="chip" data-value="直球">直球</button>
            </div>
        </div>
        <div class="config-group">
            <label>🔒 安全</label>
            <div class="chip-group" id="safetyGroup">
                <button class="chip" data-value="green">绿</button>
                <button class="chip active" data-value="yellow">黄</button>
            </div>
        </div>
    </div>

    <div class="history-area" id="historyArea">
        <div class="history-empty">👋 输入女生的话，AI帮你出谋划策</div>
    </div>

    <div class="suggestions-area" id="suggestionsArea">
        <div class="analysis-text" id="analysisText">🔍 潜台词分析</div>
        <div id="suggestionList"></div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入女生原话..." autocomplete="off">
        <div class="btn-group">
            <button class="btn btn-primary" id="sendBtn">🚀 获取建议</button>
            <button class="btn btn-outline" id="appendBtn" title="仅追加女生回复，不重新分析">📥 追加</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ============================================================
    //  状态管理
    // ============================================================
    const state = {
        history: [],
        config: {
            scenario: '暧昧',
            style: '暖男',
            safety: 'yellow'
        },
        isLoading: false,
        lastResponse: null,
        pendingGuyReply: false
    };

    const $ = id => document.getElementById(id);
    const historyArea = $('historyArea');
    const suggestionsArea = $('suggestionsArea');
    const analysisText = $('analysisText');
    const suggestionList = $('suggestionList');
    const messageInput = $('messageInput');
    const sendBtn = $('sendBtn');
    const appendBtn = $('appendBtn');
    const toastEl = $('toast');

    // ============================================================
    //  本地模拟AI引擎
    // ============================================================
    const MOCK_DB = {
        '暖男': {
            '破冰': [
                { text: '听你这么说，感觉你是个很认真的人，认识你很开心。', reason: '真诚表达欣赏，不越界。', effect: '她会觉得你靠谱。' },
                { text: '虽然刚认识，但感觉你性格很好，希望多了解你。', reason: '表达好感但留有余地。', effect: '她会愿意继续聊下去。' },
                { text: '今天能和你聊天很幸运，希望你也是。', reason: '温暖收尾，拉近距离。', effect: '氛围温馨。' }
            ],
            '暧昧': [
                { text: '辛苦了，给你云递一杯热奶茶（加珍珠）。', reason: '虚拟动作表达关心。', effect: '她会觉得被温暖到。' },
                { text: '听你说累，我都有点心疼了，明天好好休息吧。', reason: '直接表达心疼（yellow级）。', effect: '她会感到被重视。' },
                { text: '要是能帮你分担一点就好了，下次累的时候记得找我。', reason: '暧昧试探，制造依赖。', effect: '关系升温。' }
            ],
            '挽回': [
                { text: '我理解你的感受，之前确实是我没处理好。', reason: '承认问题，不辩解。', effect: '情绪缓和。' },
                { text: '不管结果如何，我都希望你是开心的。', reason: '低姿态但保持尊重。', effect: '她可能软化态度。' },
                { text: '给我一点时间，我会改，但我不逼你。', reason: '给出空间，展示担当。', effect: '保留挽回机会。' }
            ]
        },
        '幽默': {
            '破冰': [
                { text: '啊，这熟悉的感觉，难道我们上辈子是网友？', reason: '玩梗化解陌生感。', effect: '她会笑。' },
                { text: '你这句话我该怎么接？在线等，挺急的。', reason: '自嘲式示弱，激发母性。', effect: '互动性强。' },
                { text: '高手啊，一上来就聊这么深刻的话题。', reason: '夸张赞美，轻松开场。', effect: '气氛活跃。' }
            ],
            '暧昧': [
                { text: '你这么累，我怕我的笑话你笑不动，那我岂不是亏了？', reason: '先关心再调侃。', effect: '情绪被调节。' },
                { text: '卷王，再卷我就去公司楼下举牌抗议了。', reason: '结合职场梗。', effect: '她会觉得有趣。' },
                { text: '累了就想想我，保准吓醒，比咖啡管用。', reason: '自黑式暧昧。', effect: '又甜又好笑。' }
            ],
            '挽回': [
                { text: '虽然我现在挺笨的，但听你说话我还是会的。', reason: '自嘲+认真。', effect: '缓解沉重感。' },
                { text: '好吧，我承认我输了，但输给你我不冤。', reason: '幽默认输，降低对抗。', effect: '气氛破冰。' },
                { text: '你可以生我气，但别气坏了，不然我要内疚两辈子。', reason: '夸张讨好。', effect: '让她哭笑不得。' }
            ]
        },
        '直球': {
            '破冰': [
                { text: '我觉得我们挺合拍的，要不要打个赌？', reason: '自信主导对话。', effect: '激发好胜心。' },
                { text: '不说废话了，我想认识你。', reason: '简单直接。', effect: '冲击力强。' },
                { text: '你挺有意思的，我不太想跟你只做网友。', reason: '直接表达意图。', effect: '明确态度。' }
            ],
            '暧昧': [
                { text: '加班完，第一个想到的是找我诉苦，我该不该高兴？', reason: '直接戳破她的依赖。', effect: '暧昧升级。' },
                { text: '别太拼了，我会担心。', reason: '霸道式关心。', effect: '让她心跳加速。' },
                { text: '下次累的时候，直接打电话给我，别打字了。', reason: '推进实际接触。', effect: '关系质变。' }
            ],
            '挽回': [
                { text: '我不想放手，但如果你真要走，我送你。', reason: '强势中带温柔。', effect: '触动内心。' },
                { text: '给我一次机会，就一次。', reason: '简洁有力。', effect: '直击灵魂。' },
                { text: '之前是我的错，我不找借口，但我想弥补。', reason: '干脆利落认错。', effect: '展现担当。' }
            ]
        }
    };

    function getMockSuggestions(girlMessage, history, config) {
        const style = config.style || '暖男';
        const scenario = config.scenario || '暧昧';
        const styleData = MOCK_DB[style] || MOCK_DB['暖男'];
        const suggestions = styleData[scenario] || styleData['暧昧'];

        let analysis = '日常闲聊，可以制造轻松氛围。';
        if (girlMessage.includes('累') || girlMessage.includes('加班') || girlMessage.includes('困')) {
            analysis = '她在释放疲惫情绪，渴望被关心和照顾。';
        } else if (girlMessage.includes('?') || girlMessage.includes('？') || girlMessage.includes('吗')) {
            analysis = '她在主动找话题，对你有关注度，接住并抛回问题。';
        } else if (girlMessage.includes('烦') || girlMessage.includes('难') || girlMessage.includes('不开心')) {
            analysis = '她心情低落，需要情绪共鸣，而不是解决问题。';
        }

        const list = suggestions.map((s, idx) => ({
            id: idx + 1,
            text: s.text,
            reason: s.reason,
            expectedEffect: s.effect
        }));

        return { analysis, suggestions: list };
    }

    // ============================================================
    //  核心交互
    // ============================================================
    function getConfig() {
        const scenario = document.querySelector('#scenarioGroup .chip.active')?.dataset.value || '暧昧';
        const style = document.querySelector('#styleGroup .chip.active')?.dataset.value || '暖男';
        const safety = document.querySelector('#safetyGroup .chip.active')?.dataset.value || 'yellow';
        return { scenario, style, safety };
    }

    function showToast(msg, duration = 2000) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function renderHistory() {
        if (state.history.length === 0) {
            historyArea.innerHTML = `<div class="history-empty">👋 输入女生的话，AI帮你出谋划策</div>`;
            return;
        }
        let html = '';
        state.history.forEach(msg => {
            const cls = msg.role === 'girl' ? 'msg-girl' : 'msg-guy';
            const label = msg.role === 'girl' ? '👩 她' : '🧑 我';
            html += `<div class="msg-bubble ${cls}"><div class="msg-label">${label}</div>${msg.content}</div>`;
        });
        historyArea.innerHTML = html;
        historyArea.scrollTop = historyArea.scrollHeight;
    }

    function renderSuggestions(response) {
        if (!response || !response.suggestions || response.suggestions.length === 0) {
            suggestionsArea.classList.remove('show');
            return;
        }
        suggestionsArea.classList.add('show');
        analysisText.textContent = '🔍 ' + response.analysis;

        let html = '';
        response.suggestions.forEach(s => {
            html += `
                <div class="suggestion-card" data-id="${s.id}" data-text="${encodeURIComponent(s.text)}">
                    <div class="suggestion-text">${s.id}. ${s.text}</div>
                    <div class="suggestion-meta">
                        <span>💡 ${s.reason}</span>
                        <span>📈 ${s.expectedEffect}</span>
                    </div>
                    <div class="badge-copy">👆 点击复制</div>
                </div>
            `;
        });
        suggestionList.innerHTML = html;

        document.querySelectorAll('.suggestion-card').forEach(card => {
            card.addEventListener('click', function() {
                const text = decodeURIComponent(this.dataset.text);
                copyAndSelect(text);
            });
        });
    }

    function copyAndSelect(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ 已复制：' + text);
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }

        state.history.push({ role: 'guy', content: text });
        state.pendingGuyReply = true;
        state.lastResponse = null;
        renderHistory();
        suggestionsArea.classList.remove('show');
        messageInput.focus();
        showToast('📨 已记录你的回复，等女生回了再输入下一句', 1500);
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('✅ 已复制：' + text);
        } catch (e) {
            showToast('⚠️ 复制失败，请手动复制：' + text, 3000);
        }
        document.body.removeChild(textarea);
    }

    function handleSend() {
        if (state.isLoading) return;
        const input = messageInput.value.trim();
        if (!input) {
            showToast('请输入女生说的话', 1000);
            return;
        }

        if (state.pendingGuyReply) {
            state.history.push({ role: 'girl', content: input });
            state.pendingGuyReply = false;
            messageInput.value = '';
            renderHistory();
        } else {
            state.history.push({ role: 'girl', content: input });
            messageInput.value = '';
            renderHistory();
        }

        state.isLoading = true;
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<span class="loader"></span>思考中';
        suggestionsArea.classList.remove('show');

        setTimeout(() => {
            const config = getConfig();
            const response = getMockSuggestions(input, state.history, config);
            state.lastResponse = response;
            state.isLoading = false;
            sendBtn.disabled = false;
            sendBtn.innerHTML = '🚀 获取建议';
            renderSuggestions(response);
            suggestionsArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 500);
    }

    function handleAppend() {
        const input = messageInput.value.trim();
        if (!input) {
            showToast('请输入要追加的内容', 1000);
            return;
        }
        state.history.push({ role: 'girl', content: input });
        state.pendingGuyReply = false;
        messageInput.value = '';
        renderHistory();
        showToast('📥 已追加女生消息', 1200);
        suggestionsArea.classList.remove('show');
    }

    // ============================================================
    //  事件绑定
    // ============================================================
    document.querySelectorAll('.chip-group').forEach(group => {
        group.addEventListener('click', function(e) {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            this.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            if (state.lastResponse && state.history.length > 0) {
                showToast('配置已切换，重新输入消息获取新建议', 1500);
            }
        });
    });

    sendBtn.addEventListener('click', handleSend);
    appendBtn.addEventListener('click', handleAppend);
    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSend();
        }
    });

    renderHistory();
    showToast('💡 输入女生的话，点击"获取建议"', 1800);
</script>
</body>
</html>
