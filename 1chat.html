<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 聊天助手</title>
    <style>
        :root {
            --purple-50: #faf5ff;
            --purple-100: #f3e8ff;
            --purple-200: #e9d5ff;
            --purple-300: #d8b4fe;
            --purple-400: #c084fc;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7c3aed;
            --purple-800: #6d28d9;
            --green-50: #f0fdf4;
            --green-100: #dcfce7;
            --green-200: #bbf7d0;
            --green-600: #16a34a;
            --green-700: #15803d;
            --green-800: #166534;
            --red-50: #fef2f2;
            --red-100: #fee2e2;
            --red-400: #f87171;
            --red-700: #b91c1c;
            --amber-50: #fffbeb;
            --amber-100: #fef3c7;
            --amber-600: #d97706;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 40px;
            --shadow-sm: 0 2px 8px rgba(100, 70, 120, 0.06);
            --shadow-md: 0 8px 24px rgba(100, 70, 120, 0.12);
            --shadow-lg: 0 16px 48px rgba(100, 70, 120, 0.18);
            --shadow-glow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 20px 60px rgba(100, 70, 120, 0.2);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body {
            background: linear-gradient(160deg, #faf5ff 0%, #f0e6f6 30%, #e8dcf0 60%, #f5f0fa 100%);
            background-attachment: fixed; min-height:100vh; display:flex; justify-content:center; align-items:center;
            padding:12px; -webkit-tap-highlight-color:transparent; position:relative; overflow:hidden;
        }

        #splash {
            position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center;
            background: linear-gradient(145deg, #2e1065 0%, #4c1d95 30%, #7c3aed 70%, #a855f7 100%);
            overflow:hidden; animation:splashBg 3s ease infinite alternate;
        }
        @keyframes splashBg {
            0% { background: linear-gradient(145deg, #2e1065 0%, #4c1d95 40%, #7c3aed 80%, #a855f7 100%); }
            100% { background: linear-gradient(145deg, #4c1d95 0%, #7c3aed 40%, #a855f7 80%, #c084fc 100%); }
        }
        #splash.hidden { display:none; }
        .splash-content { text-align:center; z-index:1; animation:fadeInUp 0.8s ease; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .splash-icon { font-size:72px; margin-bottom:16px; animation:float 3s ease-in-out infinite; display:inline-block; }
        @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
        .splash-title { font-size:36px; font-weight:800; color:#fff; text-shadow:0 4px 20px rgba(0,0,0,0.3); margin-bottom:8px; letter-spacing:1px; }
        .splash-subtitle { font-size:16px; color:rgba(255,255,255,0.8); margin-bottom:40px; font-weight:400; letter-spacing:2px; }
        .splash-btn {
            padding:16px 48px; border-radius:60px; border:none; background:rgba(255,255,255,0.95); color:#5b21b6;
            font-weight:700; font-size:18px; cursor:pointer; box-shadow:0 8px 30px rgba(0,0,0,0.2);
            transition:all 0.3s ease; letter-spacing:0.5px; z-index:1; animation:pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { box-shadow:0 8px 30px rgba(0,0,0,0.2); transform:scale(1); } 50% { box-shadow:0 8px 40px rgba(124,58,237,0.4); transform:scale(1.03); } }
        .splash-btn:hover { background:#fff; box-shadow:0 12px 40px rgba(124,58,237,0.5); transform:translateY(-2px); }
        .splash-btn:active { transform:scale(0.96); }
        .splash-bg-dots { position:absolute; inset:0; pointer-events:none; }
        .splash-dot { position:absolute; border-radius:50%; background:rgba(255,255,255,0.15); animation:dotFloat 8s infinite alternate; }
        .splash-dot:nth-child(1) { width:120px; height:120px; top:10%; left:10%; animation-duration:10s; }
        .splash-dot:nth-child(2) { width:80px; height:80px; top:70%; left:80%; animation-duration:12s; }
        .splash-dot:nth-child(3) { width:200px; height:200px; top:40%; left:50%; animation-duration:14s; }
        .splash-dot:nth-child(4) { width:60px; height:60px; top:20%; right:15%; animation-duration:9s; }
        @keyframes dotFloat { 0% { transform:translate(0,0) scale(1); opacity:0.2; } 100% { transform:translate(30px,-20px) scale(1.1); opacity:0.4; } }

        #app {
            max-width:500px; width:100%; background:rgba(255,255,255,0.7); backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px); border-radius:var(--radius-xl); box-shadow:var(--shadow-glow);
            padding:18px 14px 12px; height:96vh; max-height:900px; display:flex; flex-direction:column;
            overflow:hidden; border:1px solid rgba(255,255,255,0.5); position:relative; transition:all var(--transition-slow);
        }
        #app.hidden { display:none; }

        .header { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid rgba(0,0,0,0.04); flex-shrink:0; gap:8px; }
        .header h1 { font-size:20px; font-weight:700; background:linear-gradient(135deg, #7c3aed, #a855f7, #c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-0.3px; white-space:nowrap; flex-shrink:0; }
        .header-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }
        .badge { font-size:10px; font-weight:600; padding:4px 10px; border-radius:30px; letter-spacing:0.2px; white-space:nowrap; transition:var(--transition); flex-shrink:0; cursor:default; }
        .badge.online { background:var(--green-100); color:var(--green-800); animation:pulseBadge 2s ease-in-out infinite; }
        .badge.offline { background:var(--red-100); color:var(--red-700); }
        .badge.warning { background:var(--amber-100); color:var(--amber-600); }
        @keyframes pulseBadge { 0%,100% { box-shadow:0 0 0 0 rgba(22,163,74,0.3); } 50% { box-shadow:0 0 0 8px rgba(22,163,74,0); } }
        .settings-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:6px 10px; border-radius:30px; transition:var(--transition); line-height:1; flex-shrink:0; color:var(--gray-600); }
        .settings-btn:hover { background:rgba(124,58,237,0.08); color:var(--purple-600); }
        .settings-btn:active { transform:scale(0.9); }
        .profile-tag { font-size:11px; color:var(--gray-500); background:rgba(124,58,237,0.07); padding:3px 10px; border-radius:30px; display:inline-flex; align-items:center; gap:3px; cursor:pointer; max-width:110px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; transition:var(--transition); font-weight:500; flex-shrink:1; }
        .profile-tag:hover { background:rgba(124,58,237,0.15); color:var(--purple-700); }
        .profile-tag:active { transform:scale(0.95); }

        .config-row { display:flex; justify-content:center; gap:10px; margin-top:10px; flex-shrink:0; flex-wrap:wrap; }
        .config-group { flex:1; min-width:80px; max-width:180px; display:flex; flex-direction:column; align-items:center; gap:3px; }
        .config-group label { font-size:9px; font-weight:700; color:var(--gray-400); letter-spacing:0.4px; text-transform:uppercase; }
        .chip-group { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; }
        .chip { font-size:10px; padding:4px 10px; border-radius:30px; background:var(--gray-100); color:var(--gray-500); border:1.5px solid transparent; cursor:pointer; font-weight:500; transition:var(--transition); white-space:nowrap; outline:none; }
        .chip:hover { background:#ede9fe; color:var(--purple-600); transform:translateY(-1px); }
        .chip.active { background:var(--purple-600); color:#fff; border-color:var(--purple-600); box-shadow:0 2px 8px rgba(124,58,237,0.3); font-weight:600; }
        .chip:active { transform:scale(0.9); }

        .quick-bar { display:flex; gap:10px; margin:6px 0; flex-shrink:0; flex-wrap:wrap; padding:5px 10px; background:rgba(255,255,255,0.45); border-radius:16px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.5); font-size:11px; }
        .quick-item { font-size:11px; color:var(--gray-500); display:flex; align-items:center; gap:3px; }
        .quick-item .label { font-weight:600; color:var(--gray-600); font-size:10px; }
        .quick-item .value { background:#ede9fe; padding:1px 9px; border-radius:30px; font-weight:500; color:#5b21b6; cursor:pointer; font-size:11px; transition:var(--transition); display:inline-flex; align-items:center; gap:4px; }
        .quick-item .value:hover { background:#ddd6fe; }
        .quick-item .value .mini-avatar { width:16px; height:16px; border-radius:50%; background:var(--purple-200); color:var(--purple-700); font-size:8px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; text-transform:uppercase; }

        .history-area { flex:1 1 0; min-height:0; overflow-y:auto; background:rgba(255,255,255,0.45); border-radius:var(--radius-lg); margin:6px 0 4px; padding:10px 8px; border:1px solid rgba(255,255,255,0.5); display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
        .history-empty { color:#c4b5d0; font-size:13px; text-align:center; margin:auto; font-weight:500; letter-spacing:0.3px; line-height:1.6; }
        .msg-bubble { max-width:85%; padding:9px 14px; border-radius:18px; font-size:13px; line-height:1.55; word-break:break-word; box-shadow:var(--shadow-sm); animation:msgIn 0.3s ease; position:relative; transition:transform var(--transition); }
        @keyframes msgIn { from { opacity:0; transform:translateY(8px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
        .msg-girl { align-self:flex-start; background:#ede9fe; color:#2e1065; border-bottom-left-radius:6px; border:1px solid #e9d5ff; }
        .msg-guy { align-self:flex-end; background:#d1fae5; color:#064e3b; border-bottom-right-radius:6px; border:1px solid #bbf7d0; }
        .msg-label { font-size:9px; opacity:0.5; margin-bottom:2px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase; cursor:default; }

        .suggestions-panel {
            flex-shrink:0;
            max-height:120px;
            overflow-y:auto;
            background:linear-gradient(135deg, #fffdf5, #fffef9);
            border:1.5px solid #f3e8d0;
            border-radius:var(--radius-lg);
            padding:10px 12px;
            margin:4px 0 2px;
            box-shadow:0 2px 12px rgba(180,150,80,0.08);
            animation:slideUp 0.35s ease;
            display:none;
            -webkit-overflow-scrolling:touch;
            touch-action:pan-y;
            overscroll-behavior:contain;
            transition:max-height 0.3s ease;
        }
        .suggestions-panel.show { display:block; }
        .suggestions-panel.expanded { max-height:40vh; }
        @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .suggestions-panel .s-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .suggestions-panel .s-title { font-weight:700; font-size:12px; color:#8b7355; display:flex; align-items:center; gap:4px; }
        .suggestions-panel .s-header-actions { display:flex; gap:4px; align-items:center; }
        .suggestions-panel .s-close, .suggestions-panel .s-expand {
            background:none; border:none; color:#c4b5a0; cursor:pointer; font-size:16px; padding:2px 6px; border-radius:20px; transition:var(--transition); line-height:1;
        }
        .suggestions-panel .s-close:hover, .suggestions-panel .s-expand:hover { color:#a08060; background:rgba(0,0,0,0.04); }
        .suggestion-card {
            display:flex; align-items:center; gap:8px; padding:8px 10px; margin-bottom:5px; background:#fff;
            border-radius:var(--radius-sm); cursor:pointer; border:1px solid #f0e8d5; transition:var(--transition);
        }
        .suggestion-card:last-child { margin-bottom:0; }
        .suggestion-card:hover { background:#fffbeb; border-color:#e8d8b0; box-shadow:0 1px 4px rgba(180,150,80,0.1); transform:translateX(2px); }
        .suggestion-card:active { transform:scale(0.97); background:#fef9e7; }
        .suggestion-card .s-num { width:22px; height:22px; border-radius:50%; background:#ede9fe; color:#5b21b6; font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .suggestion-card .s-body { flex:1; min-width:0; }
        .suggestion-card .s-text { font-weight:500; font-size:13px; color:var(--gray-800); line-height:1.4; }
        .suggestion-card .s-meta { font-size:10px; color:#a09080; display:flex; gap:6px; margin-top:2px; flex-wrap:wrap; }
        .suggestion-card .s-meta span { background:#fdf6e8; padding:1px 7px; border-radius:10px; font-size:9px; white-space:nowrap; }
        .suggestion-card .s-copy-hint { font-size:9px; color:var(--purple-500); opacity:0; transition:var(--transition); white-space:nowrap; font-weight:500; }
        .suggestion-card:hover .s-copy-hint { opacity:1; }
        .suggestion-card.copied { background:#f0fdf4 !important; border-color:#bbf7d0 !important; animation:copiedPulse 0.5s ease; }
        @keyframes copiedPulse { 0%,100% { box-shadow:0 0 0 0 rgba(22,163,74,0.3); } 50% { box-shadow:0 0 0 12px rgba(22,163,74,0); } }
        .suggestion-card.copied .s-num { background:#bbf7d0; color:#166534; }
        .suggestion-card.copied .s-copy-hint { opacity:1; color:#15803d; }

        .input-area { display:flex; gap:8px; margin-top:4px; flex-shrink:0; align-items:center; flex-wrap:wrap; }
        .input-area input { flex:1; min-width:100px; padding:12px 16px; border-radius:40px; border:1.5px solid var(--gray-200); font-size:14px; outline:none; background:#fff; transition:var(--transition); color:var(--gray-800); }
        .input-area input:focus { border-color:var(--purple-500); box-shadow:0 0 0 4px rgba(124,58,237,0.06); }
        .input-area input::placeholder { color:var(--gray-400); }
        .input-area .btn-group { display:flex; gap:5px; flex-wrap:wrap; flex-shrink:0; }
        .btn { padding:11px 18px; border-radius:40px; border:none; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap; transition:var(--transition); letter-spacing:0.2px; outline:none; }
        .btn:active { transform:scale(0.93); }
        .btn-primary { background:var(--purple-600); color:#fff; box-shadow:0 4px 14px rgba(124,58,237,0.3); }
        .btn-primary:hover { background:var(--purple-700); box-shadow:0 6px 18px rgba(124,58,237,0.4); }
        .btn-primary:disabled { opacity:0.5; box-shadow:none; cursor:not-allowed; transform:none; }
        .btn-outline { background:transparent; color:var(--gray-500); border:1.5px solid var(--gray-200); padding:10px 14px; font-size:12px; }
        .btn-outline:hover { background:var(--gray-50); border-color:var(--gray-300); color:var(--gray-700); }
        .btn-image { background:transparent; color:var(--purple-600); border:1.5px solid var(--purple-400); padding:9px 13px; font-size:18px; line-height:1; }
        .btn-image:hover { background:rgba(124,58,237,0.06); border-color:var(--purple-500); }
        .btn-image.has-image { background:var(--purple-100); border-color:var(--purple-500); animation:imageGlow 1.5s ease-in-out infinite; }
        @keyframes imageGlow { 0%,100% { box-shadow:0 0 0 0 rgba(124,58,237,0.3); } 50% { box-shadow:0 0 0 8px rgba(124,58,237,0); } }

        .image-preview { display:flex; align-items:center; gap:6px; margin-top:4px; flex-shrink:0; padding:4px 8px; background:rgba(255,255,255,0.6); border-radius:16px; border:1px solid var(--gray-200); animation:fadeSlideIn 0.25s ease; }
        .image-preview img { max-width:50px; max-height:50px; border-radius:10px; border:1px solid var(--gray-200); object-fit:cover; cursor:pointer; }
        .image-preview .remove-img { background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer; padding:2px 6px; border-radius:20px; }
        .image-preview .remove-img:hover { background:rgba(239,68,68,0.08); }

        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) scale(0.85); background:var(--gray-800); color:#fff; padding:10px 22px; border-radius:40px; font-size:13px; opacity:0; transition:all 0.25s cubic-bezier(0.4,0,0.2,1); pointer-events:none; max-width:90%; text-align:center; z-index:999; box-shadow:0 8px 30px rgba(0,0,0,0.2); font-weight:500; letter-spacing:0.3px; }
        .toast.show { opacity:1; transform:translateX(-50%) scale(1); }
        .toast.error { background:#dc2626; box-shadow:0 8px 30px rgba(220,38,38,0.3); }
        .toast.success { background:#16a34a; box-shadow:0 8px 30px rgba(22,163,74,0.3); }

        .loader { display:inline-block; width:16px; height:16px; border:2.5px solid var(--gray-200); border-top-color:var(--purple-600); border-radius:50%; animation:spin 0.6s linear infinite; margin-right:6px; vertical-align:middle; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .suggestions-loader { display:flex; align-items:center; justify-content:center; gap:8px; padding:16px; color:var(--gray-500); font-size:12px; font-weight:500; }
        .suggestions-loader .loader { width:20px; height:20px; border-width:3px; }

        ::-webkit-scrollbar { width:3px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#d1d5db; border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:#b0b5bc; }

        .image-modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:flex; align-items:center; justify-content:center; cursor:pointer; animation:fadeIn 0.2s ease; }
        .image-modal img { max-width:95vw; max-height:90vh; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.5); object-fit:contain; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        .page-overlay { position:fixed; inset:0; z-index:100; background:rgba(255,255,255,0.92); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); display:none; flex-direction:column; overflow:hidden; animation:settingsSlideIn 0.35s cubic-bezier(0.4,0,0.2,1); border-radius:0; }
        .page-overlay.show { display:flex; }
        @keyframes settingsSlideIn { from { opacity:0; transform:scale(0.96) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .page-overlay .page-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 12px; border-bottom:1px solid rgba(0,0,0,0.06); flex-shrink:0; background:rgba(255,255,255,0.5); }
        .page-overlay .page-header h2 { font-size:18px; font-weight:700; color:var(--gray-800); }
        .page-overlay .page-header .close-btn { background:none; border:none; font-size:24px; cursor:pointer; padding:4px 8px; border-radius:30px; color:var(--gray-500); transition:var(--transition); line-height:1; }
        .page-overlay .page-header .close-btn:hover { background:rgba(0,0,0,0.05); color:var(--gray-700); }
        .page-overlay .page-body { flex:1; overflow-y:auto; padding:16px 20px 30px; -webkit-overflow-scrolling:touch; }

        .manage-object-item {
            display:flex; align-items:center; padding:12px 16px; background:#fff; border-radius:var(--radius-sm);
            margin-bottom:8px; border:1.5px solid var(--gray-200); cursor:pointer; transition:var(--transition);
        }
        .manage-object-item:hover { background:var(--gray-50); border-color:var(--gray-300); }
        .manage-object-item.active { border-color:var(--purple-500); background:#faf5ff; box-shadow:0 0 0 2px rgba(124,58,237,0.06); }
        .manage-object-item .avatar { width:44px; height:44px; border-radius:50%; background:var(--purple-100); color:var(--purple-700); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; flex-shrink:0; margin-right:14px; text-transform:uppercase; }
        .manage-object-item .info-wrap { flex:1; min-width:0; }
        .manage-object-item .name { font-weight:600; font-size:15px; color:var(--gray-800); }
        .manage-object-item .info { font-size:12px; color:var(--gray-500); margin-top:2px; }
        .manage-object-item .check-mark { color:var(--purple-600); font-size:18px; font-weight:700; opacity:0; transition:var(--transition); }
        .manage-object-item.active .check-mark { opacity:1; }
        .manage-object-item .del-btn { background:none; border:none; color:var(--gray-400); font-size:18px; cursor:pointer; padding:2px 8px; border-radius:20px; transition:var(--transition); margin-left:8px; }
        .manage-object-item .del-btn:hover { color:#ef4444; background:rgba(239,68,68,0.06); }

        .manage-section-title { font-size:12px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:0.5px; margin:16px 0 8px; border-bottom:1px solid var(--gray-200); padding-bottom:4px; }
        .manage-add-row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
        .manage-add-row input { flex:1; min-width:70px; padding:7px 11px; border-radius:20px; border:1.5px solid var(--gray-200); font-size:12px; outline:none; }
        .manage-add-row input:focus { border-color:var(--purple-500); }

<body>
    <div id="splash">

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const state = {
                objects: [],
                currentObjectId: null,
                config: { scenario: '日常闲聊', style: '话题延伸' },
                isLoading: false,
                apiKey: '',
                apiUrl: 'https://api.deepseek.com/v1/chat/completions',
                model: 'deepseek-chat',
                useAI: true,
                imageBase64: null,
                presets: [],
                currentPreset: '',
                relations: ['朋友', '同事', '恋人', '家人', '客户', '其他'],
                currentSuggestions: null,
                scenarios: ['日常闲聊', '深入交流', '正式沟通'],
                styles: [
                    { name: '幽默', instruction: '用轻松幽默口语回应，像朋友聊天，可自嘲调侃。', opening: false },
                    { name: '直球', instruction: '直接、自信、简洁，不绕弯子。', opening: false },
                    { name: '话题延伸', instruction: '提出开放性问题或分享经历，引导深入。', opening: false },
                    { name: '开启话题', instruction: '生成全新话题开场白，自然有趣，结合对方信息。', opening: true },
                    { name: '高情商回复', instruction: '高情商回应，注重共情、温和、体面。', opening: false }
                ],
                myProfile: { name: '', age: '', hobby: '', note: '' },
                toastTimer: null,
            };

            const $ = id => document.getElementById(id);
            const dom = {
                splash: $('splash'), app: $('app'), enterAppBtn: $('enterAppBtn'),
                historyArea: $('historyArea'), toastEl: $('toast'),
                statusBadge: $('statusBadge'), profileTag: $('profileTag'),
                messageInput: $('messageInput'), sendBtn: $('sendBtn'),
                settingsToggle: $('settingsToggle'),
                settingsPage: $('settingsPage'), settingsCloseBtn: $('settingsCloseBtn'),
                apiKeyInput: $('apiKeyInput'), apiUrlInput: $('apiUrlInput'), modelInput: $('modelInput'),
                useAICheckbox: $('useAI'), saveSettingsBtn: $('saveSettingsBtn'),
                presetList: $('presetList'), newPresetName: $('newPresetName'), addPresetBtn: $('addPresetBtn'),
                managePage: $('managePage'), manageCloseBtn: $('manageCloseBtn'), manageBody: $('manageBody'),
                imageBtn: $('imageBtn'), fileInput: $('fileInput'), imagePreview: $('imagePreview'), previewImg: $('previewImg'), removeImgBtn: $('removeImgBtn'),
                clearHistoryBtn: $('clearHistoryBtn'),
                suggestionsPanel: $('suggestionsPanel'), suggestionsContent: $('suggestionsContent'), closeSuggestionsBtn: $('closeSuggestionsBtn'), expandSuggestionsBtn: $('expandSuggestionsBtn'),
                quickRelation: $('quickRelation'), quickPurpose: $('quickPurpose'),
                scenarioGroup: $('scenarioGroup'), styleGroup: $('styleGroup'),
            };

            function showToast(m, d = 2000, type = '') {
                const el = dom.toastEl;
                el.textContent = m; el.className = 'toast ' + type; el.classList.add('show');
                clearTimeout(state.toastTimer);
                state.toastTimer = setTimeout(() => el.classList.remove('show'), d);
            }
            function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
            function toAscii(str) { return str.replace(/[^\x00-\x7F]/g, ''); }
            function getConfig() {
                const s = document.querySelector('#scenarioGroup .chip.active')?.dataset.value || state.config.scenario;
                const t = document.querySelector('#styleGroup .chip.active')?.dataset.value || state.config.style;
                return { scenario: s, style: t };
            }
            function getCurrentObject() { return state.objects.find(o => o.id === state.currentObjectId) || null; }
            function getCurrentHistory() { const o = getCurrentObject(); return o ? o.history : []; }
            function isStyleOpeningTopic() {
                const styleName = getConfig().style;
                const styleObj = state.styles.find(s => s.name === styleName);
                return styleObj ? styleObj.opening : false;
            }
            function updateStatusBadge() {
                const hasKey = state.apiKey && state.apiKey.trim().length > 0;
                const badge = dom.statusBadge;
                if (state.useAI && hasKey) { badge.textContent = '🤖 AI 在线'; badge.className = 'badge online'; }
                else if (!state.useAI) { badge.textContent = '⛔ AI 禁用'; badge.className = 'badge offline'; }
                else { badge.textContent = '⚠️ 缺少 Key'; badge.className = 'badge warning'; }
            }
            function updateQuickPurposeText() { dom.quickPurpose.textContent = getConfig().scenario || '日常闲聊'; }
            function updatePlaceholder() {
                dom.messageInput.placeholder = isStyleOpeningTopic() ? '输入话题方向（可选）或留空自动生成' : '输入对方原话...';
            }
            function updateImageBtnState() {
                if (state.imageBase64) { dom.imageBtn.classList.add('has-image'); dom.imageBtn.textContent = '📷✓'; }
                else { dom.imageBtn.classList.remove('has-image'); dom.imageBtn.textContent = '📷'; }
            }
            function saveToStorage() {
                try {
                    const data = {
                        objects: state.objects, currentObjectId: state.currentObjectId,
                        apiKey: state.apiKey, apiUrl: state.apiUrl, model: state.model, useAI: state.useAI,
                        presets: state.presets, currentPreset: state.currentPreset,
                        relations: state.relations, currentSuggestions: state.currentSuggestions,
                        scenarios: state.scenarios, styles: state.styles, config: state.config,
                        myProfile: state.myProfile
                    };
                    localStorage.setItem('chat_data_final', JSON.stringify(data));
                } catch (e) {}
            }
            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem('chat_data_final');
                    if (raw) {
                        const data = JSON.parse(raw);
                        state.objects = data.objects || [];
                        state.currentObjectId = data.currentObjectId || null;
                        state.apiKey = data.apiKey || '';
                        state.apiUrl = data.apiUrl || 'https://api.deepseek.com/v1/chat/completions';
                        state.model = data.model || 'deepseek-chat';
                        state.useAI = data.useAI !== undefined ? data.useAI : true;
                        state.presets = data.presets || [];
                        state.currentPreset = data.currentPreset || '';
                        state.relations = data.relations || ['朋友', '同事', '恋人', '家人', '客户', '其他'];
                        state.currentSuggestions = data.currentSuggestions || null;
                        state.scenarios = data.scenarios || ['日常闲聊', '深入交流', '正式沟通'];
                        state.styles = data.styles || [];
                        state.config = data.config || { scenario: '日常闲聊', style: '话题延伸' };
                        state.myProfile = data.myProfile || { name: '', age: '', hobby: '', note: '' };
                        if (!state.scenarios.includes(state.config.scenario)) state.config.scenario = state.scenarios[0] || '日常闲聊';
                        if (state.styles.length === 0) {
                            state.styles = [
                                { name: '幽默', instruction: '用轻松幽默口语回应，像朋友聊天，可自嘲调侃。', opening: false },
                                { name: '直球', instruction: '直接、自信、简洁，不绕弯子。', opening: false },
                                { name: '话题延伸', instruction: '提出开放性问题或分享经历，引导深入。', opening: false },
                                { name: '开启话题', instruction: '生成全新话题开场白，自然有趣，结合对方信息。', opening: true },
                                { name: '高情商回复', instruction: '高情商回应，注重共情、温和、体面。', opening: false }
                            ];

                        if (!state.styles.find(s => s.name === state.config.style)) state.config.style = state.styles[0]?.name || '话题延伸';
                        return true;
                    }
                } catch (e) {}
                return false;
            }
            function initDefaultState() {
                state.objects = []; state.currentObjectId = null; state.presets = []; state.currentPreset = '';
                state.relations = ['朋友', '同事', '恋人', '家人', '客户', '其他'];
                state.currentSuggestions = null;
                state.scenarios = ['日常闲聊', '深入交流', '正式沟通'];
                state.styles = [
                    { name: '幽默', instruction: '用轻松幽默口语回应，像朋友聊天，可自嘲调侃。', opening: false },
                    { name: '直球', instruction: '直接、自信、简洁，不绕弯子。', opening: false },

                    { name: '开启话题', instruction: '生成全新话题开场白，自然有趣，结合对方信息。', opening: true },
                    { name: '高情商回复', instruction: '高情商回应，注重共情、温和、体面。', opening: false }
                ];
                state.config = { scenario: '日常闲聊', style: '话题延伸' };
                state.myProfile = { name: '', age: '', hobby: '', note: '' };
            }

            function openManage() { dom.managePage.classList.add('show'); renderManagePage(); }

                renderPresets();
            }
            function closeSettings() {
                dom.settingsPage.classList.remove('show');
                updateStatusBadge(); updateQuickPurposeText(); updatePlaceholder();
                updateImageBtnState(); renderScenarioChips(); renderStyleChips(); loadCurrentObject();
            }

            function renderManagePage() {
                const body = dom.manageBody;
                let html = '';

                } else {
                    state.objects.forEach(obj => {

                html += `<div class="manage-add-row" style="margin-top:6px;"><input type="text" id="manageNewObjectName" placeholder="昵称"><button class="btn" id="manageAddObjectBtn">➕ 添加</button></div>

                html += `<div class="manage-section-title" style="margin-top:20px;">🎭 风格管理</div>

            // 图片处理
            function compressImage(dataUrl, maxBytes = 800 * 1024) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        const maxDim = 2048;
                        if (w > maxDim || h > maxDim) { const ratio = Math.min(maxDim / w, maxDim / h); w = Math.round(w * ratio); h = Math.round(h * ratio); }
                        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                        let quality = 0.9;
                        const tryCompress = (q) => {
                            const result = canvas.toDataURL('image/jpeg', q);
                            if (result.length < maxBytes || q < 0.1) resolve(result);
                            else tryCompress(q - 0.05);
                        };
                        tryCompress(quality);
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                });
            }
            function handleImageSelect(file) {
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast('请选择图片文件', 1000, 'error'); return; }
                if (file.size > 20 * 1024 * 1024) { showToast('图片最大20MB', 2000, 'error'); return; }
                const reader = new FileReader();
                reader.onload = async e => {
                    try {
                        const compressed = await compressImage(e.target.result);
                        state.imageBase64 = compressed; dom.previewImg.src = compressed;
                        dom.imagePreview.style.display = 'flex'; updateImageBtnState();
                        showToast('✅ 图片已加载', 1000, 'success');
                    } catch (err) { showToast('❌ 图片处理失败', 2000, 'error'); }
                };
                reader.onerror = () => showToast('❌ 读取图片失败', 2000, 'error');
                reader.readAsDataURL(file);
            }
            function clearImage() {
                state.imageBase64 = null; dom.imagePreview.style.display = 'none'; dom.previewImg.src = '';
                dom.fileInput.value = ''; updateImageBtnState();
            }
            function showImageModal(src) {
                const modal = document.createElement('div');
                modal.className = 'image-modal'; modal.innerHTML = '<img src="' + src + '" alt="大图预览">';
                modal.addEventListener('click', () => modal.remove());
                document.body.appendChild(modal);
            }

            // AI 调用
            async function callAI(girlMessage, history, config, imageBase64, relation, purpose, isOpening = false) {
                const cleanKey = toAscii(state.apiKey).trim();
                if (!cleanKey) throw new Error('API Key 无效');
                const cleanUrl = toAscii(state.apiUrl).trim();
                if (!cleanUrl || !cleanUrl.startsWith('http')) throw new Error('API 地址无效');
                let cleanModel = toAscii(state.model).trim() || 'deepseek-chat';
                const isDeepSeek = cleanUrl.includes('deepseek.com');
                let imageData = null;
                if (imageBase64) {
                    imageData = imageBase64.startsWith('data:image') ? imageBase64 : 'data:image/jpeg;base64,' + imageBase64;
                    if (isDeepSeek) cleanModel = 'deepseek-vl2';
                }
                const o = getCurrentObject();
                const profileText = o ? `对方信息：${o.name||'未命名'}${o.age?'，'+o.age+'岁':''}${o.hobby?'，喜欢/从事 '+o.hobby:''}${o.note?'，备注：'+o.note:''}` : '';
                const my = state.myProfile;
                const myText = my.name ? `我（${my.name}${my.age?'，'+my.age+'岁':''}${my.hobby?'，爱好/职业 '+my.hobby:''}${my.note?'，备注：'+my.note:''}）` : '我';
                const styleObj = state.styles.find(s => s.name === config.style);
                const styleInstruction = styleObj ? styleObj.instruction : '自然口语化回应。';
                let systemPrompt = `你是一位聊天高手。回答要口语化、有语气词。\n${profileText}\n我的信息：${myText}\n关系：${relation}\n场景：${config.scenario}\n风格：${config.style}\n要求：${styleInstruction}\n禁止书面语、说教。每条建议像微信原话，不超过30字。\n输出纯JSON，含"analysis"和"suggestions"(3条，每条含text,reason,expectedEffect)。`;
                if (isOpening) systemPrompt += `\n当前为"开启话题"风格，生成3个有趣开场白。`;
                const messages = [{ role: 'system', content: systemPrompt }];
                let userContent = [];
                if (girlMessage && girlMessage.trim() && !girlMessage.includes('请生成开场白')) {
                    userContent.push({ type: 'text', text: girlMessage });
                }
                if (imageData) userContent.push({ type: 'image_url', image_url: { url: imageData } });
                if (userContent.length === 0) userContent.push({ type: 'text', text: '请生成3个开场白建议' });
                messages.push({ role: 'user', content: userContent });
                const payload = { model: cleanModel, messages, temperature: 1.0, max_tokens: 600 };
                let resp;
                try {
                    resp = await fetch(cleanUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cleanKey}` },
                        body: JSON.stringify(payload),
                        signal: AbortSignal.timeout(60000),
                    });
                } catch (fetchErr) {
                    if (fetchErr.name === 'TimeoutError') throw new Error('请求超时（60秒）');
                    throw new Error('网络错误：' + fetchErr.message);
                }
                if (!resp.ok) {
                    let errText = await resp.text();
                    try { const errJson = JSON.parse(errText); errText = errJson.error?.message || errJson.message || errText; } catch (e) {}
                    if (resp.status === 400) throw new Error(`请求参数错误(400)：${errText.substring(0,200)}`);
                    if (resp.status === 401) throw new Error('API Key无效');
                    if (resp.status === 429) throw new Error('请求过于频繁，请稍后');
                    throw new Error(`API错误(${resp.status}): ${errText.substring(0,150)}`);
                }
                const data = await resp.json();
                const content = data.choices[0].message.content;
                let parsed;
                try { parsed = JSON.parse(content); } catch (e1) {
                    const m = content.match(/```json\s*([\s\S]*?)\s*```/);
                    if (m) try { parsed = JSON.parse(m[1]); } catch (e2) {}
                    if (!parsed) { const b = content.match(/\{[\s\S]*\}/); if (b) try { parsed = JSON.parse(b[0]); } catch (e3) {} }
                    if (!parsed) throw new Error('AI返回格式错误');
                }
                if (!parsed.suggestions || parsed.suggestions.length < 3) throw new Error('AI未生成足够建议');
                return parsed;
            }
            async function regenerateSuggestions() {
                const obj = getCurrentObject();
                if (!obj) { showToast('请先选择对象', 1000); return; }
                const history = obj.history || [];
                let lastGirlMsg = null;
                for (let i = history.length - 1; i >= 0; i--) { if (history[i].role === 'girl') { lastGirlMsg = history[i]; break; } }
                if (!lastGirlMsg && !isStyleOpeningTopic()) { showToast('暂无对方消息', 1500); return; }
                if (!state.useAI || !state.apiKey) { showToast('AI未启用或无Key', 2000, 'error'); return; }
                await executeAICall(lastGirlMsg, history);
            }
            async function handleSend() {
                if (state.isLoading) return;
                if (!getCurrentObject()) { showToast('请先添加对象', 1500); return; }
                const input = dom.messageInput.value.trim();
                const isOpening = isStyleOpeningTopic();
                if (!input && !state.imageBase64 && !isOpening) { showToast('请输入文字或上传图片', 1000); return; }
                if (!state.useAI || !state.apiKey) { showToast('AI未启用或无Key', 2000, 'error'); return; }
                let finalText = input || (state.imageBase64 ? '请描述这张图片' : '请生成开场白');
                pushHistory('girl', finalText);
                dom.messageInput.value = '';
                renderHistory();
                await executeAICall({ role: 'girl', content: finalText }, getCurrentHistory());
            }
            async function executeAICall(lastGirlMsg, history) {
                state.isLoading = true; dom.sendBtn.disabled = true; dom.sendBtn.innerHTML = '<span class="loader"></span>生成中';
                dom.suggestionsPanel.classList.add('show');
                dom.suggestionsContent.innerHTML = '<div class="suggestions-loader"><span class="loader"></span>AI 正在生成建议...</div>';
                const config = getConfig(); const o = getCurrentObject(); const relation = o?.relationship || '未设置';
                const isOpening = isStyleOpeningTopic();
                const girlMsg = lastGirlMsg ? lastGirlMsg.content : (isOpening ? '请生成开场白' : '');
                try {
                    const r = await callAI(girlMsg, history, config, state.imageBase64, relation, '闲聊', isOpening);
                    state.currentSuggestions = { suggestions: r.suggestions, analysis: r.analysis };
                    renderSuggestionsPanel(); saveToStorage(); showToast('💡 已生成候选回复', 1000, 'success');
                } catch (err) {
                    showToast('❌ ' + err.message, 4000, 'error');
                    const o2 = getCurrentObject();
                    if (o2 && o2.history.length > 0 && o2.history[o2.history.length - 1].role === 'girl') {
                        o2.history.pop(); renderHistory(); saveToStorage();
                    }
                    state.currentSuggestions = null; renderSuggestionsPanel();
                } finally {
                    state.isLoading = false; dom.sendBtn.disabled = false; dom.sendBtn.innerHTML = '🚀 获取';
                    if (!state.currentSuggestions) dom.suggestionsPanel.classList.remove('show', 'expanded');
                }
            }

            // 事件绑定
            function bindEvents() {
                dom.profileTag.addEventListener('click', openManage);
                dom.manageCloseBtn.addEventListener('click', closeManage);
                dom.settingsToggle.addEventListener('click', openSettings);
                dom.settingsCloseBtn.addEventListener('click', closeSettings);
                dom.apiKeyInput.addEventListener('input', () => { state.apiKey = dom.apiKeyInput.value; updateStatusBadge(); });
                dom.apiUrlInput.addEventListener('input', () => { state.apiUrl = dom.apiUrlInput.value; });
                dom.modelInput.addEventListener('input', () => { state.model = dom.modelInput.value; });
                dom.useAICheckbox.addEventListener('change', () => { state.useAI = dom.useAICheckbox.checked; updateStatusBadge(); saveToStorage(); });
                dom.saveSettingsBtn.addEventListener('click', () => saveCurrentAsPreset(dom.newPresetName.value.trim() || '默认配置'));
                dom.addPresetBtn.addEventListener('click', () => {
                    const n = dom.newPresetName.value.trim(); if (!n) { showToast('请输入名称', 1000); return; }
                    saveCurrentAsPreset(n); dom.newPresetName.value = '';
                });
                dom.clearHistoryBtn.addEventListener('click', () => {
                    if (confirm('清除所有聊天记录？')) {
                        const o = getCurrentObject(); if (o) { o.history = []; state.currentSuggestions = null; renderHistory(); renderSuggestionsPanel(); saveToStorage(); showToast('已清除', 1000, 'success'); }
                    }
                });
                dom.sendBtn.addEventListener('click', handleSend);
                dom.messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handleSend(); } });
                dom.imageBtn.addEventListener('click', () => dom.fileInput.click());
                dom.fileInput.addEventListener('change', e => { if (e.target.files.length > 0) handleImageSelect(e.target.files[0]); });
                dom.removeImgBtn.addEventListener('click', clearImage);
                dom.previewImg.addEventListener('click', () => { if (dom.previewImg.src?.startsWith('data:image')) showImageModal(dom.previewImg.src); });
                dom.closeSuggestionsBtn.addEventListener('click', closeSuggestionsPanel);
                dom.expandSuggestionsBtn.addEventListener('click', () => {
                    dom.suggestionsPanel.classList.toggle('expanded');
                    dom.expandSuggestionsBtn.textContent = dom.suggestionsPanel.classList.contains('expanded') ? '🔎' : '🔍';
                });
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') {
                        if (dom.managePage.classList.contains('show')) closeManage();
                        else if (dom.settingsPage.classList.contains('show')) closeSettings();
                        else closeSuggestionsPanel();
                    }
                });
            }

            function checkSplash() {
                dom.splash.classList.remove('hidden');
                dom.app.classList.add('hidden');
                dom.enterAppBtn.addEventListener('click', () => {
                    dom.splash.classList.add('hidden');
                    dom.app.classList.remove('hidden');
                    initApp();
                });
            }
            function initApp() {
                if (!loadFromStorage()) initDefaultState();
                dom.apiKeyInput.value = state.apiKey; dom.apiUrlInput.value = state.apiUrl; dom.modelInput.value = state.model;
                dom.useAICheckbox.checked = state.useAI;
                loadCurrentObject(); updateStatusBadge(); renderPresets(); renderSuggestionsPanel();
                renderScenarioChips(); renderStyleChips(); updateQuickPurposeText(); updatePlaceholder();
                updateImageBtnState(); bindEvents(); saveToStorage();
            }
            checkSplash();
        })();
    </script>
</body>
