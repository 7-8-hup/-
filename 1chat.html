<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 聊天助手 · 图片修复版</title>
    <style>
        /* 样式保持不变（与之前相同，此处省略以节省篇幅） */
        :root {
            --purple-50: #faf5ff;
            --purple-100: #f3e8ff;
            --purple-200: #e9d5ff;
            --purple-300: #d8b4fe;
            --purple-400: #c084fc;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7c3aed;
            --purple-800: #6d28d9;
            --green-50: #f0fdf4;
            --green-100: #dcfce7;
            --green-200: #bbf7d0;
            --green-600: #16a34a;
            --green-700: #15803d;
            --green-800: #166534;
            --red-50: #fef2f2;
            --red-100: #fee2e2;
            --red-400: #f87171;
            --red-700: #b91c1c;
            --amber-50: #fffbeb;
            --amber-100: #fef3c7;
            --amber-600: #d97706;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 40px;
            --shadow-sm: 0 2px 8px rgba(100, 70, 120, 0.06);
            --shadow-md: 0 8px 24px rgba(100, 70, 120, 0.12);
            --shadow-lg: 0 16px 48px rgba(100, 70, 120, 0.18);
            --shadow-glow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 20px 60px rgba(100, 70, 120, 0.2);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(160deg, #faf5ff 0%, #f0e6f6 30%, #e8dcf0 60%, #f5f0fa 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        #app {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-glow);
            padding: 18px 14px 12px;
            height: 96vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: box-shadow var(--transition-slow);
        }
        #app:has(.settings-panel.show) {
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(124, 58, 237, 0.15);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            gap: 8px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 30px;
            letter-spacing: 0.2px;
            white-space: nowrap;
            transition: var(--transition);
            flex-shrink: 0;
            cursor: default;
        }
        .badge.online {
            background: var(--green-100);
            color: var(--green-800);
            animation: pulseBadge 2s ease-in-out infinite;
        }
        .badge.offline {
            background: var(--red-100);
            color: var(--red-700);
        }
        .badge.warning {
            background: var(--amber-100);
            color: var(--amber-600);
        }
        @keyframes pulseBadge {
            0%, 100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
        }
        .settings-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 30px;
            transition: var(--transition);
            line-height: 1;
            flex-shrink: 0;
            color: var(--gray-600);
        }
        .settings-btn:hover { background: rgba(124, 58, 237, 0.08); color: var(--purple-600); }
        .settings-btn:active { transform: scale(0.9); background: rgba(124, 58, 237, 0.15); }
        .profile-tag {
            font-size: 11px;
            color: var(--gray-500);
            background: rgba(124, 58, 237, 0.07);
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            max-width: 110px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: var(--transition);
            font-weight: 500;
            flex-shrink: 1;
        }
        .profile-tag:hover { background: rgba(124, 58, 237, 0.15); color: var(--purple-700); }
        .profile-tag:active { transform: scale(0.95); }

        .settings-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin: 10px 0;
            display: none;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.7);
            max-height: 55vh;
            overflow-y: auto;
            box-shadow: var(--shadow-sm);
            scroll-behavior: smooth;
        }
        .settings-panel.show { display: block; animation: fadeSlideIn 0.3s ease; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .settings-panel label { font-size: 11px; font-weight: 600; color: var(--gray-600); display: block; margin: 10px 0 4px; letter-spacing: 0.2px; text-transform: uppercase; }
        .settings-panel label:first-of-type { margin-top: 0; }
        .settings-panel input { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-200); font-size: 13px; outline: none; background: #fff; transition: var(--transition); color: var(--gray-800); }
        .settings-panel input:focus { border-color: var(--purple-500); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08); }
        .settings-panel .hint { font-size: 10px; color: var(--gray-400); margin-top: 3px; }
        .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .toggle-row label { margin: 0; cursor: pointer; font-weight: 400; text-transform: none; font-size: 13px; color: var(--gray-700); }
        .toggle-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--purple-600); cursor: pointer; }
        .btn-save { margin-top: 12px; width: 100%; padding: 11px; border: none; border-radius: 30px; background: var(--purple-600); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25); transition: var(--transition); letter-spacing: 0.3px; }
        .btn-save:hover { background: var(--purple-700); box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35); transform: translateY(-1px); }
        .btn-save:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(124, 58, 237, 0.2); }
        .btn-secondary { background: var(--gray-200); color: var(--gray-700); box-shadow: none; }
        .btn-secondary:hover { background: var(--gray-300); box-shadow: none; transform: translateY(-1px); }

        .object-list { margin-top: 6px; }
        .object-item { display: flex; align-items: center; padding: 8px 12px; background: #fff; border-radius: var(--radius-sm); margin-bottom: 5px; border: 1.5px solid var(--gray-200); cursor: pointer; transition: var(--transition); position: relative; overflow: hidden; }
        .object-item:hover { background: var(--gray-50); border-color: var(--gray-300); transform: translateX(2px); }
        .object-item:active { transform: scale(0.98); background: #faf5ff; }
        .object-item.active { border-color: var(--purple-500); background: #faf5ff; box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.06); }
        .object-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--purple-500); border-radius: 0 3px 3px 0; }
        .object-item .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--purple-100); color: var(--purple-700); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; margin-right: 10px; text-transform: uppercase; }
        .object-item .info-wrap { flex: 1; min-width: 0; }
        .object-item .name { font-weight: 600; font-size: 13px; color: var(--gray-800); }
        .object-item .info { font-size: 10px; color: var(--gray-500); margin-top: 1px; }
        .object-item .del-btn { background: none; border: none; color: var(--gray-400); font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 20px; transition: var(--transition); flex-shrink: 0; opacity: 0.6; }
        .object-item:hover .del-btn { opacity: 1; }
        .object-item .del-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.06); }
        .add-object-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .add-object-row input { flex: 1; min-width: 70px; padding: 7px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .add-object-row input:focus { border-color: var(--purple-500); }
        .add-object-row .btn { padding: 7px 14px; border-radius: 30px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; background: var(--purple-600); color: #fff; transition: var(--transition); }
        .add-object-row .btn:active { transform: scale(0.92); }

        .preset-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: var(--gray-50); border-radius: var(--radius-sm); margin-bottom: 4px; border: 1px solid var(--gray-200); transition: var(--transition); }
        .preset-item:hover { border-color: var(--purple-300); background: #faf5ff; }
        .preset-item .name { font-size: 12px; font-weight: 500; cursor: pointer; flex: 1; color: var(--gray-700); transition: var(--transition); }
        .preset-item .name:hover { color: var(--purple-600); }
        .preset-item .del-preset { background: none; border: none; color: var(--gray-400); cursor: pointer; padding: 0 6px; font-size: 13px; transition: var(--transition); opacity: 0.6; }
        .preset-item:hover .del-preset { opacity: 1; }
        .preset-item .del-preset:hover { color: #ef4444; }
        .add-preset-row { display: flex; gap: 5px; margin-top: 5px; }
        .add-preset-row input { flex: 1; padding: 6px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .add-preset-row input:focus { border-color: var(--purple-500); }
        .add-preset-row .btn { padding: 6px 13px; border-radius: 20px; border: none; font-size: 11px; cursor: pointer; background: var(--purple-600); color: #fff; font-weight: 600; transition: var(--transition); }

        .tags-wrap { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .tag { display: inline-flex; align-items: center; gap: 3px; background: #ede9fe; padding: 3px 10px; border-radius: 30px; font-size: 11px; color: #5b21b6; cursor: pointer; border: 1px solid #ddd6fe; transition: var(--transition); font-weight: 500; }
        .tag .del-tag { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 12px; padding: 0 2px; transition: var(--transition); opacity: 0.7; }
        .tag:hover .del-tag { opacity: 1; }
        .tag .del-tag:hover { color: #ef4444; }
        .tag:hover { background: #ddd6fe; transform: translateY(-1px); }
        .tag:active { transform: scale(0.93); }
        .relation-input-row { display: flex; gap: 5px; margin: 4px 0 6px; }
        .relation-input-row input { flex: 1; padding: 6px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .relation-input-row input:focus { border-color: var(--purple-500); }
        .relation-input-row .btn { padding: 6px 13px; border-radius: 20px; border: none; font-size: 11px; cursor: pointer; background: var(--purple-600); color: #fff; font-weight: 600; transition: var(--transition); }

        .scenario-input-row { display: flex; gap: 5px; margin: 4px 0 6px; }
        .scenario-input-row input { flex: 1; padding: 6px 11px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; outline: none; }
        .scenario-input-row input:focus { border-color: var(--purple-500); }
        .scenario-input-row .btn { padding: 6px 13px; border-radius: 20px; border: none; font-size: 11px; cursor: pointer; background: var(--purple-600); color: #fff; font-weight: 600; transition: var(--transition); }

        .config-row { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-shrink: 0; flex-wrap: wrap; }
        .config-group { flex: 1; min-width: 80px; max-width: 180px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .config-group label { font-size: 9px; font-weight: 700; color: var(--gray-400); letter-spacing: 0.4px; text-transform: uppercase; }
        .chip-group { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
        .chip { font-size: 10px; padding: 4px 10px; border-radius: 30px; background: var(--gray-100); color: var(--gray-500); border: 1.5px solid transparent; cursor: pointer; font-weight: 500; transition: var(--transition); white-space: nowrap; outline: none; }
        .chip:hover { background: #ede9fe; color: var(--purple-600); transform: translateY(-1px); }
        .chip.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3); font-weight: 600; }
        .chip:active { transform: scale(0.9); }

        .quick-bar { display: flex; gap: 10px; margin: 6px 0; flex-shrink: 0; flex-wrap: wrap; padding: 5px 10px; background: rgba(255, 255, 255, 0.45); border-radius: 16px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.5); font-size: 11px; }
        .quick-item { font-size: 11px; color: var(--gray-500); display: flex; align-items: center; gap: 3px; }
        .quick-item .label { font-weight: 600; color: var(--gray-600); font-size: 10px; }
        .quick-item .value { background: #ede9fe; padding: 1px 9px; border-radius: 30px; font-weight: 500; color: #5b21b6; cursor: pointer; font-size: 11px; transition: var(--transition); display: inline-flex; align-items: center; gap: 4px; }
        .quick-item .value:hover { background: #ddd6fe; }
        .quick-item .value .mini-avatar { width: 16px; height: 16px; border-radius: 50%; background: var(--purple-200); color: var(--purple-700); font-size: 8px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-transform: uppercase; }

        .history-area { flex: 1 1 0; min-height: 0; overflow-y: auto; background: rgba(255, 255, 255, 0.45); border-radius: var(--radius-lg); margin: 6px 0 4px; padding: 10px 8px; border: 1px solid rgba(255, 255, 255, 0.5); display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .history-empty { color: #c4b5d0; font-size: 13px; text-align: center; margin: auto; font-weight: 500; letter-spacing: 0.3px; line-height: 1.6; }
        .msg-bubble { max-width: 85%; padding: 9px 14px; border-radius: 18px; font-size: 13px; line-height: 1.55; word-break: break-word; box-shadow: var(--shadow-sm); animation: msgIn 0.3s ease; position: relative; transition: transform var(--transition); }
        .msg-bubble:active { transform: scale(0.97); }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .msg-girl { align-self: flex-start; background: #ede9fe; color: #2e1065; border-bottom-left-radius: 6px; border: 1px solid #e9d5ff; }
        .msg-guy { align-self: flex-end; background: #d1fae5; color: #064e3b; border-bottom-right-radius: 6px; border: 1px solid #bbf7d0; }
        .msg-label { font-size: 9px; opacity: 0.5; margin-bottom: 2px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; cursor: default; }

        .suggestions-panel { flex-shrink: 0; max-height: 40vh; overflow-y: auto; background: linear-gradient(135deg, #fffdf5, #fffef9); border: 1.5px solid #f3e8d0; border-radius: var(--radius-lg); padding: 10px 12px; margin: 4px 0 2px; box-shadow: 0 2px 12px rgba(180, 150, 80, 0.08); animation: slideUp 0.35s ease; display: none; -webkit-overflow-scrolling: touch; }
        .suggestions-panel.show { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .suggestions-panel .s-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; position: sticky; top: 0; background: linear-gradient(135deg, #fffdf5, #fffef9); padding-bottom: 4px; z-index: 1; }
        .suggestions-panel .s-title { font-weight: 700; font-size: 12px; color: #8b7355; display: flex; align-items: center; gap: 4px; letter-spacing: 0.2px; }
        .suggestions-panel .s-close { background: none; border: none; color: #c4b5a0; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 20px; transition: var(--transition); line-height: 1; }
        .suggestions-panel .s-close:hover { color: #a08060; background: rgba(0, 0, 0, 0.04); }
        .suggestion-card { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 5px; background: #fff; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid #f0e8d5; transition: var(--transition); position: relative; }
        .suggestion-card:last-child { margin-bottom: 0; }
        .suggestion-card:hover { background: #fffbeb; border-color: #e8d8b0; box-shadow: 0 1px 4px rgba(180, 150, 80, 0.1); transform: translateX(2px); }
        .suggestion-card:active { transform: scale(0.97); background: #fef9e7; }
        .suggestion-card .s-num { width: 22px; height: 22px; border-radius: 50%; background: #ede9fe; color: #5b21b6; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: var(--transition); }
        .suggestion-card .s-body { flex: 1; min-width: 0; }
        .suggestion-card .s-text { font-weight: 500; font-size: 13px; color: var(--gray-800); line-height: 1.4; }
        .suggestion-card .s-meta { font-size: 10px; color: #a09080; display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
        .suggestion-card .s-meta span { background: #fdf6e8; padding: 1px 7px; border-radius: 10px; font-size: 9px; white-space: nowrap; }
        .suggestion-card .s-copy-hint { font-size: 9px; color: var(--purple-500); opacity: 0; transition: var(--transition); white-space: nowrap; font-weight: 500; }
        .suggestion-card:hover .s-copy-hint { opacity: 1; }
        .suggestion-card.copied { background: #f0fdf4 !important; border-color: #bbf7d0 !important; animation: copiedPulse 0.5s ease; }
        @keyframes copiedPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.3); } 50% { box-shadow: 0 0 0 12px rgba(22,163,74,0); } }
        .suggestion-card.copied .s-num { background: #bbf7d0; color: #166534; }
        .suggestion-card.copied .s-copy-hint { opacity: 1; color: #15803d; }

        .input-area { display: flex; gap: 8px; margin-top: 4px; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
        .input-area input { flex: 1; min-width: 100px; padding: 12px 16px; border-radius: 40px; border: 1.5px solid var(--gray-200); font-size: 14px; outline: none; background: #fff; transition: var(--transition); color: var(--gray-800); }
        .input-area input:focus { border-color: var(--purple-500); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.06); }
        .input-area input::placeholder { color: var(--gray-400); }
        .input-area .btn-group { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }
        .btn { padding: 11px 18px; border-radius: 40px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: var(--transition); letter-spacing: 0.2px; outline: none; position: relative; overflow: hidden; }
        .btn::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, transparent 70%); opacity: 0; transition: opacity var(--transition); }
        .btn:hover::after { opacity: 1; }
        .btn:active { transform: scale(0.93); }
        .btn-primary { background: var(--purple-600); color: #fff; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3); }
        .btn-primary:hover { background: var(--purple-700); box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4); }
        .btn-primary:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; transform: none; }
        .btn-outline { background: transparent; color: var(--gray-500); border: 1.5px solid var(--gray-200); padding: 10px 14px; font-size: 12px; }
        .btn-outline:hover { background: var(--gray-50); border-color: var(--gray-300); color: var(--gray-700); }
        .btn-image { background: transparent; color: var(--purple-600); border: 1.5px solid var(--purple-400); padding: 9px 13px; font-size: 18px; line-height: 1; }
        .btn-image:hover { background: rgba(124, 58, 237, 0.06); border-color: var(--purple-500); }
        .btn-image.has-image { background: var(--purple-100); border-color: var(--purple-500); animation: imageGlow 1.5s ease-in-out infinite; }
        @keyframes imageGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,0.3); } 50% { box-shadow: 0 0 0 8px rgba(124,58,237,0); } }
        .image-preview { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-shrink: 0; padding: 4px 8px; background: rgba(255,255,255,0.6); border-radius: 16px; border: 1px solid var(--gray-200); animation: fadeSlideIn 0.25s ease; }
        .image-preview img { max-width: 50px; max-height: 50px; border-radius: 10px; border: 1px solid var(--gray-200); object-fit: cover; cursor: pointer; transition: var(--transition); }
        .image-preview img:hover { transform: scale(1.05); }
        .image-preview .remove-img { background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 20px; transition: var(--transition); }
        .image-preview .remove-img:hover { background: rgba(239,68,68,0.08); }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) scale(0.85); background: var(--gray-800); color: #fff; padding: 10px 22px; border-radius: 40px; font-size: 13px; opacity: 0; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); pointer-events: none; max-width: 90%; text-align: center; z-index: 999; box-shadow: 0 8px 30px rgba(0,0,0,0.2); font-weight: 500; letter-spacing: 0.3px; }
        .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
        .toast.error { background: #dc2626; box-shadow: 0 8px 30px rgba(220,38,38,0.3); }
        .toast.success { background: #16a34a; box-shadow: 0 8px 30px rgba(22,163,74,0.3); }

        .loader { display: inline-block; width: 16px; height: 16px; border: 2.5px solid var(--gray-200); border-top-color: var(--purple-600); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .suggestions-loader { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; color: var(--gray-500); font-size: 12px; font-weight: 500; }
        .suggestions-loader .loader { width: 20px; height: 20px; border-width: 3px; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0b5bc; }

        .small-btn { padding: 4px 10px; font-size: 11px; border-radius: 20px; }
        hr { margin: 14px 0; border: none; border-top: 1px solid var(--gray-200); }
        .section-divider { margin: 12px 0; border: none; border-top: 1px dashed var(--gray-200); opacity: 0.6; }

        .image-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; cursor: pointer; animation: fadeIn 0.2s ease; }
        .image-modal img { max-width: 95vw; max-height: 90vh; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); object-fit: contain; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 400px) {
            #app { padding: 12px 8px 8px; border-radius: 28px; height: 98vh; }
            .header h1 { font-size: 17px; }
            .chip { font-size: 9px; padding: 3px 8px; }
            .btn { padding: 9px 14px; font-size: 12px; }
            .input-area input { padding: 10px 14px; font-size: 13px; }
            .suggestions-panel { max-height: 30vh; padding: 8px 10px; }
            .suggestion-card .s-text { font-size: 12px; }
            .profile-tag { max-width: 80px; font-size: 10px; }
            .msg-bubble { max-width: 90%; font-size: 12px; padding: 7px 11px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>💬 聊天助手</h1>
            <div class="header-right">
                <span class="profile-tag" id="profileTag" title="点击打开设置">👤 选择对象</span>
                <span class="badge offline" id="statusBadge">⛔ 未连接</span>
                <button class="settings-btn" id="settingsToggle" title="设置">⚙️</button>
            </div>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <label>📦 API 预设</label>
            <div id="presetList"></div>
            <div class="add-preset-row">
                <input type="text" id="newPresetName" placeholder="预设名称">
                <button class="btn" id="addPresetBtn">💾 保存当前</button>
            </div>
            <label>🔑 API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
            <label>🌐 API 地址</label>
            <input type="text" id="apiUrlInput" placeholder="https://api.deepseek.com/v1/chat/completions">
            <div class="hint">DeepSeek默认地址，也支持其他OpenAI兼容API</div>
            <label>🧠 模型名称</label>
            <input type="text" id="modelInput" placeholder="deepseek-chat">
            <div class="hint">视觉识别会自动切换为 deepseek-chat</div>
            <div class="toggle-row">
                <input type="checkbox" id="useAI" checked>
                <label for="useAI">启用 AI 生成</label>
            </div>
            <button class="btn-save" id="saveSettingsBtn">💾 保存配置到预设</button>
            <div class="section-divider"></div>

            <label>🎯 场景管理</label>
            <div class="scenario-input-row">
                <input type="text" id="newScenarioInput" placeholder="新场景名称">
                <button class="btn" id="addScenarioBtn">➕</button>
            </div>
            <div class="tags-wrap" id="scenarioTags"></div>
            <div class="hint">点击场景名称可切换，点击 ✕ 删除</div>
            <div class="section-divider"></div>

            <label>👥 聊天对象</label>
            <div class="object-list" id="objectList"></div>
            <div class="add-object-row">
                <input type="text" id="newObjectName" placeholder="昵称">
                <button class="btn small-btn" id="addObjectBtn">➕ 添加</button>
            </div>
            <label>🤝 关系管理</label>
            <div class="relation-input-row">
                <input type="text" id="newRelationInput" placeholder="关系">
                <button class="btn" id="addRelationBtn">➕</button>
            </div>
            <div class="tags-wrap" id="relationTags"></div>
            <label>✏️ 编辑当前对象</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input type="text" id="profileName" placeholder="昵称" style="flex:1;min-width:55px;">
                <input type="number" id="profileAge" placeholder="年龄" style="flex:0.7;min-width:45px;" min="1" max="120">
            </div>
            <input type="text" id="profileHobby" placeholder="爱好/职业">
            <input type="text" id="profileNote" placeholder="备注">
            <label style="margin-top:6px;">🤝 与我的关系</label>
            <input type="text" id="profileRelationship" placeholder="输入或点击下方标签">
            <div class="tags-wrap" id="profileRelationTags"></div>
            <button class="btn-save" id="saveObjectBtn">💾 更新对象</button>
            <div class="section-divider"></div>

            <label>🧑 我的资料</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input type="text" id="myName" placeholder="我的昵称" style="flex:1;min-width:55px;">
                <input type="number" id="myAge" placeholder="年龄" style="flex:0.7;min-width:45px;" min="1" max="120">
            </div>
            <input type="text" id="myHobby" placeholder="我的爱好/职业">
            <input type="text" id="myNote" placeholder="我的备注">
            <button class="btn-save" id="saveMyProfileBtn" style="margin-top:6px;">💾 保存我的资料</button>
        </div>

        <div class="config-row">
            <div class="config-group">
                <label>🎯 场景</label>
                <div class="chip-group" id="scenarioGroup"></div>
            </div>
            <div class="config-group">
                <label>🎭 风格</label>
                <div class="chip-group" id="styleGroup">
                    <button class="chip" data-value="幽默">😄 幽默</button>
                    <button class="chip" data-value="直球">🎯 直球</button>
                    <button class="chip active" data-value="话题延伸">💬 延伸</button>
                    <button class="chip" data-value="开启话题">🆕 开启</button>
                    <button class="chip" data-value="高情商回复">🧠 高情商</button>
                </div>
            </div>
        </div>

        <div class="quick-bar" id="quickBar">
            <div class="quick-item"><span class="label">🤝</span><span class="value" id="quickRelation">未设置</span></div>
            <div class="quick-item"><span class="label">🎯</span><span class="value" id="quickPurpose">日常闲聊</span></div>
        </div>

        <div class="history-area" id="historyArea">
            <div class="history-empty"><span class="empty-icon">💬</span>添加对象开始聊天</div>
        </div>

        <div class="suggestions-panel" id="suggestionsPanel">
            <div class="s-header">
                <span class="s-title">💡 AI 候选回复</span>
                <button class="s-close" id="closeSuggestionsBtn" title="关闭">✕</button>
            </div>
            <div id="suggestionsContent"></div>
        </div>

        <div class="image-preview" id="imagePreview" style="display:none;">
            <img id="previewImg" alt="预览" title="点击放大">
            <button class="remove-img" id="removeImgBtn" title="移除图片">✕</button>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入对方原话...">
            <div class="btn-group">
                <button class="btn btn-image" id="imageBtn" title="上传图片">📷</button>
                <button class="btn btn-primary" id="sendBtn">🚀 获取</button>
                <button class="btn btn-outline" id="clearHistoryBtn" title="清除记录">🗑️</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== 状态管理 ====================
            const state = {
                objects: [],
                currentObjectId: null,
                config: { scenario: '日常闲聊', style: '话题延伸' },
                isLoading: false,
                apiKey: '',
                apiUrl: 'https://api.deepseek.com/v1/chat/completions',
                model: 'deepseek-chat',
                useAI: true,
                imageBase64: null,
                presets: [],
                currentPreset: '',
                relations: ['朋友', '同事', '恋人', '家人', '客户', '其他'],
                currentSuggestions: null,
                scenarios: ['日常闲聊', '深入交流', '正式沟通'],
                myProfile: { name: '', age: '', hobby: '', note: '' },
                toastTimer: null,
            };

            const $ = id => document.getElementById(id);

            // ==================== DOM引用缓存 ====================
            const dom = {
                historyArea: $('historyArea'),
                toastEl: $('toast'),
                statusBadge: $('statusBadge'),
                profileTag: $('profileTag'),
                messageInput: $('messageInput'),
                sendBtn: $('sendBtn'),
                settingsPanel: $('settingsPanel'),
                settingsToggle: $('settingsToggle'),
                apiKeyInput: $('apiKeyInput'),
                apiUrlInput: $('apiUrlInput'),
                modelInput: $('modelInput'),
                useAICheckbox: $('useAI'),
                profileName: $('profileName'),
                profileAge: $('profileAge'),
                profileHobby: $('profileHobby'),
                profileNote: $('profileNote'),
                profileRelationship: $('profileRelationship'),
                saveSettingsBtn: $('saveSettingsBtn'),
                saveObjectBtn: $('saveObjectBtn'),
                clearHistoryBtn: $('clearHistoryBtn'),
                objectList: $('objectList'),
                newObjectName: $('newObjectName'),
                addObjectBtn: $('addObjectBtn'),
                imageBtn: $('imageBtn'),
                fileInput: $('fileInput'),
                imagePreview: $('imagePreview'),
                previewImg: $('previewImg'),
                removeImgBtn: $('removeImgBtn'),
                presetList: $('presetList'),
                newPresetName: $('newPresetName'),
                addPresetBtn: $('addPresetBtn'),
                quickRelation: $('quickRelation'),
                quickPurpose: $('quickPurpose'),
                relationTags: $('relationTags'),
                profileRelationTags: $('profileRelationTags'),
                newRelationInput: $('newRelationInput'),
                addRelationBtn: $('addRelationBtn'),
                suggestionsPanel: $('suggestionsPanel'),
                suggestionsContent: $('suggestionsContent'),
                closeSuggestionsBtn: $('closeSuggestionsBtn'),
                scenarioTags: $('scenarioTags'),
                newScenarioInput: $('newScenarioInput'),
                addScenarioBtn: $('addScenarioBtn'),
                scenarioGroup: $('scenarioGroup'),
                styleGroup: $('styleGroup'),
                myName: $('myName'),
                myAge: $('myAge'),
                myHobby: $('myHobby'),
                myNote: $('myNote'),
                saveMyProfileBtn: $('saveMyProfileBtn'),
            };

            // ==================== 工具函数 ====================
            function showToast(m, d = 2000, type = '') {
                const el = dom.toastEl;
                el.textContent = m;
                el.className = 'toast ' + type;
                el.classList.add('show');
                clearTimeout(state.toastTimer);
                state.toastTimer = setTimeout(() => el.classList.remove('show'), d);
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function toAscii(str) {
                return str.replace(/[^\x00-\x7F]/g, '');
            }

            function getConfig() {
                const scenario = document.querySelector('#scenarioGroup .chip.active')?.dataset.value || state.config.scenario || '日常闲聊';
                const style = document.querySelector('#styleGroup .chip.active')?.dataset.value || '话题延伸';
                return { scenario, style };
            }

            function getCurrentObject() {
                return state.objects.find(o => o.id === state.currentObjectId) || null;
            }

            function getCurrentHistory() {
                const o = getCurrentObject();
                return o ? o.history : [];
            }

            function isStyleOpeningTopic() {
                return document.querySelector('#styleGroup .chip.active')?.dataset.value === '开启话题';
            }

            function updateStatusBadge() {
                const hasKey = state.apiKey && state.apiKey.trim().length > 0;
                const badge = dom.statusBadge;
                if (state.useAI && hasKey) {
                    badge.textContent = '🤖 AI 在线';
                    badge.className = 'badge online';
                } else if (!state.useAI) {
                    badge.textContent = '⛔ AI 禁用';
                    badge.className = 'badge offline';
                } else {
                    badge.textContent = '⚠️ 缺少 Key';
                    badge.className = 'badge warning';
                }
            }

            function updateQuickPurposeText() {
                dom.quickPurpose.textContent = getConfig().scenario || '日常闲聊';
            }

            function updatePlaceholder() {
                dom.messageInput.placeholder = isStyleOpeningTopic() ? '输入话题方向（可选）或留空自动生成' : '输入对方原话...';
            }

            function updateImageBtnState() {
                if (state.imageBase64) {
                    dom.imageBtn.classList.add('has-image');
                    dom.imageBtn.textContent = '📷✓';
                } else {
                    dom.imageBtn.classList.remove('has-image');
                    dom.imageBtn.textContent = '📷';
                }
            }

            // ==================== 存储 ====================
            function saveToStorage() {
                try {
                    const data = {
                        objects: state.objects,
                        currentObjectId: state.currentObjectId,
                        apiKey: state.apiKey,
                        apiUrl: state.apiUrl,
                        model: state.model,
                        useAI: state.useAI,
                        presets: state.presets,
                        currentPreset: state.currentPreset,
                        relations: state.relations,
                        currentSuggestions: state.currentSuggestions,
                        scenarios: state.scenarios,
                        config: state.config,
                        myProfile: state.myProfile,
                    };
                    localStorage.setItem('chat_data_v2', JSON.stringify(data));
                } catch (e) {}
            }

            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem('chat_data_v2') || localStorage.getItem('chat_data');
                    if (raw) {
                        const data = JSON.parse(raw);
                        state.objects = data.objects || [];
                        state.currentObjectId = data.currentObjectId || null;
                        state.apiKey = data.apiKey || '';
                        state.apiUrl = data.apiUrl || 'https://api.deepseek.com/v1/chat/completions';
                        state.model = data.model || 'deepseek-chat';
                        state.useAI = data.useAI !== undefined ? data.useAI : true;
                        state.presets = data.presets || [];
                        state.currentPreset = data.currentPreset || '';
                        state.relations = data.relations || ['朋友', '同事', '恋人', '家人', '客户', '其他'];
                        state.currentSuggestions = data.currentSuggestions || null;
                        state.scenarios = data.scenarios || ['日常闲聊', '深入交流', '正式沟通'];
                        state.config = data.config || { scenario: '日常闲聊', style: '话题延伸' };
                        state.myProfile = data.myProfile || { name: '', age: '', hobby: '', note: '' };
                        if (!state.scenarios.includes(state.config.scenario)) {
                            state.config.scenario = state.scenarios[0] || '日常闲聊';
                        }
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            function initDefaultState() {
                state.objects = [];
                state.currentObjectId = null;
                state.presets = [];
                state.currentPreset = '';
                state.relations = ['朋友', '同事', '恋人', '家人', '客户', '其他'];
                state.currentSuggestions = null;
                state.scenarios = ['日常闲聊', '深入交流', '正式沟通'];
                state.config = { scenario: '日常闲聊', style: '话题延伸' };
                state.myProfile = { name: '', age: '', hobby: '', note: '' };
            }

            // ==================== 场景/关系/对象渲染（不变） ====================
            function renderScenarioTags() {
                let html = '';
                state.scenarios.forEach(s => {
                    html += `<span class="tag" data-scenario="${escapeHtml(s)}">${escapeHtml(s)}<button class="del-tag" data-scenario="${escapeHtml(s)}">✕</button></span>`;
                });
                dom.scenarioTags.innerHTML = html;
                dom.scenarioTags.querySelectorAll('.tag').forEach(tag => {
                    tag.addEventListener('click', function(e) {
                        if (e.target.closest('.del-tag')) return;
                        const scenario = this.dataset.scenario;
                        document.querySelectorAll('#scenarioGroup .chip').forEach(c => c.classList.remove('active'));
                        const targetChip = document.querySelector(`#scenarioGroup .chip[data-value="${CSS.escape(scenario)}"]`);
                        if (targetChip) targetChip.classList.add('active');
                        state.config.scenario = scenario;
                        updateQuickPurposeText();
                        saveToStorage();
                        const obj = getCurrentObject();
                        if (obj && obj.history && obj.history.some(m => m.role === 'girl')) regenerateSuggestions();
                        showToast(`场景切换为：${scenario}`, 1000, 'success');
                    });
                });
                dom.scenarioTags.querySelectorAll('.del-tag').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const scenario = this.dataset.scenario;
                        if (state.scenarios.length <= 1) { showToast('至少保留一个场景', 1000); return; }
                        if (confirm(`删除场景 "${scenario}" ？`)) {
                            state.scenarios = state.scenarios.filter(s => s !== scenario);
                            if (state.config.scenario === scenario) state.config.scenario = state.scenarios[0];
                            saveToStorage();
                            renderScenarioTags();
                            renderScenarioChips();
                            updateQuickPurposeText();
                            showToast('已删除', 1000);
                        }
                    });
                });
            }

            function renderScenarioChips() {
                dom.scenarioGroup.innerHTML = '';
                state.scenarios.forEach(s => {
                    const chip = document.createElement('button');
                    chip.className = 'chip' + (s === state.config.scenario ? ' active' : '');
                    chip.dataset.value = s;
                    chip.textContent = s;
                    chip.addEventListener('click', function() {
                        const scenario = this.dataset.value;
                        document.querySelectorAll('#scenarioGroup .chip').forEach(c => c.classList.remove('active'));
                        this.classList.add('active');
                        state.config.scenario = scenario;
                        updateQuickPurposeText();
                        saveToStorage();
                        const obj = getCurrentObject();
                        if (obj && obj.history && obj.history.some(m => m.role === 'girl')) regenerateSuggestions();
                        showToast(`场景：${scenario}`, 1000, 'success');
                    });
                    dom.scenarioGroup.appendChild(chip);
                });
            }

            function addScenario(name) {
                name = name.trim();
                if (!name) { showToast('请输入场景名称', 1000); return; }
                if (state.scenarios.includes(name)) { showToast('已存在', 1000); return; }
                state.scenarios.push(name);
                if (!state.config.scenario) state.config.scenario = name;
                saveToStorage();
                renderScenarioTags();
                renderScenarioChips();
                updateQuickPurposeText();
                showToast(`已添加场景：${name}`, 1000, 'success');
            }

            function renderPresets() {
                if (state.presets.length === 0) {
                    dom.presetList.innerHTML = '<div style="color:#9ca3af;font-size:12px;padding:4px 0;">暂无预设，填写API信息后保存</div>';
                    return;
                }
                let html = '';
                state.presets.forEach(p => {
                    const active = p.name === state.currentPreset ? '▶️ ' : '';
                    const maskedKey = p.apiKey ? p.apiKey.substring(0, 8) + '...' + p.apiKey.substring(p.apiKey.length - 4) : '无Key';
                    html += `<div class="preset-item"><span class="name" data-name="${escapeHtml(p.name)}" title="Key: ${escapeHtml(maskedKey)} | 模型: ${escapeHtml(p.model)}">${active}${escapeHtml(p.name)}</span><button class="del-preset" data-name="${escapeHtml(p.name)}">✕</button></div>`;
                });
                dom.presetList.innerHTML = html;
                dom.presetList.querySelectorAll('.name').forEach(el => {
                    el.addEventListener('click', function() {
                        const name = this.dataset.name;
                        const preset = state.presets.find(p => p.name === name);
                        if (preset) {
                            state.apiKey = preset.apiKey;
                            state.apiUrl = preset.apiUrl;
                            state.model = preset.model;
                            state.currentPreset = name;
                            dom.apiKeyInput.value = preset.apiKey;
                            dom.apiUrlInput.value = preset.apiUrl;
                            dom.modelInput.value = preset.model;
                            saveToStorage();
                            updateStatusBadge();
                            showToast(`已切换：${name}`, 1500, 'success');
                            renderPresets();
                        }
                    });
                });
                dom.presetList.querySelectorAll('.del-preset').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const name = this.dataset.name;
                        if (confirm(`删除预设 "${name}" ？`)) {
                            state.presets = state.presets.filter(p => p.name !== name);
                            if (state.currentPreset === name) state.currentPreset = '';
                            saveToStorage();
                            renderPresets();
                            showToast('已删除', 1000);
                        }
                    });
                });
            }

            function saveCurrentAsPreset(name) {
                if (!name.trim()) { showToast('请输入名称', 1000); return; }
                const key = toAscii(dom.apiKeyInput.value.trim());
                const url = toAscii(dom.apiUrlInput.value.trim()) || 'https://api.deepseek.com/v1/chat/completions';
                const model = toAscii(dom.modelInput.value.trim()) || 'deepseek-chat';
                if (!key) { showToast('API Key不能为空', 1000); return; }

            // ==================== 图片处理（关键修复） ====================
            function compressImage(dataUrl, maxBytes = 800 * 1024, maxWidth = 2048, maxHeight = 2048) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        // 限制最大尺寸，避免API拒绝
                        if (w > maxWidth || h > maxHeight) {
                            const ratio = Math.min(maxWidth / w, maxHeight / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        let quality = 0.9;
                        const tryCompress = (q) => {
                            const result = canvas.toDataURL('image/jpeg', q);
                            if (result.length < maxBytes || q < 0.1) {
                                resolve(result);
                            } else {
                                tryCompress(q - 0.05);
                            }
                        };
                        tryCompress(quality);
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                });
            }

            function handleImageSelect(file) {
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast('请选择图片文件', 1000, 'error'); return; }
                if (file.size > 20 * 1024 * 1024) { showToast('图片最大20MB', 2000, 'error'); return; }
                const reader = new FileReader();
                reader.onload = async e => {
                    try {
                        const compressed = await compressImage(e.target.result);
                        state.imageBase64 = compressed;
                        dom.previewImg.src = compressed;
                        dom.imagePreview.style.display = 'flex';
                        updateImageBtnState();
                        showToast('✅ 图片已加载', 1000, 'success');
                    } catch (err) {
                        showToast('❌ 图片处理失败', 2000, 'error');
                    }
                };
                reader.onerror = () => showToast('❌ 读取图片失败', 2000, 'error');
                reader.readAsDataURL(file);
            }

            // ==================== AI调用（修复400错误的核心） ====================
            async function callAI(girlMessage, history, config, imageBase64, relation, purpose, isOpening = false) {
                const cleanKey = toAscii(state.apiKey).trim();
                if (!cleanKey) throw new Error('API Key 无效，请在设置中配置');

                const cleanUrl = toAscii(state.apiUrl).trim();
                if (!cleanUrl || !cleanUrl.startsWith('http')) throw new Error('API 地址无效');

                let cleanModel = toAscii(state.model).trim() || 'deepseek-chat';
                const isDeepSeek = cleanUrl.includes('deepseek.com');

                // 图片处理：确保格式正确且尺寸已压缩
                let imageData = null;
                if (imageBase64) {
                    // 统一添加正确的前缀
                    imageData = imageBase64.startsWith('data:image') ? imageBase64 : 'data:image/jpeg;base64,' + imageBase64;
                    // DeepSeek 视觉模型强制使用 deepseek-chat
                    if (isDeepSeek) cleanModel = 'deepseek-chat';
                }

                const o = getCurrentObject();
                const profileText = o ? `对方信息：${o.name||'未命名'}${o.age?'，'+o.age+'岁':''}${o.hobby?'，喜欢/从事 '+o.hobby:''}${o.note?'，备注：'+o.note:''}` : '';
                const my = state.myProfile;
                const myText = my.name ? `我（${my.name}${my.age?'，'+my.age+'岁':''}${my.hobby?'，爱好/职业 '+my.hobby:''}${my.note?'，备注：'+my.note:''}）` : '我';

                let styleInstruction = '';
                switch (config.style) {
                    case '幽默': styleInstruction = '用轻松幽默口语回应，像朋友聊天，可自嘲调侃，带emoji。'; break;
                    case '直球': styleInstruction = '直接、自信、简洁，不绕弯子。'; break;
                    case '话题延伸': styleInstruction = '提出开放性问题或分享经历，引导深入。'; break;
                    case '开启话题': styleInstruction = '生成全新话题开场白，自然有趣，结合对方信息。'; break;
                    case '高情商回复': styleInstruction = '高情商回应，注重共情、温和、体面。'; break;
                    default: styleInstruction = '自然口语化回应。';
                }

                let systemPrompt = `你是一位聊天高手。回答要口语化、有语气词。
        ${profileText}
        我的信息：${myText}
        关系：${relation}　场景：${config.scenario}　风格：${config.style}
        要求：${styleInstruction}
        禁止书面语、说教。每条建议像微信原话，不超过30字。
        对方抱怨先共情，分享先回应情绪。
        输出纯JSON，含"analysis"和"suggestions"(3条，每条含text,reason,expectedEffect)。`;

                if (isOpening) systemPrompt += `\n当前为"开启话题"风格，生成3个有趣开场白。`;

                const messages = [{ role: 'system', content: systemPrompt }];
                let userContent = [];
                if (girlMessage && girlMessage.trim() && girlMessage !== '请生成开场白') {
                    userContent.push({ type: 'text', text: '对方说：' + girlMessage });
                }
                if (imageData) {
                    userContent.push({ type: 'image_url', image_url: { url: imageData } });
                }
                if (userContent.length === 0) {
                    userContent.push({ type: 'text', text: '请生成3个开场白建议' });
                }
                messages.push({ role: 'user', content: userContent });

                // 构建请求体，绝不包含 response_format
                const payload = {
                    model: cleanModel,
                    messages: messages,
                    temperature: 1.0,
                    max_tokens: 600,
                };

                let resp;
                try {
                    resp = await fetch(cleanUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${cleanKey}`,
                        },
                        body: JSON.stringify(payload),
                        signal: AbortSignal.timeout(60000),
                    });
                } catch (fetchErr) {
                    if (fetchErr.name === 'TimeoutError') throw new Error('请求超时（60秒）');
                    throw new Error('网络错误：' + fetchErr.message);
                }

                if (!resp.ok) {
                    let errText = await resp.text();
                    try {
                        const errJson = JSON.parse(errText);
                        errText = errJson.error?.message || errJson.message || errText;
                    } catch (e) {}
                    if (resp.status === 400) throw new Error(`请求参数错误(400)：${errText.substring(0,200)}`);
                    if (resp.status === 401) throw new Error('API Key无效');
                    if (resp.status === 429) throw new Error('请求过于频繁，请稍后');
                    if (resp.status === 404) throw new Error('API地址不存在(404)');
                    throw new Error(`API错误(${resp.status}): ${errText.substring(0,150)}`);
                }

                const data = await resp.json();
                const content = data.choices[0].message.content;
                let parsed;
                try { parsed = JSON.parse(content); } catch (e1) {
                    const m = content.match(/```json\s*([\s\S]*?)\s*```/);
                    if (m) try { parsed = JSON.parse(m[1]); } catch (e2) {}
                    if (!parsed) {
                        const b = content.match(/\{[\s\S]*\}/);
                        if (b) try { parsed = JSON.parse(b[0]); } catch (e3) {}
                    }
                    if (!parsed) throw new Error('AI返回格式错误');
                }
                if (!parsed.suggestions || parsed.suggestions.length < 3) throw new Error('AI未生成足够建议');
                return parsed;
            }

            async function regenerateSuggestions() {
                const obj = getCurrentObject();
                if (!obj) { showToast('请先选择对象', 1000); return; }
                const history = obj.history || [];
                let lastGirlMsg = null;
                for (let i = history.length - 1; i >= 0; i--) { if (history[i].role === 'girl') { lastGirlMsg = history[i]; break; } }
                if (!lastGirlMsg && !isStyleOpeningTopic()) { showToast('暂无对方消息', 1500); return; }
                if (!state.useAI || !state.apiKey) { showToast('AI未启用或无Key', 2000, 'error'); return; }
                await executeAICall(lastGirlMsg, history);
            }

            async function handleSend() {
                if (state.isLoading) return;
                if (!getCurrentObject()) { showToast('请先添加对象', 1500); return; }
                const input = dom.messageInput.value.trim();
                const isOpening = isStyleOpeningTopic();
                if (!input && !state.imageBase64 && !isOpening) { showToast('请输入文字或上传图片', 1000); return; }
                if (!state.useAI || !state.apiKey) { showToast('AI未启用或无Key', 2000, 'error'); return; }

                let finalText = input || (state.imageBase64 ? '请描述这张图片' : '请生成开场白');
                pushHistory('girl', finalText);
                dom.messageInput.value = '';
                renderHistory();
                await executeAICall({ role: 'girl', content: finalText }, getCurrentHistory());
            }

            async function executeAICall(lastGirlMsg, history) {
                state.isLoading = true;
                dom.sendBtn.disabled = true;
                dom.sendBtn.innerHTML = '<span class="loader"></span>生成中';
                dom.suggestionsPanel.classList.add('show');
                dom.suggestionsContent.innerHTML = '<div class="suggestions-loader"><span class="loader"></span>AI 正在生成建议...</div>';
                const config = getConfig();
                const o = getCurrentObject();
                const relation = o?.relationship || '未设置';
                const isOpening = isStyleOpeningTopic();
                const girlMsg = lastGirlMsg ? lastGirlMsg.content : (isOpening ? '请生成开场白' : '');

                try {
                    const r = await callAI(girlMsg, history, config, state.imageBase64, relation, '闲聊', isOpening);
                    state.currentSuggestions = { suggestions: r.suggestions, analysis: r.analysis };
                    renderSuggestionsPanel();
                    saveToStorage();
                    showToast('💡 已生成候选回复', 1000, 'success');
                } catch (err) {
                    showToast('❌ ' + err.message, 4000, 'error');
                    const o2 = getCurrentObject();
                    if (o2 && o2.history.length > 0 && o2.history[o2.history.length - 1].role === 'girl') {
                        o2.history.pop(); renderHistory(); saveToStorage();
                    }
                    state.currentSuggestions = null;
                    renderSuggestionsPanel();
                } finally {
                    state.isLoading = false;
                    dom.sendBtn.disabled = false;
                    dom.sendBtn.innerHTML = '🚀 获取';
                    if (!state.currentSuggestions) dom.suggestionsPanel.classList.remove('show');
                    clearImage();
                }
            }

            // ==================== 我的资料 ====================
            function saveMyProfile() {
                state.myProfile.name = dom.myName.value.trim();
                state.myProfile.age = parseInt(dom.myAge.value) || '';
                state.myProfile.hobby = dom.myHobby.value.trim();
                state.myProfile.note = dom.myNote.value.trim();
                saveToStorage();
                showToast('我的资料已保存', 1500, 'success');
            }

            // ==================== 事件绑定 ====================
            function bindEvents() {
                dom.settingsToggle.addEventListener('click', () => dom.settingsPanel.classList.toggle('show'));
                dom.profileTag.addEventListener('click', () => dom.settingsPanel.classList.toggle('show'));
                dom.apiKeyInput.addEventListener('input', () => { state.apiKey = dom.apiKeyInput.value; updateStatusBadge(); });
                dom.apiUrlInput.addEventListener('input', () => { state.apiUrl = dom.apiUrlInput.value; });
                dom.modelInput.addEventListener('input', () => { state.model = dom.modelInput.value; });
                dom.useAICheckbox.addEventListener('change', () => { state.useAI = dom.useAICheckbox.checked; updateStatusBadge(); saveToStorage(); });
                dom.addObjectBtn.addEventListener('click', () => { addObject(dom.newObjectName.value.trim()); dom.newObjectName.value = ''; });
                dom.newObjectName.addEventListener('keydown', e => { if (e.key === 'Enter') { addObject(dom.newObjectName.value.trim()); dom.newObjectName.value = ''; } });
                dom.saveObjectBtn.addEventListener('click', saveObjectDetails);
                dom.saveSettingsBtn.addEventListener('click', () => saveCurrentAsPreset(dom.newPresetName.value.trim() || '默认配置'));
                dom.addPresetBtn.addEventListener('click', () => { const n = dom.newPresetName.value.trim(); if (!n) { showToast('请输入名称', 1000); return; } saveCurrentAsPreset(n); dom.newPresetName.value = ''; });
                dom.clearHistoryBtn.addEventListener('click', () => { if (confirm('清除所有聊天记录？')) { const o = getCurrentObject(); if (o) { o.history = []; state.currentSuggestions = null; renderHistory(); renderSuggestionsPanel(); saveToStorage(); showToast('已清除', 1000, 'success'); } } });
                dom.sendBtn.addEventListener('click', handleSend);
                dom.messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handleSend(); } });
                dom.imageBtn.addEventListener('click', () => dom.fileInput.click());
                dom.fileInput.addEventListener('change', e => { if (e.target.files.length > 0) handleImageSelect(e.target.files[0]); });
                dom.removeImgBtn.addEventListener('click', clearImage);
                dom.previewImg.addEventListener('click', () => { if (dom.previewImg.src?.startsWith('data:image')) showImageModal(dom.previewImg.src); });
                dom.closeSuggestionsBtn.addEventListener('click', closeSuggestionsPanel);
                dom.addRelationBtn.addEventListener('click', () => { addRelation(dom.newRelationInput.value); dom.newRelationInput.value = ''; });
                dom.newRelationInput.addEventListener('keydown', e => { if (e.key === 'Enter') { addRelation(dom.newRelationInput.value); dom.newRelationInput.value = ''; } });
                dom.addScenarioBtn.addEventListener('click', () => { addScenario(dom.newScenarioInput.value); dom.newScenarioInput.value = ''; });
                dom.newScenarioInput.addEventListener('keydown', e => { if (e.key === 'Enter') { addScenario(dom.newScenarioInput.value); dom.newScenarioInput.value = ''; } });
                dom.saveMyProfileBtn.addEventListener('click', saveMyProfile);
                document.querySelectorAll('#styleGroup .chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        document.querySelectorAll('#styleGroup .chip').forEach(c => c.classList.remove('active'));
                        this.classList.add('active');
                        updatePlaceholder();
                        saveToStorage();
                        const obj = getCurrentObject();
                        if (!obj) { showToast('请先选择对象', 1000); return; }
                        if (!obj.history?.some(m => m.role === 'girl') && !isStyleOpeningTopic()) { showToast('暂无对方消息', 1200); return; }
                        regenerateSuggestions();
                    });
                });
                document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSuggestionsPanel(); dom.settingsPanel.classList.remove('show'); } });
            }

            // ==================== 初始化 ====================
            function init() {
                if (!loadFromStorage()) initDefaultState();
                dom.apiKeyInput.value = state.apiKey;
                dom.apiUrlInput.value = state.apiUrl;
                dom.modelInput.value = state.model;
                dom.useAICheckbox.checked = state.useAI;
                dom.myName.value = state.myProfile.name || '';
                dom.myAge.value = state.myProfile.age || '';
                dom.myHobby.value = state.myProfile.hobby || '';
                dom.myNote.value = state.myProfile.note || '';
                renderObjectList();
                loadCurrentObject();
                updateStatusBadge();
                renderPresets();
                renderRelations();
                renderSuggestionsPanel();
                renderScenarioTags();
                renderScenarioChips();
                updateQuickPurposeText();
                updatePlaceholder();
                updateImageBtnState();
                bindEvents();
                saveToStorage();
                showToast('💡 图片发送已修复，支持DeepSeek视觉', 2000, 'success');
            }

            window.copySuggestionFromPanel = copySuggestionFromPanel;
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
